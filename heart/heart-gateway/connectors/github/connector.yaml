# GitHub's REST API: pull requests and issues (spec/PLAN-GITHUB-PULLS.md, spec/PLAN-GITHUB-ISSUES.md).
# Run the gateway with GATEWAY_CONNECTOR pointing here, UPSTREAM_URL=https://api.github.com,
# UPSTREAM_SPEC at GitHub's description (github/rest-api-description, api.github.com.json),
# and UPSTREAM_AUTH=caller, so GitHub is called as each caller, with their own token.
profile: github
# Only these operations of GitHub's description are read; the rest is left out before parsing.
include:
  - pulls/list
  - pulls/get
  - pulls/update
  - pulls/merge
  - pulls/update-branch
  - pulls/request-reviewers
  - issues/list-for-repo
  - issues/get
  - issues/create
  - issues/update
  - issues/lock
  - issues/unlock
  - issues/add-labels
  - issues/remove-label
  - issues/add-assignees
  - issues/remove-assignees
  - issues/list-comments
  - issues/get-comment
  - issues/update-comment
  - issues/create-comment
  - issues/list-sub-issues
  - issues/add-sub-issue
  - issues/remove-sub-issue
  - repos/get
  - users/get-authenticated
# Every call to GitHub names the API version it was written against.
headers:
  X-GitHub-Api-Version: "2022-11-28"
resources:
  - pull.resource.yaml
  - issue.resource.yaml
  - repository.resource.yaml
  - comment.resource.yaml
readers:
  - pull.reader.yaml
  - issue.reader.yaml
  - repository.reader.yaml
  - comment.reader.yaml
