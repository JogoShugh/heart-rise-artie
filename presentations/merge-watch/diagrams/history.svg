<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="history-title history-desc">
<title id="history-title">Hypertext, 1945 to now</title>
<desc id="history-desc">Linked information is old: Bush's memex, Nelson's word, Engelbart's NLS and HyperCard each came with their own reader. The Web split the generic client from the content in 1991, Fielding named its architecture in 2000, APIs moved the rules into descriptions and training, and HEART puts the controls back in the answer.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="history-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<path class="line" d="M40 235 L920 235"/>
<rect class="ghost" x="80" y="221" width="232" height="28" rx="14"/>
<circle class="head" cx="100" cy="235" r="6"/>
<path class="dash" d="M100 223 L100 185"/>
<text class="h" x="100" y="125" text-anchor="middle">1945</text>
<text class="s" x="100" y="144" text-anchor="middle">Bush: memex</text>
<text class="s" x="100" y="163" text-anchor="middle">trails of documents</text>
<circle class="head" cx="164" cy="235" r="6"/>
<path class="dash" d="M164 247 L164 285"/>
<text class="h" x="164" y="311" text-anchor="middle">1965</text>
<text class="s" x="164" y="330" text-anchor="middle">Nelson coins</text>
<text class="s" x="164" y="349" text-anchor="middle">“hypertext”</text>
<circle class="head" cx="228" cy="235" r="6"/>
<path class="dash" d="M228 223 L228 185"/>
<text class="h" x="228" y="125" text-anchor="middle">1968</text>
<text class="s" x="228" y="144" text-anchor="middle">Engelbart: NLS</text>
<text class="s" x="228" y="163" text-anchor="middle">links, one system</text>
<circle class="head" cx="292" cy="235" r="6"/>
<path class="dash" d="M292 247 L292 285"/>
<text class="h" x="292" y="311" text-anchor="middle">1987</text>
<text class="s" x="292" y="330" text-anchor="middle">HyperCard</text>
<text class="s" x="292" y="349" text-anchor="middle">stacks, one reader</text>
<circle class="head" cx="356" cy="235" r="6"/>
<path class="dash" d="M356 223 L356 185"/>
<text class="h" x="356" y="125" text-anchor="middle">1989</text>
<text class="s" x="356" y="144" text-anchor="middle">Berners-Lee</text>
<text class="s" x="356" y="163" text-anchor="middle">proposal at CERN</text>
<circle class="a" cx="420" cy="235" r="9"/>
<path class="dash" d="M420 247 L420 285"/>
<text class="h" x="420" y="311" text-anchor="middle">1991</text>
<text class="s" x="420" y="330" text-anchor="middle">The Web, public</text>
<text class="s" x="420" y="349" text-anchor="middle">URI, HTTP, HTML</text>
<circle class="head" cx="484" cy="235" r="6"/>
<path class="dash" d="M484 223 L484 185"/>
<text class="h" x="484" y="125" text-anchor="middle">1993</text>
<text class="s" x="484" y="144" text-anchor="middle">Mosaic, forms</text>
<text class="s" x="484" y="163" text-anchor="middle">links and forms</text>
<circle class="a" cx="548" cy="235" r="9"/>
<path class="dash" d="M548 247 L548 285"/>
<text class="h" x="548" y="311" text-anchor="middle">2000</text>
<text class="s" x="548" y="330" text-anchor="middle">Fielding: REST</text>
<text class="s" x="548" y="349" text-anchor="middle">dissertation</text>
<circle class="head" cx="612" cy="235" r="6"/>
<path class="dash" d="M612 223 L612 185"/>
<text class="h" x="612" y="125" text-anchor="middle">2008</text>
<text class="s" x="612" y="144" text-anchor="middle">“must be</text>
<text class="s" x="612" y="163" text-anchor="middle">hypertext-driven”</text>
<circle class="head" cx="676" cy="235" r="6"/>
<path class="dash" d="M676 247 L676 285"/>
<text class="h" x="676" y="311" text-anchor="middle">2012</text>
<text class="s" x="676" y="330" text-anchor="middle">HAL draft</text>
<text class="s" x="676" y="349" text-anchor="middle">links in JSON</text>
<circle class="head" cx="740" cy="235" r="6"/>
<path class="dash" d="M740 223 L740 185"/>
<text class="h" x="740" y="125" text-anchor="middle">2017</text>
<text class="s" x="740" y="144" text-anchor="middle">OpenAPI 3.0</text>
<text class="s" x="740" y="163" text-anchor="middle">rules in a spec</text>
<circle class="head" cx="804" cy="235" r="6"/>
<path class="dash" d="M804 247 L804 285"/>
<text class="h" x="804" y="311" text-anchor="middle">2023</text>
<text class="s" x="804" y="330" text-anchor="middle">LLM agents</text>
<text class="s" x="804" y="349" text-anchor="middle">rules in training</text>
<circle class="a" cx="868" cy="235" r="9"/>
<path class="dash" d="M868 223 L868 185"/>
<text class="h" x="868" y="125" text-anchor="middle">2026</text>
<text class="s" x="868" y="144" text-anchor="middle">HEART + ARTIE</text>
<text class="s" x="868" y="163" text-anchor="middle">controls in answers</text>
<text class="s" x="196" y="40" text-anchor="middle">Islands: each system its own reader</text>
<text class="s" x="480" y="445" text-anchor="middle">The Web splits client from content; then APIs move the rules out of the answer again</text>
</svg>
