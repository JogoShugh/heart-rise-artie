<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="islands-title islands-desc">
<title id="islands-title">Hypertext before and after the Web</title>
<desc id="islands-desc">A timeline: Memex in 1945, Nelson's hypertext in 1965, NLS in 1968, HyperCard in 1987, each with a client of its own; then the Web in 1991, where any browser reads any site.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="islands-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<path class="line" d="M40 210 L920 210"/>
<path class="line" d="M110 170 L110 210"/>
<circle class="a" cx="110" cy="210" r="6"/>
<text class="s" x="110" y="238" text-anchor="middle">1945</text>
<rect class="box" x="38" y="92" width="144" height="78" rx="10"/>
<text class="h" x="110" y="126" text-anchor="middle">Memex</text>
<text class="s" x="110" y="146" text-anchor="middle">a desk, never built</text>
<path class="line" d="M280 170 L280 210"/>
<circle class="a" cx="280" cy="210" r="6"/>
<text class="s" x="280" y="238" text-anchor="middle">1965</text>
<rect class="box" x="208" y="92" width="144" height="78" rx="10"/>
<text class="h" x="280" y="126" text-anchor="middle">Hypertext</text>
<text class="s" x="280" y="146" text-anchor="middle">Nelson's word</text>
<path class="line" d="M450 170 L450 210"/>
<circle class="a" cx="450" cy="210" r="6"/>
<text class="s" x="450" y="238" text-anchor="middle">1968</text>
<rect class="box" x="378" y="92" width="144" height="78" rx="10"/>
<text class="h" x="450" y="126" text-anchor="middle">NLS</text>
<text class="s" x="450" y="146" text-anchor="middle">its own terminal</text>
<path class="line" d="M620 170 L620 210"/>
<circle class="a" cx="620" cy="210" r="6"/>
<text class="s" x="620" y="238" text-anchor="middle">1987</text>
<rect class="box" x="548" y="92" width="144" height="78" rx="10"/>
<text class="h" x="620" y="126" text-anchor="middle">HyperCard</text>
<text class="s" x="620" y="146" text-anchor="middle">its own app</text>
<path class="line" d="M820 170 L820 210"/>
<circle class="a" cx="820" cy="210" r="9"/>
<text class="s" x="820" y="238" text-anchor="middle">1991</text>
<rect class="hl" x="725" y="72" width="190" height="98" rx="10"/>
<text class="h" x="820" y="116" text-anchor="middle">The Web</text>
<text class="s" x="820" y="136" text-anchor="middle">any browser, any site</text>
<text class="s" x="480" y="286" text-anchor="middle">Each early system came with its own client.</text>
<text class="s" x="480" y="306" text-anchor="middle">The Web split the client from the content, and agreed only on formats.</text>
</svg>
