<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="blank-title blank-desc">
<title id="blank-title">An agent facing data with no controls</title>
<desc id="blank-desc">A pull request as JSON: its number, state, title and URLs. Nothing in it says whether it can be merged now, how, or with what. The agent is left asking.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="blank-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="box" x="40" y="40" width="460" height="250" rx="10"/>
<text class="m" x="60" y="76" text-anchor="start">{ &quot;number&quot;: 20,</text>
<text class="m" x="60" y="106" text-anchor="start">  &quot;state&quot;: &quot;open&quot;,</text>
<text class="m" x="60" y="136" text-anchor="start">  &quot;title&quot;: &quot;Bump left-pad&quot;,</text>
<text class="m" x="60" y="166" text-anchor="start">  &quot;mergeable_state&quot;: &quot;unknown&quot;,</text>
<text class="m" x="60" y="196" text-anchor="start">  &quot;url&quot;: &quot;https://api.github.com/…&quot;,</text>
<text class="m" x="60" y="226" text-anchor="start">  … }</text>
<rect class="hl" x="700" y="130" width="220" height="80" rx="10"/>
<text class="h" x="810" y="165" text-anchor="middle">An agent</text>
<text class="s" x="810" y="185" text-anchor="middle">what can I do now?</text>
<rect class="ghost" x="540" y="50" width="120" height="36" rx="18"/>
<text class="s" x="600" y="73" text-anchor="middle">merge it?</text>
<path class="dash" d="M698 170 L662 68" marker-end="url(#blank-head)"/>
<rect class="ghost" x="540" y="140" width="120" height="36" rx="18"/>
<text class="s" x="600" y="163" text-anchor="middle">with what?</text>
<path class="dash" d="M698 170 L662 158" marker-end="url(#blank-head)"/>
<rect class="ghost" x="540" y="230" width="120" height="36" rx="18"/>
<text class="s" x="600" y="253" text-anchor="middle">allowed now?</text>
<path class="dash" d="M698 170 L662 248" marker-end="url(#blank-head)"/>
</svg>
