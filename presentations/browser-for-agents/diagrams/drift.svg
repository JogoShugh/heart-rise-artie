<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="drift-title drift-desc">
<title id="drift-title">Where the rules live, era by era</title>
<desc id="drift-desc">On the Web the rules arrive in the page. With RPC they moved to interface files, with JSON APIs to documentation, with OpenAPI to a description of every operation, and for LLM agents to training data: each step further from the answer a client holds.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="drift-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<path class="accline" d="M60 70 L920 70"/>
<text class="s" x="70" y="56" text-anchor="start">In the answer itself</text>
<path class="dash" d="M120 70 L300 150 L480 210 L660 260 L840 310"/>
<circle class="a" cx="120" cy="70" r="7"/>
<text class="t" x="120" y="100" text-anchor="middle">The Web</text>
<text class="s" x="120" y="120" text-anchor="middle">in the page</text>
<circle class="a" cx="300" cy="150" r="7"/>
<text class="t" x="300" y="180" text-anchor="middle">RPC, SOAP</text>
<text class="s" x="300" y="200" text-anchor="middle">in an interface file</text>
<circle class="a" cx="480" cy="210" r="7"/>
<text class="t" x="480" y="240" text-anchor="middle">JSON over HTTP</text>
<text class="s" x="480" y="260" text-anchor="middle">in documentation</text>
<circle class="a" cx="660" cy="260" r="7"/>
<text class="t" x="660" y="290" text-anchor="middle">OpenAPI</text>
<text class="s" x="660" y="310" text-anchor="middle">in a description of all</text>
<circle class="a" cx="840" cy="310" r="7"/>
<text class="t" x="840" y="340" text-anchor="middle">LLM agents</text>
<text class="s" x="840" y="360" text-anchor="middle">in training data</text>
<text class="s" x="0" y="0" text-anchor="middle" transform="translate(30 200) rotate(-90)">further from the answer</text>
<path class="line" d="M30 290 L30 350" marker-end="url(#drift-head)"/>
</svg>
