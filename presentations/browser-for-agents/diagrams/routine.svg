<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="routine-title routine-desc">
<title id="routine-title">From browsing to a routine</title>
<desc id="routine-desc">A goal in plain words is browsed once, with a model choosing among the offers. Its choices become a script with the forms pinned, and every later run needs no model and stops if a form changes.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="routine-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="box" x="40" y="60" width="190" height="100" rx="10"/>
<text class="h" x="135" y="95" text-anchor="middle">A goal</text>
<text class="s" x="135" y="115" text-anchor="middle">plain words,</text>
<text class="s" x="135" y="135" text-anchor="middle">written once</text>
<path class="line" d="M232 110 L268 110" marker-end="url(#routine-head)"/>
<rect class="box" x="270" y="60" width="190" height="100" rx="10"/>
<text class="h" x="365" y="95" text-anchor="middle">A first run</text>
<text class="s" x="365" y="115" text-anchor="middle">a model chooses</text>
<text class="s" x="365" y="135" text-anchor="middle">among offers</text>
<path class="line" d="M462 110 L498 110" marker-end="url(#routine-head)"/>
<rect class="box" x="500" y="60" width="190" height="100" rx="10"/>
<text class="h" x="595" y="95" text-anchor="middle">A script</text>
<text class="s" x="595" y="115" text-anchor="middle">its choices, with</text>
<text class="s" x="595" y="135" text-anchor="middle">the forms pinned</text>
<path class="line" d="M692 110 L728 110" marker-end="url(#routine-head)"/>
<rect class="hl" x="730" y="60" width="190" height="100" rx="10"/>
<text class="h" x="825" y="95" text-anchor="middle">Every later run</text>
<text class="s" x="825" y="115" text-anchor="middle">no model; stops if</text>
<text class="s" x="825" y="135" text-anchor="middle">a form changes</text>
<path class="accline" d="M820 60 C820 20 900 20 900 58" marker-end="url(#routine-head)"/>
<path class="line" d="M40 186 L40 196 L460 196 L460 186"/>
<text class="t" x="250" y="222" text-anchor="middle">browsing</text>
<path class="accline" d="M500 186 L500 196 L920 196 L920 186"/>
<text class="t" x="710" y="222" text-anchor="middle">a routine</text>
<text class="s" x="480" y="262" text-anchor="middle">Like a recorded macro, except every step is held to the controls it was offered.</text>
</svg>
