<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="fanout-title fanout-desc">
<title id="fanout-title">One browser for every site, one agent per API</title>
<desc id="fanout-desc">On the left a single browser reaches a shop, a bank, a newspaper and a billion more sites, because it knows only HTML. On the right each agent is wired to one API: a GitHub agent to GitHub, a Stripe agent to Stripe.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="fanout-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<text class="h" x="240" y="28" text-anchor="middle">The Web: one client, any site</text>
<text class="h" x="720" y="28" text-anchor="middle">APIs: one client per API</text>
<rect class="hl" x="40" y="180" width="170" height="64" rx="10"/>
<text class="h" x="125" y="207" text-anchor="middle">Browser</text>
<text class="s" x="125" y="227" text-anchor="middle">knows HTML</text>
<rect class="box" x="290" y="56" width="160" height="44" rx="10"/>
<text class="h" x="370" y="83" text-anchor="middle">a shop</text>
<path class="line" d="M210 212 L288 78" marker-end="url(#fanout-head)"/>
<rect class="box" x="290" y="120" width="160" height="44" rx="10"/>
<text class="h" x="370" y="147" text-anchor="middle">a bank</text>
<path class="line" d="M210 212 L288 142" marker-end="url(#fanout-head)"/>
<rect class="box" x="290" y="184" width="160" height="44" rx="10"/>
<text class="h" x="370" y="211" text-anchor="middle">a newspaper</text>
<path class="line" d="M210 212 L288 206" marker-end="url(#fanout-head)"/>
<rect class="box" x="290" y="248" width="160" height="44" rx="10"/>
<text class="h" x="370" y="275" text-anchor="middle">a council's forms</text>
<path class="line" d="M210 212 L288 270" marker-end="url(#fanout-head)"/>
<rect class="ghost" x="290" y="312" width="160" height="44" rx="10"/>
<text class="h" x="370" y="339" text-anchor="middle">a billion more</text>
<path class="line" d="M210 212 L288 334" marker-end="url(#fanout-head)"/>
<path class="dash" d="M480 50 L480 380"/>
<rect class="box" x="510" y="72" width="170" height="48" rx="10"/>
<text class="h" x="595" y="101" text-anchor="middle">GitHub agent</text>
<rect class="box" x="770" y="72" width="160" height="48" rx="10"/>
<text class="h" x="850" y="101" text-anchor="middle">GitHub API</text>
<path class="line" d="M680 96 L768 96" marker-end="url(#fanout-head)"/>
<rect class="box" x="510" y="144" width="170" height="48" rx="10"/>
<text class="h" x="595" y="173" text-anchor="middle">Stripe agent</text>
<rect class="box" x="770" y="144" width="160" height="48" rx="10"/>
<text class="h" x="850" y="173" text-anchor="middle">Stripe API</text>
<path class="line" d="M680 168 L768 168" marker-end="url(#fanout-head)"/>
<rect class="box" x="510" y="216" width="170" height="48" rx="10"/>
<text class="h" x="595" y="245" text-anchor="middle">Jira agent</text>
<rect class="box" x="770" y="216" width="160" height="48" rx="10"/>
<text class="h" x="850" y="245" text-anchor="middle">Jira API</text>
<path class="line" d="M680 240 L768 240" marker-end="url(#fanout-head)"/>
<rect class="box" x="510" y="288" width="170" height="48" rx="10"/>
<text class="h" x="595" y="317" text-anchor="middle">your billing agent</text>
<rect class="box" x="770" y="288" width="160" height="48" rx="10"/>
<text class="h" x="850" y="317" text-anchor="middle">your billing API</text>
<path class="line" d="M680 312 L768 312" marker-end="url(#fanout-head)"/>
<text class="s" x="240" y="404" text-anchor="middle">coupled to a media type</text>
<text class="s" x="720" y="404" text-anchor="middle">coupled to each API, by hand</text>
</svg>
