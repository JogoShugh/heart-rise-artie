<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="carriers-title carriers-desc">
<title id="carriers-title">Who carries which R</title>
<desc id="carriers-desc">The server carries right behavior, refusal, recency and resilience; the script carries repeatability, reliability, reproducibility, recoverability, restraint, respect and rate; people carry readability, reviewability, responsibility and revocability. The model carries reasoning, and only where judgment is needed.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="carriers-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="box" x="20" y="30" width="215" height="70" rx="10"/>
<text class="h" x="127" y="60" text-anchor="middle">The server</text>
<text class="s" x="127" y="80" text-anchor="middle">controls in the answer</text>
<rect class="box" x="35" y="120" width="185" height="40" rx="10"/>
<text class="t" x="127" y="146" text-anchor="middle">Right behavior</text>
<rect class="box" x="35" y="172" width="185" height="40" rx="10"/>
<text class="t" x="127" y="198" text-anchor="middle">Refusal</text>
<rect class="box" x="35" y="224" width="185" height="40" rx="10"/>
<text class="t" x="127" y="250" text-anchor="middle">Recency</text>
<rect class="box" x="35" y="276" width="185" height="40" rx="10"/>
<text class="t" x="127" y="302" text-anchor="middle">Resilience</text>
<rect class="box" x="255" y="30" width="215" height="70" rx="10"/>
<text class="h" x="362" y="60" text-anchor="middle">The script</text>
<text class="s" x="362" y="80" text-anchor="middle">kept decisions</text>
<rect class="box" x="270" y="120" width="185" height="40" rx="10"/>
<text class="t" x="362" y="146" text-anchor="middle">Repeatability</text>
<rect class="box" x="270" y="172" width="185" height="40" rx="10"/>
<text class="t" x="362" y="198" text-anchor="middle">Reliability</text>
<rect class="box" x="270" y="224" width="185" height="40" rx="10"/>
<text class="t" x="362" y="250" text-anchor="middle">Reproducibility</text>
<rect class="box" x="270" y="276" width="185" height="40" rx="10"/>
<text class="t" x="362" y="302" text-anchor="middle">Recoverability</text>
<rect class="box" x="270" y="328" width="185" height="40" rx="10"/>
<text class="t" x="362" y="354" text-anchor="middle">Restraint</text>
<rect class="box" x="270" y="380" width="185" height="40" rx="10"/>
<text class="t" x="362" y="406" text-anchor="middle">Respect</text>
<rect class="box" x="270" y="432" width="185" height="40" rx="10"/>
<text class="t" x="362" y="458" text-anchor="middle">Rate</text>
<rect class="box" x="490" y="30" width="215" height="70" rx="10"/>
<text class="h" x="597" y="60" text-anchor="middle">The people</text>
<text class="s" x="597" y="80" text-anchor="middle">goal and review</text>
<rect class="box" x="505" y="120" width="185" height="40" rx="10"/>
<text class="t" x="597" y="146" text-anchor="middle">Readability</text>
<rect class="box" x="505" y="172" width="185" height="40" rx="10"/>
<text class="t" x="597" y="198" text-anchor="middle">Reviewability</text>
<rect class="box" x="505" y="224" width="185" height="40" rx="10"/>
<text class="t" x="597" y="250" text-anchor="middle">Responsibility</text>
<rect class="box" x="505" y="276" width="185" height="40" rx="10"/>
<text class="t" x="597" y="302" text-anchor="middle">Revocability</text>
<rect class="hl" x="725" y="30" width="215" height="70" rx="10"/>
<text class="h" x="832" y="60" text-anchor="middle">The model</text>
<text class="s" x="832" y="80" text-anchor="middle">where judgment lives</text>
<rect class="hl" x="740" y="120" width="185" height="40" rx="10"/>
<text class="t" x="832" y="146" text-anchor="middle">Reasoning</text>
<text class="s" x="480" y="505" text-anchor="middle">Reasoning is one R of many, and the only one that costs a model call</text>
</svg>
