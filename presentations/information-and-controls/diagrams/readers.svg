<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="readers-title readers-desc">
<title id="readers-title">One answer, three readers</title>
<desc id="readers-desc">The same HEART answer is rendered as buttons for a person, offered as choices to an AI agent, and acted on by a script's kept line. The server's rules hold for all three.</desc>
<style>.box{fill:var(--d-panel,#FFFFFF);stroke:var(--d-line,#C9C2B4);stroke-width:1.5}
.hl{fill:var(--d-accent-soft,#F6E3C2);stroke:var(--d-accent,#B86E12);stroke-width:2}
.ghost{fill:none;stroke:var(--d-line,#C9C2B4);stroke-width:1.5;stroke-dasharray:6 5}
.t{font:500 16px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.h{font:600 18px var(--d-font,system-ui,sans-serif);fill:var(--d-ink,#1A1F27)}
.s{font:400 14px var(--d-font,system-ui,sans-serif);fill:var(--d-muted,#5A6370)}
.m{font:400 13px var(--d-mono,ui-monospace,monospace);fill:var(--d-ink,#1A1F27);white-space:pre}
.a{fill:var(--d-accent,#B86E12)}
.line{stroke:var(--d-muted,#5A6370);stroke-width:1.75;fill:none}
.dash{stroke:var(--d-muted,#5A6370);stroke-width:1.5;fill:none;stroke-dasharray:5 5}
.accline{stroke:var(--d-accent,#B86E12);stroke-width:2;fill:none}
.head{fill:var(--d-muted,#5A6370)}</style>
<defs><marker id="readers-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="hl" x="330" y="30" width="300" height="150" rx="10"/>
<text class="h" x="480" y="58" text-anchor="middle">One answer: pull request 825</text>
<text class="m" x="350" y="90">state: open, mergeable</text>
<text class="m" x="350" y="112">_forms: merge, comment, close…</text>
<text class="m" x="350" y="134">_links: comments, commits…</text>
<text class="m" x="350" y="156">_embedded: author, labels</text>
<path class="line" d="M400 180 L160 240" marker-end="url(#readers-head)"/>
<path class="line" d="M480 180 L480 240" marker-end="url(#readers-head)"/>
<path class="line" d="M560 180 L800 240" marker-end="url(#readers-head)"/>
<rect class="box" x="40" y="242" width="240" height="110" rx="10"/>
<text class="h" x="160" y="282" text-anchor="middle">A person</text>
<text class="s" x="160" y="302" text-anchor="middle">sees buttons:</text>
<text class="s" x="160" y="322" text-anchor="middle">[Merge] [Comment] [Close]</text>
<rect class="box" x="360" y="242" width="240" height="110" rx="10"/>
<text class="h" x="480" y="282" text-anchor="middle">An agent</text>
<text class="s" x="480" y="302" text-anchor="middle">chooses among offers:</text>
<text class="s" x="480" y="322" text-anchor="middle">github:merge, squash</text>
<rect class="box" x="680" y="242" width="240" height="110" rx="10"/>
<text class="h" x="800" y="282" text-anchor="middle">A script</text>
<text class="s" x="800" y="302" text-anchor="middle">replays a kept line:</text>
<text class="s" x="800" y="322" text-anchor="middle">act(&quot;github:merge&quot;, …)</text>
<text class="s" x="480" y="395" text-anchor="middle">Same controls, same server rules, three kinds of reader: Fielding's “user (or automaton)”</text>
</svg>
