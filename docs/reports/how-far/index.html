<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How far can one vision go</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="From token maxing to tokenomics, with Fielding's vision taken at its word. A deck served as HEART resources and read by heart-ts.">
<meta name="heart-deck" content="how-far">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,650;1,7..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="json-view.css">
<link rel="stylesheet" href="deck-extra.css">
</head><body>
<header class="bar"><div class="bar-in">
  <button class="pill panel-toggle" id="panel-toggle" type="button" aria-controls="outline" aria-expanded="true" title="Show or hide the outline (O)">☰ Outline</button>
  <div class="brand"><b>How far can one vision go</b><span>Hypertext, inference and hooks</span></div>
  <div class="mode" role="group" aria-label="What the deck is served as">
    <button type="button" data-mode="plain" aria-pressed="false">Plain JSON</button>
    <button type="button" data-mode="heart" aria-pressed="true">HEART</button>
  </div>
  <button class="pill" id="refs-all" type="button" title="Every pill, any time (K)">Pills</button>
  <button class="pill" id="notes-toggle" type="button" aria-pressed="false" title="Speaker notes (N)">Notes</button>
  <button class="pill" id="present" type="button" title="Present: the slide fills the screen (P, Esc to leave)">⛶ Present</button>
  <button class="pill" id="theme" type="button">◐ Dark</button>
</div></header>

<div class="deck">
  <nav class="outline" id="outline" aria-label="Outline">
    <p class="label">Outline</p>
    <ol id="outline-list"></ol>
    <p class="how">← and → move. O hides this outline, P presents, N shows the notes. Pills and code chips open on a click.</p>
  </nav>
  <main class="stage">
    <p class="mode-note" id="mode-note"></p>
    <div class="frame" id="frame"><article class="slide" id="slide" aria-live="polite"><p class="note">Reading the deck…</p></article></div>
    <aside class="say" id="say" hidden></aside>
    <nav class="foot" aria-label="Back and on">
      <span class="off" data-rel="prev"><small>Back</small><b>—</b></span>
      <span class="where" id="where"></span>
      <span class="off" data-rel="next"><small>Next</small><b>—</b></span>
    </nav>
    <div class="source" id="source"></div>
  </main>
</div>
<dialog class="overlay" id="overlay" aria-labelledby="overlay-title">
  <form method="dialog" class="overlay-close"><button class="pill" value="close" aria-label="Close">✕</button></form>
  <div id="overlay-body"></div>
</dialog>
<noscript><p>This deck is read by a HEART client in the page. Without JavaScript, read it as <a href="deck/contents.html">plain pages</a>.</p></noscript>

<script src="heart-ts.js"></script>
<script src="json-view.js"></script>
<script src="theme-switch.js"></script>
<script src="deck.js"></script>
</body></html>
