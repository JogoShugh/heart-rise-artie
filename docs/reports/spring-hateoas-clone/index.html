<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Spring HATEOAS, Cloned</title>
<meta name="description" content="Proof that the employees simulator, answering as stock Spring HATEOAS, is a clone of Spring HATEOAS's own affordances example run untouched: side by side, and by ARTIE on each.">
<style>
  :root {
    --bg: #f6f5f1; --fg: #1d211f; --soft: #5b625e; --line: #dcdcd4; --tab: #ffffff; --accent: #2f6b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151816; --fg: #e4e8e5; --soft: #9aa39e; --line: #2f3632; --tab: #1d2220; --accent: #7cc4a0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151816; --fg: #e4e8e5; --soft: #9aa39e; --line: #2f3632; --tab: #1d2220; --accent: #7cc4a0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding-block: 1.25rem .5rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { margin: 0 0 .35rem; font-size: 1.6rem; text-wrap: balance; }
  p { margin: 0; color: var(--soft); max-width: 75ch; }
  [role="tablist"] { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; }
  [role="tab"] { font: inherit; padding: .45rem .9rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--tab); color: var(--fg); cursor: pointer; }
  [role="tab"][aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  iframe { display: block; width: 100%; height: calc(100vh - 10rem); min-height: 32rem; border: 0;
    border-top: 1px solid var(--line); background: var(--bg); }
</style>
</head>
<body>
<header>
  <h1>Stock Spring HATEOAS, Cloned</h1>
  <p>The employees simulator, answering as stock Spring HATEOAS, against Spring HATEOAS's own affordances example
    (commit c100c56, Spring Boot 2.3.4, Spring HATEOAS 1.1.2), run untouched: every exchange the same, byte for byte,
    and ARTIE's script done the same way on each.</p>
  <div role="tablist" aria-label="Part">
    <button role="tab" id="tab-proof" aria-controls="panel-proof" aria-selected="true">The proof</button>
    <button role="tab" id="tab-side" aria-controls="panel-side" aria-selected="false">Side by side</button>
    <button role="tab" id="tab-real" aria-controls="panel-real" aria-selected="false">ARTIE on Spring's example</button>
    <button role="tab" id="tab-clone" aria-controls="panel-clone" aria-selected="false">ARTIE on the clone</button>
    <button role="tab" id="tab-explorer" aria-controls="panel-explorer" aria-selected="false">HAL Explorer on both</button>
  </div>
</header>
<iframe id="panel-proof" role="tabpanel" aria-labelledby="tab-proof" src="proof.html" title="The proof"></iframe>
<iframe id="panel-side" role="tabpanel" aria-labelledby="tab-side" src="side.html" title="Side by side" hidden></iframe>
<iframe id="panel-real" role="tabpanel" aria-labelledby="tab-real" src="artie-real.html" title="ARTIE on Spring's example" hidden></iframe>
<iframe id="panel-clone" role="tabpanel" aria-labelledby="tab-clone" src="artie-clone.html" title="ARTIE on the clone" hidden></iframe>
<iframe id="panel-explorer" role="tabpanel" aria-labelledby="tab-explorer" src="hal-explorer.html" title="HAL Explorer on both" hidden></iframe>
<script>
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const show = (name) => tabs.forEach((tab) => {
    const on = tab.id === `tab-${name}`;
    tab.setAttribute("aria-selected", String(on));
    document.getElementById(tab.getAttribute("aria-controls")).hidden = !on;
  });
  tabs.forEach((tab) => tab.addEventListener("click", () => show(tab.id.slice(4))));
  const wanted = location.hash.slice(1);
  if (tabs.some((tab) => tab.id === `tab-${wanted}`)) show(wanted);
</script>
</body>
</html>
