          deployed:
            question: Which deployment of the library?
          book:
            default: The Hobbit
          author:
            default: J. R. R. Tolkien
          renewable:
            default: Matilda
          problem:
            default: missing-pages
          comment:
            default: Pages 12 to 14.
        
        steps:
          - scenario: S1
            steps:
              - act: library:search-loans
                fields:
                  name: ${book}
                inferred: search the loans for "${book}"
                from-intent: Search the loans for "${book}", and open ${book}
                then:
                  - follow: item
                    title: ${book}
                    intent: Search the loans for "${book}", and open ${book}
                    then: []
          - scenario: S2
            steps:
              - act: library:search-loans
                fields:
                  name: ${book}
                inferred: search the loans for "${book}"
                from-intent: Search the loans for "${book}", and open ${book}
                then:
                  - follow: item
                    title: ${book}
                    intent: Search the loans for "${book}", and open ${book}
                    then:
                      - check:
                          - field: author
                            is: ${author}
          - scenario: S3
            steps:
              - act: library:search-loans
                fields:
                  name: ${renewable}
                inferred: search the loans for "${renewable}"
                from-intent: Search the loans for "${renewable}", and open ${renewable}
                then:
                  - follow: item
                    title: ${renewable}
                    intent: Search the loans for "${renewable}", and open ${renewable}
                    then:
                      - keep-as: before
                      - act: library:renew
                        intent: Renew it
                        then: []
                      - check:
                          - field: due
                            is-not: ${before.due}
          - scenario: S4
            steps:
              - act: library:search-loans
                fields:
                  name: ${renewable}
                inferred: search the loans for "${renewable}"
                from-intent: Search the loans for "${renewable}", and open ${renewable}
                then:
                  - follow: item
                    title: ${renewable}
                    intent: Search the loans for "${renewable}", and open ${renewable}
                    then:
                      - keep-as: read
                      - act: library:renew
                        intent: Renew it
                        then: []
                      - act: library:renew
                        inferred: renew the loan
                        as-of: read
                        refused-as: stale
          - scenario: S5
            steps:
              - act: library:search-loans
                fields:
                  name: ${book}
                inferred: search the loans for "${book}"
                from-intent: Search the loans for "${book}", and open ${book}
                then:
                  - follow: item
