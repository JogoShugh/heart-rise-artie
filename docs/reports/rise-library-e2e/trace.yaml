steps:
- at: "2026-11-09T07:01:03.079343Z"
  mode: "script"
  say: "Ana reads the library's entry, as HAL Schema Forms"
  params: {}
  request:
    method: "GET"
    url: "/"
    headers:
      Authorization: "Basic <token>"
      Accept: "application/hal+json"
      Accept-Profile: "<https://w3id.org/heart-rise/hal-schema-forms>"
    body: null
  response:
    status: 200
    headers:
      ETag: "\"index-hsf-d1c387d90315e842\""
      Content-Type: "application/hal+json"
    body:
      title: "Riverside Public Library"
      _links:
        self:
          href: "/"
        service-desc:
          href: "/openapi.json"
          type: "application/vnd.oai.openapi+json;version=3.1"
        curies:
        - name: "library"
          href: "/profiles/library#{rel}"
          templated: true
      _forms:
        library:search-accounts:
          _links:
            target:
              href: "/accounts{?name}"
              templated: true
          method: "GET"
          title: "Find accounts by name"
          description: "Lists the accounts whose member's name has the text."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              name:
                type: "string"
                minLength: 1
                title: "Name"
                description: "Part of the member's name; case is ignored"
            required:
            - "name"
          hr:integrity: "sha256-kSp5SsnhzuCw2LoCFdlce0MTRVQocmu39jIcWgpeVnM="
        library:get-account:
          _links:
            target:
              href: "/accounts/{id}"
              templated: true
          method: "GET"
          title: "Get an account by library card number"
          description: "Goes to one member's account, given the number on their library\
            \ card."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              id:
                type: "integer"
                minimum: 1
                title: "Library card number"
                description: "The number on the back of the library card"
            required:
            - "id"
          hr:integrity: "sha256-u6y726V+Ubm3wk3zbScGAP1RnefFhIaN3rrPDEdXzr0="
        library:search-members:
          _links:
            target:
              href: "/members{?company}"
              templated: true
          method: "GET"
          title: "Find members by company"
          description: "Lists the members in the company group whose name has the\
            \ text, five to a page."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              company:
                type: "string"
                minLength: 1
                title: "Company"
                description: "Part of the company's name; case is ignored"
            required: []
          hr:integrity: "sha256-zAnGZyo71Wodcly72LoiEDYPbeYgtOuuzFtO95C+buc="
        library:get-member:
          _links:
            target:
              href: "/members/{id}"
              templated: true
          method: "GET"
          title: "Get a member of a company group by library card number"
          description: "Goes to one member of a company group, given the number on\
            \ their library card."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              id:
                type: "integer"
                minimum: 1
                title: "Library card number"
                description: "The number on the back of the library card"
            required:
            - "id"
          hr:integrity: "sha256-cqABq+QGaiZyCGr0tTpEX7NCjNUpJFatpaafhSAc4fc="
        library:search-loans:
          _links:
            target:
              href: "/loans{?name}"
              templated: true
          method: "GET"
          title: "Find loans by title"
          description: "Lists the loans whose book's title has the text."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              name:
                type: "string"
                minLength: 1
                title: "Name"
                description: "Part of the book's title; case is ignored"
            required:
            - "name"
          hr:integrity: "sha256-TqsWR9ZxJUZSMuRjb+XvIiUDWC1qFhwOLUumxDl0PrU="
        library:get-loan:
          _links:
            target:
              href: "/loans/{id}"
              templated: true
          method: "GET"
          title: "Get a loan by number"
          description: "Goes to one loan, given its number."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              id:
                type: "integer"
                minimum: 1
                title: "Loan number"
                description: "The loan's number, on the receipt"
            required:
            - "id"
          hr:integrity: "sha256-Bz1M3dK896FRfWic5LpAPr7FJ+Ek3BQ6kKs+m8cVfD8="
        library:search-watches:
          _links:
            target:
              href: "/watches{?name}"
              templated: true
          method: "GET"
          title: "Find watches"
          description: "Lists the watches the library holds."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              name:
                type: "string"
                minLength: 1
                title: "Name"
                description: ""
            required:
            - "name"
          hr:integrity: "sha256-2yobtIXyUq2XWIROrft3DpPzBOtSD/yJSvNcYEcSE5g="
        library:get-watch:
          _links:
            target:
              href: "/watches/{id}"
              templated: true
          method: "GET"
          title: "Get a watch by number"
          description: "Goes to one watch, given its number."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              id:
                type: "integer"
                minimum: 1
                title: "Watch number"
                description: "The watch's number, in its Location"
            required:
            - "id"
          hr:integrity: "sha256-HehVbRBB2+7tl0d6s3KNl5J4e1VLDO21aUP8s2rAel4="
        library:tell-me-when-renewable:
          _links:
            target:
              href: "/actions/tell-me-when-renewable"
          method: "POST"
          contentType: "application/json"
          title: "Tell me when renewable"
          description: "Brings a watch into being: the library tells the caller when\
            \ the loan can be renewed."
          schema:
            properties:
              _links:
                properties:
                  hr:keys:
                    properties:
                      href:
                        format: "uri"
                        type: "string"
                      type:
                        const: "application/jwk-set+json"
                    required:
                    - "href"
                    - "type"
                    type: "object"
                  hr:reply-to:
                    properties:
                      href:
                        format: "uri"
                        type: "string"
                      profile:
                        enum:
                        - "https://w3id.org/heart-rise/hal-schema-forms"
                        - "https://w3id.org/heart-rise/hal-forms"
                      type:
                        const: "application/hal+json"
                    required:
                    - "href"
                    - "type"
                    - "profile"
                    type: "object"
                required:
                - "hr:reply-to"
                - "hr:keys"
                type: "object"
              loan:
                title: "Loan number"
                type: "integer"
            required:
            - "loan"
            - "_links"
            type: "object"
            $id: "/schemas/2af51786a9d2f804"
          hr:integrity: "sha256-Lb8dpVzNF2dsOgs4MYRKU+HlM2v1i7u0e32P6Uf0TDU="
      hr:manifest:
        forms:
          library:get-account:
          - "sha256-u6y726V+Ubm3wk3zbScGAP1RnefFhIaN3rrPDEdXzr0="
          library:get-loan:
          - "sha256-Bz1M3dK896FRfWic5LpAPr7FJ+Ek3BQ6kKs+m8cVfD8="
          library:get-member:
          - "sha256-cqABq+QGaiZyCGr0tTpEX7NCjNUpJFatpaafhSAc4fc="
          library:get-watch:
          - "sha256-HehVbRBB2+7tl0d6s3KNl5J4e1VLDO21aUP8s2rAel4="
          library:renew:
          - "sha256-YdL5t/euNBufsWOj4hp2WoKWjWPQlQGvS4SAc3aQi/0="
          library:report-problem:
          - "sha256-NNKBxM1YmGEZODMn13mMYCF4VrWsV5PcSbJhaptai/k="
          library:return:
          - "sha256-cQ6M9yPIzjqDMonAZZR1yJmmnp4s6klYxdVoJe56tLo="
          library:search-accounts:
          - "sha256-kSp5SsnhzuCw2LoCFdlce0MTRVQocmu39jIcWgpeVnM="
          library:search-loans:
          - "sha256-TqsWR9ZxJUZSMuRjb+XvIiUDWC1qFhwOLUumxDl0PrU="
          library:search-members:
          - "sha256-zAnGZyo71Wodcly72LoiEDYPbeYgtOuuzFtO95C+buc="
          library:search-watches:
