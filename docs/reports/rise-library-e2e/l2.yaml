- at: "2026-11-11T11:49:20.488574Z"
  mode: "script"
  say: "{party} follows {relation} to the shared affordance set it names"
  params:
    party: "Ana"
    relation: "hr:forms"
  request:
    method: "GET"
    url: "http://localhost:8140/affordance-sets/38ed4c96a89f0680"
    headers:
      Authorization: "Basic <token>"
      Accept: "application/hal+json"
      Accept-Profile: "<https://w3id.org/heart-rise/hal-schema-forms>"
      Prefer: "forms=link, schema=link"
    body: null
  response:
    status: 200
    headers:
      Content-Type: "application/hal+json"
    body:
      _forms:
        library:get-account:
          _links:
            target:
              href: "/accounts/{id}"
              templated: true
          description: "Goes to one member's account, given the number on their library\
            \ card."
          hr:integrity: "sha256-3rDl1dEtkP3/y4xg7E87BTsXN0/63JxVXpWpHwI9mh4="
          method: "GET"
          schema:
            $ref: "/schemas/40b74bc3707cee77"
            hr:integrity: "sha256-QLdLw3B87nfnH3pxwfUD0rI/8PggZ1t6q0NqsPa4ldc="
          title: "Get an account by library card number"
        library:get-loan:
          _links:
            target:
              href: "/loans/{id}"
              templated: true
          description: "Goes to one loan, given its number."
          hr:integrity: "sha256-Xu++bzJ9BJlFHIMOTIolQe85+DdjumgwJhQbhdBE19Y="
          method: "GET"
          schema:
            $ref: "/schemas/761d57bbd45669f6"
            hr:integrity: "sha256-dh1Xu9RWafbO2LOOjzmVZGzesrFvOWJJssh1OPekBsE="
          title: "Get a loan by number"
        library:get-member:
          _links:
            target:
              href: "/members/{id}"
              templated: true
          description: "Goes to one member of a company group, given the number on\
            \ their library card."
          hr:integrity: "sha256-IYUM1lsAf4psynXU9CMkoIEOa9OanccaXmU48TmXr+Y="
          method: "GET"
          schema:
            $ref: "/schemas/40b74bc3707cee77"
            hr:integrity: "sha256-QLdLw3B87nfnH3pxwfUD0rI/8PggZ1t6q0NqsPa4ldc="
          title: "Get a member of a company group by library card number"
        library:get-watch:
          _links:
            target:
              href: "/watches/{id}"
              templated: true
          description: "Goes to one watch, given its number."
          hr:integrity: "sha256-EcwWz1Hj09ot6o7zALOE0MUCzYcRQe848Bte7yur8zs="
          method: "GET"
          schema:
            $ref: "/schemas/57dc13e999ed7322"
            hr:integrity: "sha256-V9wT6ZntcyII0cy71O+gavzT30Q3EKyTEyXYmYMEhXY="
          title: "Get a watch by number"
        library:search-accounts:
          _links:
            target:
              href: "/accounts{?name}"
              templated: true
          description: "Lists the accounts whose member's name has the text."
          hr:integrity: "sha256-7IvOf7kcUQbF4TmRBuMV65mAms7ZoT0vOx7YIvPAnzI="
          method: "GET"
          schema:
            $ref: "/schemas/7422cba42ff7be42"
            hr:integrity: "sha256-dCLLpC/3vkLzxEyiEVgleppdfhpCjrJHdyYRxXMSlPs="
          title: "Find accounts by name"
        library:search-loans:
          _links:
            target:
              href: "/loans{?name}"
              templated: true
          description: "Lists the loans whose book's title has the text."
          hr:integrity: "sha256-7YgmepeFBW45pPEa/bp8R3kPDMRwAFR0FIJN/kpf9q4="
          method: "GET"
          schema:
            $ref: "/schemas/98632b086d33c1e3"
            hr:integrity: "sha256-mGMrCG0zweM3OiICCgafmzBCLiOYnuDCJ94N1wtBV6Y="
          title: "Find loans by title"
        library:search-members:
          _links:
            target:
              href: "/members{?company}"
              templated: true
          description: "Lists the members in the company group whose name has the\
            \ text, five to a page."
          hr:integrity: "sha256-zNjxzpnMoVKi970TL4RtDZAnDqYWhT1Wy/n7xUF1w18="
          method: "GET"
          schema:
            $ref: "/schemas/a2986fb239a54937"
            hr:integrity: "sha256-ophvsjmlSTdghYiCIpUQY9vdGg8wnmLADP2riKW3cog="
          title: "Find members by company"
        library:search-watches:
          _links:
            target:
              href: "/watches{?name}"
              templated: true
          description: "Lists the watches the library holds."
          hr:integrity: "sha256-d/F6t3iPWqYntsUKtVIicuZxnWS61Rf36xxvX6Xnbno="
          method: "GET"
          schema:
            $ref: "/schemas/5eb1c52f6c703873"
            hr:integrity: "sha256-XrHFL2xwOHNOrf/kepL5UFZTJRaKdoL1nAIbLR/PTkM="
          title: "Find watches"
        library:tell-me-when-renewable:
          _links:
            target:
              href: "/actions/tell-me-when-renewable"
          contentType: "application/json"
          description: "Brings a watch into being: the library tells the caller when\
            \ the loan can be renewed."
          hr:integrity: "sha256-Lb8dpVzNF2dsOgs4MYRKU+HlM2v1i7u0e32P6Uf0TDU="
          method: "POST"
          schema:
            $ref: "/schemas/2af51786a9d2f804"
            hr:integrity: "sha256-KvUXhqnS+ASUQNsuaI7N7gxYSgRcahT6dc51jQxJvcA="
          title: "Tell me when renewable"
      _links:
        curies:
        - href: "/profiles/library#{rel}"
          name: "library"
          templated: true
        - href: "https://w3id.org/heart-rise/rels/{rel}"
          name: "hr"
          templated: true
  expect: 200
  ms: 1
