<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@TITLE@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="@LEDE@">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,650&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("sr-theme") || "light"; } catch (e) { document.documentElement.dataset.theme = "light"; }</script>
<style>
/*@SCRIPT_REPORT_CSS@*/
/*@JSON_VIEW_CSS@*/
</style>
</head>
<body>
<main>
  <header>
    <div><h1>@TITLE@</h1><p class="lede">@LEDE@</p></div>
    <div class="theme" role="group" aria-label="Theme"><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
  </header>
  <div class="facts" id="facts"></div>
  <h2>The script</h2>
  <div class="code" id="code"></div>
  <h2>What each line did</h2>
  <div class="toggles"><span class="muted">Show</span>
    <label><input type="checkbox" data-show="detail"> details</label>
    <label><input type="checkbox" data-show="heart"> HEART exchanges</label>
    <label><input type="checkbox" data-show="upstream"> upstream calls</label>
    <label><input type="checkbox" data-show="model"> model calls</label>
    <label><input type="checkbox" data-show="plumbing"> block ends and re-reads</label>
  </div>
  <div class="steps" id="steps"></div>
  <p class="muted" id="also"></p>
</main>
<pre hidden id="script-text">@SCRIPT@</pre>
<pre hidden id="run-trace">@TRACE@</pre>
<pre hidden id="upstream-record">@UPSTREAM@</pre>
<script>
/*@JS_YAML@*/
</script>
<script>
/*@JSON_VIEW_JS@*/
</script>
<script>
/*@SCRIPT_REPORT_JS@*/
</script>
<script>
/*@KOTLIN_VIEW_JS@*/
</script>
</body>
</html>
