---
run:
  client: heart-cs (C#), HeartCs.Core over HeartCs.Http
  service: the simulated employees service (heart-sims), http://employees.test/
  walks:
    - HAL-FORMS at L0
    - HAL Schema Forms at L2
    - moved, HAL Schema Forms at L2
    - someone else acts first, HAL-FORMS at L0
---
at: '2026-11-23T11:40:26.435Z'
ms: 4
mode: script
say: '{walk}: enter {entry}'
params:
  entry: http://employees.test/
  walk: HAL-FORMS at L0
request:
  method: GET
  url: http://employees.test/
  headers:
    Accept: application/prs.hal-forms+json, application/hal+json;q=0.5
    Accept-Profile: <https://w3id.org/heart-rise/hal-forms>
    Cache-Control: no-cache
    Authorization: Bearer <token>
response:
  status: 200
  headers:
    ETag: '"index-hf-c98d2e44d266d261"'
    Link: >-
      <https://w3id.org/heart-rise/hal-forms>; rel="profile", <https://w3id.org/heart-rise>; rel="profile", </>;
      rel="alternate"; type="application/hal+json"; profile="https://w3id.org/heart-rise/hal-schema-forms", </>;
      rel="alternate"; type="application/prs.hal-forms+json"; profile="https://w3id.org/heart-rise/hal-forms", </>;
      rel="alternate"; type="text/html", </>; rel="alternate"; type="application/json", </openapi.json>;
      rel="service-desc"; type="application/vnd.oai.openapi+json;version=3.1"
    Vary: Accept, Prefer, Accept-Profile
    Content-Type: application/prs.hal-forms+json
  body:
    title: Employees
    _links:
      self:
        href: /
      alternate:
        - href: /
          type: application/hal+json
          profile: https://w3id.org/heart-rise/hal-schema-forms
        - href: /
          type: application/prs.hal-forms+json
          profile: https://w3id.org/heart-rise/hal-forms
        - href: /
          type: text/html
        - href: /
          type: application/json
      service-desc:
        href: /openapi.json
        type: application/vnd.oai.openapi+json;version=3.1
      curies:
        - name: staff
          href: /profiles/staff#{rel}
          templated: true
    _templates:
      staff:search-employees:
        title: Find employees by name
        method: GET
        target: /employees
        properties:
          - name: name
            type: search
            required: true
            minLength: 1
            prompt: Part of the employee's first or last name; case is ignored
      staff:get-employee:
        title: Get an employee by number
        method: GET
        target: /employees
        properties:
          - name: id
            type: number
            required: true
            min: 1
            prompt: Employee number
      staff:hire:
        title: Hire an employee
        method: POST
        contentType: application/json
        target: /actions/hire
        properties:
          - name: firstName
            required: true
            type: text
            minLength: 1
          - name: lastName
            required: true
            type: text
            minLength: 1
          - name: role
            required: true
            type: text
            minLength: 1
entry: true
