          templated: true
        hr:affordances:
          href: "/affordances"
          type: "application/hal+json"
      _forms:
        github:pulls-list:
          _links:
            target:
              href: "/repos/{owner}/{repo}/pulls{?state,sort,direction,labels}"
              templated: true
          method: "GET"
          title: "List pull requests"
          description: "Lists pull requests in a specified repository."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              owner:
                type: "string"
                title: "Owner"
                description: "The account owner of the repository. The name is not\
                  \ case sensitive."
              repo:
                type: "string"
                title: "Repo"
                description: "The name of the repository without the `.git` extension.\
                  \ The name is not case sensitive."
              state:
                type: "string"
                default: "open"
                enum:
                - "open"
                - "closed"
                - "all"
                title: "State"
                description: "Either `open`, `closed`, or `all` to filter by state."
              sort:
                type: "string"
                default: "created"
                enum:
                - "created"
                - "updated"
                - "popularity"
                - "long-running"
                title: "Sort"
                description: "What to sort results by. `popularity` will sort by the\
                  \ number of comments. `long-running` will sort by date created and\
                  \ will limit the results to pull requests that have been open for\
                  \ more than a month and have had activity within the past month."
              direction:
                type: "string"
                enum:
                - "asc"
                - "desc"
                title: "Direction"
                description: "The direction of the sort. Default: `desc` when sort\
                  \ is `created` or sort is not specified, otherwise `asc`."
              labels:
                type: "string"
                title: "Labels"
                description: "A list of comma separated label names. Example: `bug,ui,@high`"
            required:
            - "owner"
            - "repo"
            $id: "/schemas/b9c839ada8894d91"
          hr:integrity: "sha256-R0+KwKcf7q+PO0MiRHDgYYM+mJLWxGfgBVCtusfUE4Y="
        github:pulls-get:
          _links:
            target:
              href: "/repos/{owner}/{repo}/pulls/{pull_number}"
              templated: true
          method: "GET"
          title: "Get a pull request"
          description: "Draft pull requests are available in public repositories with\
            \ GitHub Free and GitHub Free for organizations, GitHub Pro, and legacy\
            \ per-repository billing plans, and in public and private repositories\
            \ with GitHub Team and GitHub Enterprise Cloud. For more information,\
            \ see [GitHub's products](https://docs.github.com/github/getting-started-with-github/githubs-products)\
            \ in the GitHub Help documentation."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              owner:
                type: "string"
                title: "Owner"
                description: "The account owner of the repository. The name is not\
                  \ case sensitive."
              repo:
                type: "string"
                title: "Repo"
                description: "The name of the repository without the `.git` extension.\
                  \ The name is not case sensitive."
              pull_number:
                type: "integer"
                title: "Pull_number"
                description: "The number that identifies the pull request."
            required:
            - "owner"
            - "repo"
            - "pull_number"
            $id: "/schemas/60185a2dc910fe20"
          hr:integrity: "sha256-h02WjR7vd61a3clH1/805IIXM3O8OwspKt3KHwUP7/s="
        github:issues-list-for-repo:
          _links:
            target:
              href: "/repos/{owner}/{repo}/issues{?state,labels,assignee,creator,mentioned,milestone,sort,direction,since}"
              templated: true
          method: "GET"
          title: "List repository issues"
          description: "List issues in a repository. Only open issues will be listed.\
            \ Pull requests are left out: list them with github:pulls-list, which\
            \ filters by labels too."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
