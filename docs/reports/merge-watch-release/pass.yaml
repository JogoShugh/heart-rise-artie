                description: "Indicates the state of the issues to return."
              labels:
                type: "string"
                title: "Labels"
                description: "A list of comma separated label names. Example: `bug,ui,@high`"
              assignee:
                type: "string"
                title: "Assignee"
                description: "Can be the name of a user. Pass in `none` for issues\
                  \ with no assigned user, and `*` for issues assigned to any user."
              creator:
                type: "string"
                title: "Creator"
                description: "The user that created the issue."
              mentioned:
                type: "string"
                title: "Mentioned"
                description: "A user that's mentioned in the issue."
              milestone:
                type: "string"
                title: "Milestone"
                description: "If an `integer` is passed, it should refer to a milestone\
                  \ by its `number` field. If the string `*` is passed, issues with\
                  \ any milestone are accepted. If the string `none` is passed, issues\
                  \ without milestones are returned."
              sort:
                type: "string"
                default: "created"
                enum:
                - "created"
                - "updated"
                - "comments"
                title: "Sort"
                description: "What to sort results by."
              direction:
                type: "string"
                default: "desc"
                enum:
                - "asc"
                - "desc"
                title: "Direction"
                description: "The direction to sort the results by."
              since:
                type: "string"
                format: "date-time"
                title: "Since"
                description: "Only show results that were last updated after the given\
                  \ time. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)\
                  \ format: `YYYY-MM-DDTHH:MM:SSZ`."
            required:
            - "owner"
            - "repo"
            $id: "/schemas/520d270ce928f031"
          hr:integrity: "sha256-c5dLRjGUL0j5Qj1azjC+94My4SkHZm6H7Em0ceLdm4c="
        github:issues-get:
          _links:
            target:
              href: "/repos/{owner}/{repo}/issues/{issue_number}"
              templated: true
          method: "GET"
          title: "Get an issue"
          description: "The API returns a [`301 Moved Permanently` status](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api#follow-redirects)\
            \ if the issue was\n[transferred](https://docs.github.com/articles/transferring-an-issue-to-another-repository/)\
            \ to another repository. If\nthe issue was transferred to or deleted from\
            \ a repository where the authenticated user lacks read access, the API\n\
            returns a `404 Not Found` status. If the issue was deleted from a repository\
            \ where the authenticated user has read\naccess, the API returns a `410\
            \ Gone` status. To receive webhook events for transferred and deleted\
            \ issues, subscribe\nto the [`issues`](https://docs.github.com/webhooks/event-payloads/#issues)\
            \ webhook."
          schema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              owner:
                type: "string"
                title: "Owner"
                description: "The account owner of the repository. The name is not\
