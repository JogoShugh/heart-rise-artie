<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>RISE Core, RESTful</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The look every generated report shares: tokens for light and dark, type, the column, tiles, tags, tables,
   disclosures and the theme switch. A generator inlines this first, then only what its own page adds. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b2330; --muted: #5d6879; --rule: #dde2ea; --track: #eef1f5;
  --accent: #4b4fc4;
  --good: #1f7a3a; --good-bg: #e3f3e7; --safe: #2b5fa8; --safe-bg: #e3ecf8;
  --warn: #8a5a00; --warn-bg: #fbf0d9; --bad: #b3261e; --bad-bg: #fbe4e2; --quiet-bg: #eceff3;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --panel: #1a2029; --ink: #e5e9f0; --muted: #9aa5b6; --rule: #2c3442; --track: #232a35;
  --accent: #8f93f2;
  --good: #6fd08c; --good-bg: #183223; --safe: #8fb6f0; --safe-bg: #1a2a42;
  --warn: #f0c060; --warn-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #42201d; --quiet-bg: #232a35; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a2029; --ink: #e5e9f0; --muted: #9aa5b6; --rule: #2c3442; --track: #232a35;
  --accent: #8f93f2;
  --good: #6fd08c; --good-bg: #183223; --safe: #8fb6f0; --safe-bg: #1a2a42;
  --warn: #f0c060; --warn-bg: #3a2e12; --bad: #ff8a80; --bad-bg: #42201d; --quiet-bg: #232a35; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; } h2 { font-size: 21px; } h3 { font-size: 18px; }
h4 { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
p { margin: 0; max-width: 72ch; }
section { display: grid; gap: 12px; min-width: 0; }
.sub, .none { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; }
.num { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

/* The title row: title and lede on the left, the theme switch on the right. */
.top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.top > div { min-width: 0; }
.lede { color: var(--muted); margin-top: 6px; }
.theme { flex: none; font: 500 13px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 16px; padding: 6px 12px; cursor: pointer; }

/* Tones: a class that sets --c and --cbg, for tiles, tags and borders. */
.good { --c: var(--good); --cbg: var(--good-bg); } .safe { --c: var(--safe); --cbg: var(--safe-bg); }
.warn { --c: var(--warn); --cbg: var(--warn-bg); } .bad { --c: var(--bad); --cbg: var(--bad-bg); }
.quiet { --c: var(--muted); --cbg: var(--quiet-bg); }
.tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 10px; margin: 0 4px 4px 0;
  color: var(--c, var(--muted)); background: var(--cbg, var(--quiet-bg)); white-space: nowrap; text-decoration: none; }

/* Tiles: a number or a word on top, a label, a line under; a button tile filters. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { text-align: left; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-top: 3px solid var(--c, var(--rule)); border-radius: 6px; padding: 12px 16px; display: grid; gap: 2px; }
.tile b { font: 600 24px/1.2 var(--display); color: var(--c, var(--ink)); }
.tile .name { font: 500 13px var(--mono); color: var(--muted); }
button.tile { cursor: pointer; }
button.tile[aria-pressed="true"] { background: var(--cbg, var(--panel)); }
.chipbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.chipbar button { font: 500 12px var(--mono); border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  border-radius: 12px; padding: 2px 10px; cursor: pointer; }

/* Tables, each in its own sideways scroll. */
.scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
thead th { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
tbody tr:last-child > * { border-bottom: 0; }

/* Disclosures, and the source a page shows of itself. */
details.box { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
details.box > summary { cursor: pointer; padding: 10px 14px; font-weight: 500; }
details.box > .scroll { border: 0; border-top: 1px solid var(--rule); border-radius: 0; }
pre.src { margin: 0; padding: 14px 16px; font: 12.5px/1.5 var(--mono); color: var(--ink); white-space: pre; }

.theme:focus-visible, summary:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
/* This page's own. */
/* The JSON viewer (json-view.js): collapsed boxes, line diffs, unchanged runs folded behind buttons. */
/* A column of boxes. */
.stack { display: grid; gap: 0.5rem; min-width: 0; }
details.jv { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 0.45rem 0.75rem; min-width: 0; }
details.jv > summary { cursor: pointer; font-size: 0.9rem; }
details.jv[open] > summary { margin-bottom: 0.5rem; }
.jv-body { display: grid; gap: 0.35rem; min-width: 0; }
.jv-label { margin: 0; font: 500 0.75rem var(--mono); color: var(--muted); white-space: pre; }
.jv-doc { margin: 0; overflow-x: auto; background: var(--code-bg); border-radius: 6px; padding: 0.5rem 0.6rem;
  font: 0.78rem/1.45 var(--mono); }
.jv-doc .ln { display: block; white-space: pre; }
.jv-doc .ln.add { background: color-mix(in srgb, var(--leaf) 16%, transparent); }
.jv-doc .ln.del { background: color-mix(in srgb, var(--gate) 16%, transparent); }
.jv-doc .ln.note { color: var(--muted); }
.jv-gap, .jv-full { font: 500 0.75rem var(--mono); color: var(--muted); background: none; border: 1px dashed var(--rule);
  border-radius: 4px; padding: 0.1rem 0.5rem; margin: 0.15rem 0; cursor: pointer; }
.jv-gap { display: block; }
.jv-gap:hover, .jv-full:hover { color: var(--fg); border-style: solid; }
.jv-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
.jv-full[disabled] { opacity: 0.5; cursor: default; }
.jv-req { margin: 0 0 0.35rem; font-size: 0.82rem; overflow-x: auto; white-space: nowrap; }
.jv-req .who { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.4rem; }
/* Reply envelope, end to end: the standards tags, the template and the steps. */
/* The JSON viewer's tokens, from the shared report palette. */
:root { --surface: var(--panel); --code-bg: var(--track); --leaf: var(--good); --gate: var(--bad); --fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#reply { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; min-width: 0; }
.block { display: grid; gap: 12px; min-width: 0; }
.block > h2 { margin-bottom: 0; }

/* The status tags: codified, proposed, de facto, thesis, ours. */
.tag { display: inline-block; font: 600 10.5px/1.5 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 4px; white-space: normal; vertical-align: 1px; }
.tag-codified { color: var(--good); background: var(--good-bg); }
.tag-proposed { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tag-defacto { color: var(--warn); background: var(--warn-bg); }
.tag-thesis { color: var(--safe); background: color-mix(in srgb, var(--safe) 14%, transparent); }
.tag-ours { color: var(--muted); background: var(--quiet-bg); border: 1px solid var(--rule); }
ul.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.legend li { font-size: 14px; }
ul.points { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 84ch; }
ul.points li { font-size: 15px; }
code { font: 12.5px var(--mono); overflow-wrap: anywhere; }

/* Tables scroll inside themselves on a phone. */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
.tbl-wrap table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl-wrap th, .tbl-wrap td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--rule); min-width: 9ch; }
.tbl-wrap thead th { border-top: 0; font: 500 11.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--track); }
.tbl-wrap td:first-child code { white-space: nowrap; }
/* On a phone each row stacks, one labelled block per cell. */
@media (max-width: 720px) {
  .tbl-wrap { overflow-x: visible; }
  .tbl-wrap table, .tbl-wrap tbody, .tbl-wrap tr, .tbl-wrap td { display: block; width: 100%; }
  .tbl-wrap thead { display: none; }
  .tbl-wrap tr { box-sizing: border-box; padding: 8px 12px; border-top: 1px solid var(--rule); display: grid; gap: 4px; }
  .tbl-wrap tbody tr:first-child { border-top: 0; }
  .tbl-wrap th, .tbl-wrap td { min-width: 0; border-top: 0; padding: 0; overflow-wrap: anywhere; }
  .tbl-wrap td::before { content: attr(data-label); display: block; font: 500 10.5px var(--mono); letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); }
  .tbl-wrap td:first-child code { white-space: normal; }
}

/* The steps. */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .sub { margin-right: 4px; color: var(--muted); font: 500 12px var(--mono); }
.btn { font: 500 12px var(--mono); border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 12px;
  padding: 3px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 14px;
  padding: 2px 10px; text-decoration: none; }
.chip:hover { border-color: var(--accent); }
@media (min-width: 900px) {
  .step { scroll-margin-top: 16px; }
}
.step { display: grid; gap: 10px; min-width: 0; padding: 14px 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.step > h3 { margin: 0; }
.step > .lede { color: var(--ink); font-size: 15px; }
.exchange { display: grid; gap: 6px; min-width: 0; }
pre.line { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  background: var(--track); border-radius: 6px; padding: 8px 10px; }
pre.line.res { background: var(--quiet-bg); border-left: 3px solid var(--accent); }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.here { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0; font-size: 13px; }
.here-label { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chip-std { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; background: var(--track); border-radius: 6px; padding: 2px 6px; }

/* The rule ids: R, A, S, H. */
.rule { font: 600 10.5px/1.5 var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--track); color: var(--ink); white-space: nowrap; }
.rule-R { color: var(--accent); }
.rule-A { color: var(--safe); }
.rule-S { color: var(--warn); }
.rule-H { color: var(--good); }
ul.obs { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; min-width: 0; }
ul.obs li { min-width: 0; overflow-wrap: anywhere; }
ul.legend li { font-size: 14px; }
</style>
<div class="wrap">
  <div class="top"><div>
    <h1>The minimal core, end to end, against Fielding's constraints</h1>
    <p class="lede">A mockup, not built. Ana Torres's assistant asks Riverside Public Library to say when a loan is renewable. Thirteen interactions, each with the rules it exercises. Digests, times and identities are made up.</p>
  </div><button class="theme" id="theme" type="button" aria-label="Switch between light and dark">◐ Dark</button></div>
<div id="core"></div>
</div>
<script>
// The light and dark switch every generated report shares: a button with id "theme" switches the page's
// data-theme; the viewer's system theme holds until they choose, and the choice is kept in this browser where it can.
(function () {
  var root = document.documentElement, button = document.getElementById('theme'), key = 'heart-report-theme';
  if (!button) return;
  function current() {
    return root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function label() { button.textContent = current() === 'dark' ? '◑ Light' : '◐ Dark'; }
  try { var kept = localStorage.getItem(key); if (kept === 'light' || kept === 'dark') root.dataset.theme = kept; } catch (e) {}
  label();
  button.addEventListener('click', function () {
    root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(key, root.dataset.theme); } catch (e) {}
    label();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', label);
})();
// One viewer for every JSON example in the reports. A <details class="jv"> names its documents by the ids of
// <script type="application/json"> blocks: data-a alone shows one document; data-a and data-b show what b
// changes of a, as a line diff with a few lines of context. Nothing renders until the reader opens it; the
// unchanged lines and the whole documents appear only on a click.
(() => {
  const CONTEXT = 3;   // unchanged lines kept around each change
  const PREVIEW = 14;  // lines of a lone document shown before "show all"
  const CHANGE = 24;   // a run of changed lines longer than this shows its first FIRST lines, the rest on a click
  const FIRST = 16;
  const cache = new Map();

  const linesOf = (value) => (typeof value === "string" ? value : JSON.stringify(value, null, 2)).split("\n");
  const doc = (id) => {
    if (!cache.has(id)) cache.set(id, linesOf(JSON.parse(document.getElementById(id).textContent)));
    return cache.get(id);
  };

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // Lines of a and b, each marked " " (both), "-" (a only) or "+" (b only): a longest common subsequence
  // after trimming the common head and tail, which is most of a JSON answer.
  const diff = (a, b) => {
    let head = 0;
    while (head < a.length && head < b.length && a[head] === b[head]) head++;
    let tail = 0;
    while (tail < a.length - head && tail < b.length - head && a[a.length - 1 - tail] === b[b.length - 1 - tail]) tail++;
    const x = a.slice(head, a.length - tail), y = b.slice(head, b.length - tail);
    const n = x.length, m = y.length, w = m + 1;
    const table = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        table[i * w + j] = x[i] === y[j] ? table[(i + 1) * w + j + 1] + 1 : Math.max(table[(i + 1) * w + j], table[i * w + j + 1]);
    const out = a.slice(0, head).map((line) => [" ", line]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { out.push([" ", x[i]]); i++; j++; }
      else if (table[(i + 1) * w + j] >= table[i * w + j + 1]) out.push(["-", x[i++]]);
      else out.push(["+", y[j++]]);
    }
    while (i < n) out.push(["-", x[i++]]);
    while (j < m) out.push(["+", y[j++]]);
    return out.concat(a.slice(a.length - tail).map((line) => [" ", line]));
  };

  const row = ([mark, line]) => el("span", { " ": "ln", "-": "ln del", "+": "ln add" }[mark], `${mark} ${line}`);

  // The diff with each long run of unchanged lines folded into a button that unfolds it.
  const diffView = (a, b) => {
    const lines = diff(a, b), pre = el("pre", "jv-doc");
    if (!lines.some(([mark]) => mark !== " ")) pre.append(el("span", "ln note", "  (no difference)"));
    let k = 0;
    while (k < lines.length) {
      if (lines[k][0] !== " ") {
        let end = k;
        while (end < lines.length && lines[end][0] !== " ") end++;
        const run = lines.slice(k, end);
        if (run.length <= CHANGE) run.forEach((l) => pre.append(row(l)));
        else {
          run.slice(0, FIRST).forEach((l) => pre.append(row(l)));
          const rest = run.slice(FIRST);
          const more = el("button", "jv-gap", `⋯ ${rest.length} more changed lines`);
          more.type = "button";
          more.addEventListener("click", () => more.replaceWith(...rest.map(row)));
          pre.append(more);
        }
        k = end;
        continue;
      }
      let end = k;
      while (end < lines.length && lines[end][0] === " ") end++;
      const first = k === 0, last = end === lines.length;
      const keepHead = first ? 0 : CONTEXT, keepTail = last ? 0 : CONTEXT;
      if (end - k <= keepHead + keepTail + 1) { lines.slice(k, end).forEach((l) => pre.append(row(l))); }
      else {
        lines.slice(k, k + keepHead).forEach((l) => pre.append(row(l)));
        const hidden = lines.slice(k + keepHead, end - keepTail);
        const gap = el("button", "jv-gap", `⋯ ${hidden.length} unchanged lines`);
        gap.type = "button";
        gap.addEventListener("click", () => gap.replaceWith(...hidden.map(row)));
        pre.append(gap);
        lines.slice(end - keepTail, end).forEach((l) => pre.append(row(l)));
      }
      k = end;
    }
    return pre;
  };

  // A lone document: its first lines, the rest on a click.
  const docView = (lines) => {
    const pre = el("pre", "jv-doc");
    lines.slice(0, PREVIEW).forEach((line) => pre.append(el("span", "ln", line)));
    if (lines.length > PREVIEW) {
      const more = el("button", "jv-gap", `⋯ ${lines.length - PREVIEW} more lines`);
      more.type = "button";
      more.addEventListener("click", () => more.replaceWith(...lines.slice(PREVIEW).map((l) => el("span", "ln", l))));
      pre.append(more);
    }
    return pre;
  };

  // "Show all": a whole document, on demand.
  const fullButton = (label, lines, host) => {
    const button = el("button", "jv-full", `${label} in full (${lines.length} lines)`);
    button.type = "button";
    button.addEventListener("click", () => {
      const pre = el("pre", "jv-doc");
      lines.forEach((line) => pre.append(el("span", "ln", line)));
      button.disabled = true;
      host.append(el("p", "jv-label", `${label}, in full`), pre);
    });
    return button;
  };

  const render = (box) => {
    const body = el("div", "jv-body"), tools = el("div", "jv-tools");
    const a = doc(box.dataset.a), labelA = box.dataset.labelA || "document";
    if (box.dataset.b) {
      const b = doc(box.dataset.b), labelB = box.dataset.labelB || "after";
      body.append(el("p", "jv-label", `− ${labelA}   + ${labelB}`), diffView(a, b));
      tools.append(fullButton(labelA, a, body), fullButton(labelB, b, body));
    } else {
      body.append(el("p", "jv-label", labelA), docView(a));
    }
    // Before the box's tail (a nested box, such as why the rest are absent), if it has one.
    const tail = box.querySelector(":scope > .jv-tail");
    box.insertBefore(body, tail);
    if (tools.childElementCount) box.insertBefore(tools, tail);
  };

  // For other scripts (run-report.js): a box for documents already in hand, rendered when opened like any other.
  let made = 0;
  window.JsonView = {
    box({ a, b, labelA, labelB, summary, lead }) {
      const box = el("details", "jv");
      const id = (value) => { const key = `jvm${made++}`; cache.set(key, linesOf(value)); return key; };
      box.dataset.a = id(a);
      if (b !== undefined) box.dataset.b = id(b);
      if (labelA) box.dataset.labelA = labelA;
      if (labelB) box.dataset.labelB = labelB;
      const head = el("summary");
      head.innerHTML = summary;
      box.append(head);
      if (lead) box.append(lead);
      return box;
    },
  };

  // toggle doesn't bubble, but a capturing listener on the document sees every one.
  document.addEventListener("toggle", (event) => {
    const box = event.target;
    if (box.classList && box.classList.contains("jv") && box.open && !box.dataset.rendered) {
      box.dataset.rendered = "1";
      render(box);
    }
  }, true);
})();
// RISE core, the RESTful minimum: the data. Each interaction lists the rules it exercises (see RULES).
// Digests, times and identities are made up; the shapes are the ones the core proposes.
(() => {
  const RULES = [
    ["R1", "Every resource has its own URI. Creation returns 201 with Location."],
    ["R2", "A reply's state is a GET-able representation."],
    ["R3", "GET and HEAD never change state."],
    ["R4", "A state change is a POST to a form target named in the representation. The client builds no URL."],
    ["R5", "Acts go to resource URIs, never to one RPC endpoint."],
    ["R6", "Every message names its media type. Errors are application/problem+json."],
    ["R7", "Responses carry ETag. Writes carry If-Match. A write without it is 428."],
    ["R8", "The client knows only the entry link and relation names."],
    ["R9", "The representation offers only the acts available now."],
    ["R10", "Stateless: each request carries all it needs."],
    ["R11", "A callback stands alone: its own Date and signature window."],
    ["R12", "Reads carry ETag and Cache-Control: no-cache."],
    ["R13", "Acts are not cacheable."],
    ["R14", "Client and server share only links and standard names."],
    ["R15", "Intermediaries are transparent. Nothing needs the path."],
    ["A1", "The caller lists the levels it accepts. The responder reports the levels it applied."],
    ["S1", "Send once: the answer is not stored on the reply. The digest records what was sent."],
    ["S2", "Send once: the representation says hr:delivery once."],
    ["S3", "Send once: the deliver response is not cacheable."],
    ["H1", "Held: the responder keeps the answer as a resource, and the reply links to it."],
  ];

  const STEPS = [
    {
      id: "i1",
      title: "Enter at the library's root",
      exchanges: [{
        line: "GET https://library.example/",
        headers: ["Accept: application/json"],
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"root-1\""],
          body: { _links: { "hr:loans": { href: "https://library.example/loans" } } },

      }],
      obs: [
        { t: "One URL known. Everything else comes from links.", r: ["R8"] },
        { t: "Relation name, not a path.", r: ["R8"] },
        { t: "Safe read.", r: ["R3"] },
        { t: "Entry is a link, not the library's layout.", r: ["R15"] },
      ],
    },
    {
      id: "i2",
      title: "Read the loan; its form says how to act",
      exchanges: [{
        line: "GET https://library.example/loans/L-40219",

          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"loan-7\""],
          body: {
            state: "renewable",
            title: "The Hobbit",
            _links: { self: { href: "https://library.example/loans/L-40219" } },
            _forms: {
              "hr:tell-me-when-renewable": {
                method: "POST",
                target: "https://library.example/loans/L-40219/actions/tell-me-when-renewable",
                schema: { type: "object", properties: { _rise: { type: "object" } } },
              },
            },
          },
        },
      }],
      obs: [
        { t: "Target comes from the form. The client builds no URL.", r: ["R4"] },
        { t: "Form offered now, because the loan is renewable.", r: ["R9"] },
        { t: "ETag names this representation for the later write.", r: ["R7"] },
        { t: "Read changed nothing.", r: ["R3"] },
      ],
    },
    {
      id: "i3",
      title: "Open a reply on the assistant's inbox",
      exchanges: [{
        line: "POST https://assistant.example/replies",
        headers: ["Content-Type: application/json"],
        body: { want: ["status", "link", "inline"], expires: "2026-11-15T09:00:00Z" },
        bodyLabel: "Request body: the levels accepted, and the expiry",
        res: {
          line: "201 Created",
          headers: ["Location: https://assistant.example/replies/7f3a", "Content-Type: application/json", "ETag: \"rep-1\""],
          body: {
            state: "awaiting",
            want: ["status", "link", "inline"],
            _links: { self: { href: "https://assistant.example/replies/7f3a" } },
            _forms: {
              "hr:deliver": {
                method: "POST",
                target: "https://assistant.example/replies/7f3a/actions/deliver",
                schema: { type: "object", properties: { outcome: { enum: ["done", "refused", "failed"] }, result: { type: "object" }, applied: { type: "array" } } },
              },
              "hr:progress": {
                method: "POST",
                target: "https://assistant.example/replies/7f3a/actions/progress",
                schema: { type: "object", properties: { stage: { type: "string" } } },
              },
              "hr:fail": {
                method: "POST",
                target: "https://assistant.example/replies/7f3a/actions/fail",
                schema: { type: "object", properties: { problem: { type: "object" } } },
              },
            },
          },
        },
      }],
      obs: [
        { t: "Created: 201, Location names the new reply.", r: ["R1"] },
        { t: "Caller states the levels it accepts. The responder reports what it applied, later.", r: ["A1"] },
        { t: "No template sent. The schema comes from the representation.", r: ["R4"] },
        { t: "Readable from its first state.", r: ["R2"] },
        { t: "Acts sit on the reply's own URIs, not one endpoint.", r: ["R5"] },
      ],
    },
    {
      id: "i4",
      title: "Act on the loan, with the reply's address",
      exchanges: [{
        line: "POST https://library.example/loans/L-40219/actions/tell-me-when-renewable",
        headers: ["Content-Type: application/json", "If-Match: \"loan-7\""],
        body: { _rise: { _links: { "hr:reply-to": { href: "https://assistant.example/replies/7f3a" } } } },
        res: {
          line: "201 Created",
          headers: ["Location: https://library.example/watches/w-88", "Content-Type: application/json"],
          body: {
            state: "waiting",
            _links: {
              self: { href: "https://library.example/watches/w-88" },
              "hr:loan": { href: "https://library.example/loans/L-40219" },
            },
          },
        },
      }],
      obs: [
        { t: "Act on the form target from I2.", r: ["R4", "R5"] },
        { t: "Act carries the validator from the read.", r: ["R7"] },
        { t: "New watch: 201 with Location.", r: ["R1"] },
        { t: "The library learns one address and nothing of the inbox's layout.", r: ["R14"] },
      ],
    },
    {
      id: "i5",
      title: "The library reads the reply before it sends",
      exchanges: [{
        line: "GET https://assistant.example/replies/7f3a",
        headers: ["Accept: application/json"],
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"rep-1\""],
          body: {
            state: "awaiting",
            want: ["status", "link", "inline"],
            _forms: {
              "hr:deliver": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/deliver" },
              "hr:progress": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/progress" },
              "hr:fail": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/fail" },
            },
          },
        },
      }],
      obs: [
        { t: "Read before send. The validator is taken here.", r: ["R7"] },
        { t: "Library picks from the forms offered now.", r: ["R9"] },
        { t: "Read changed nothing.", r: ["R3"] },
      ],
    },
    {
      id: "i6",
      title: "Progress while waiting",
      exchanges: [{
        line: "POST https://assistant.example/replies/7f3a/actions/progress",
        headers: ["Content-Type: application/json", "If-Match: \"rep-1\""],
        body: { stage: "waiting for the hold to clear" },
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "ETag: \"rep-2\""],
          body: {
            state: "awaiting",
            stage: "waiting for the hold to clear",
            _forms: {
              "hr:deliver": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/deliver" },
              "hr:progress": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/progress" },
              "hr:fail": { method: "POST", target: "https://assistant.example/replies/7f3a/actions/fail" },
            },
          },
        },
      }],
      obs: [
        { t: "Progress is an act: a POST to its form target.", r: ["R4"] },
        { t: "The write changes the validator. The new ETag replaces the old.", r: ["R7"] },
        { t: "Forms still offered while awaiting.", r: ["R9"] },
        { t: "Request carries its own validator and body. Nothing kept per session.", r: ["R10"] },
      ],
    },
    {
      id: "i7",
      title: "Send the answer once",
      exchanges: [{
        line: "POST https://assistant.example/replies/7f3a/actions/deliver",
        headers: [
          "Content-Type: application/json",
          "If-Match: \"rep-2\"",
          "Date: Sun, 08 Nov 2026 15:40:12 GMT",
          "Content-Digest: sha-256=:bW9jay1kaWdlc3Q=:",
        ],
        body: {
          outcome: "done",
          applied: ["status", "inline"],
          result: { loan: "https://library.example/loans/L-40219", standing: "renewable", renewUntil: "2026-12-06" },
        },
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-store", "ETag: \"rep-3\""],
          body: {
            state: "answered",
            "hr:delivery": "once",
            applied: ["status", "inline"],
            digest: "sha-256=:bW9jay1kaWdlc3Q=:",
            time: "2026-11-08T15:40:12Z",
            _links: { self: { href: "https://assistant.example/replies/7f3a" } },
          },
        },
      }],
      obs: [
        { t: "Responder applied inline, not the link: a subset of want.", r: ["A1"] },
        { t: "The answer is not stored on the reply. The digest records what was sent.", r: ["S1"] },
        { t: "Representation says once.", r: ["S2"] },
        { t: "Callback stands alone: its own Date and window.", r: ["R11"] },
        { t: "Deliver response is not cacheable.", r: ["S3", "R13"] },
      ],
    },
    {
      id: "i8",
      title: "Read the reply after the answer",
      exchanges: [{
        line: "GET https://assistant.example/replies/7f3a",
        headers: ["Accept: application/json"],
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"rep-3\""],
          body: {
            state: "answered",
            "hr:delivery": "once",
            applied: ["status", "inline"],
            digest: "sha-256=:bW9jay1kaWdlc3Q=:",
            time: "2026-11-08T15:40:12Z",
            _links: { self: { href: "https://assistant.example/replies/7f3a" } },
          },
        },
      }],
      obs: [
        { t: "Read shows the status, not the answer.", r: ["S2"] },
        { t: "No act offered once answered. No _forms.", r: ["R9"] },
        { t: "The digest lets the caller check its stored copy.", r: ["S1"] },
        { t: "Read carries ETag and no-cache.", r: ["R12"] },
      ],
    },
    {
      id: "i9",
      title: "A repeat after a lost answer, with the old validator",
      exchanges: [{
        line: "POST https://assistant.example/replies/7f3a/actions/deliver",
        headers: [
          "Content-Type: application/json",
          "If-Match: \"rep-2\"",
          "Date: Sun, 08 Nov 2026 15:46:12 GMT",
          "Content-Digest: sha-256=:bW9jay1kaWdlc3Q=:",
        ],
        body: { outcome: "done", applied: ["status", "inline"], result: { standing: "renewable" } },
        res: {
          line: "412 Precondition Failed",
          headers: ["Content-Type: application/problem+json"],
          body: {
            type: "https://w3id.org/heart-rise/problems/validator-stale",
            title: "The reply changed since you read it",
            status: 412,
          },
        },
      }],
      obs: [
        { t: "Refusal is a problem document.", r: ["R6"] },
        { t: "Old validator refused. Nothing applied twice.", r: ["R7"] },
        { t: "Sender reads again, as in I8.", r: ["R10"] },
      ],
    },
    {
      id: "i10",
      title: "A write with no validator",
      exchanges: [{
        line: "POST https://assistant.example/replies/7f3a/actions/deliver",
        headers: ["Content-Type: application/json"],
        body: { outcome: "done" },
        res: {
          line: "428 Precondition Required",
          headers: ["Content-Type: application/problem+json"],
          body: {
            type: "https://w3id.org/heart-rise/problems/validator-required",
            title: "This write needs If-Match",
            status: 428,
          },
        },
      }],
      obs: [
        { t: "Missing If-Match refused before state is checked.", r: ["R7"] },
        { t: "Problem type names the rule.", r: ["R6"] },
      ],
    },
    {
      id: "i11",
      title: "A second reply, with fewer levels",
      exchanges: [{
        line: "POST https://assistant.example/replies",
        headers: ["Content-Type: application/json"],
        body: { want: ["status", "link"], expires: "2026-11-15T09:00:00Z" },
        bodyLabel: "Request body: the levels accepted, and the expiry",
        res: {
          line: "201 Created",
          headers: ["Location: https://assistant.example/replies/7f40", "Content-Type: application/json", "ETag: \"rep-1\""],
          body: {
            state: "awaiting",
            want: ["status", "link"],
            _links: { self: { href: "https://assistant.example/replies/7f40" } },
            _forms: {
              "hr:deliver": {
                method: "POST",
                target: "https://assistant.example/replies/7f40/actions/deliver",
                schema: { type: "object", properties: { outcome: { enum: ["done", "refused", "failed"] }, applied: { type: "array" } } },
              },
            },
          },
        },
      }],
      obs: [
        { t: "Second reply, its own URI.", r: ["R1"] },
        { t: "Caller accepts fewer levels this time.", r: ["A1"] },
      ],
    },
    {
      id: "i12",
      title: "Second answer, held: only a link travels",
      exchanges: [{
        line: "POST https://assistant.example/replies/7f40/actions/deliver",
        headers: ["Content-Type: application/json", "If-Match: \"rep-1\""],
        body: {
          outcome: "done",
          applied: ["status", "link"],
          _links: { "hr:result": { href: "https://library.example/results/r-88" } },
        },
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"rep-2\""],
          body: {
            state: "answered",
            "hr:delivery": "link",
            applied: ["status", "link"],
            _links: {
              self: { href: "https://assistant.example/replies/7f40" },
              "hr:result": { href: "https://library.example/results/r-88" },
            },
          },
        },
      }],
      obs: [
        { t: "Responder holds the answer. The reply links to it.", r: ["H1"] },
        { t: "Only the link travels, not the answer.", r: ["H1"] },
      ],
    },
    {
      id: "i13",
      title: "Fetch the held result",
      exchanges: [{
        line: "GET https://library.example/results/r-88",
        headers: ["Accept: application/json"],
        res: {
          line: "200 OK",
          headers: ["Content-Type: application/json", "Cache-Control: no-cache", "ETag: \"res-1\""],
          body: {
            loan: "https://library.example/loans/L-40219",
            standing: "renewable",
            renewUntil: "2026-12-06",
          },
        },
      }],
      obs: [
        { t: "The held answer is a resource. GET works at any time.", r: ["H1", "R2"] },
        { t: "no-cache: the validator is checked every time.", r: ["R12"] },
        { t: "The read changes nothing on the library.", r: ["R3"] },
      ],
    },
  ];

  const CHECKS = [
    "Entry link only: I1 starts from one URL. Every later URL comes from a link or a form.",
    "No GET changes state: I1, I2, I5, I8, I13.",
    "Every write carries If-Match: I4, I6, I7, I9, I12. Refused without it: I10.",
    "Every refusal is application/problem+json: I9, I10.",
    "Offered forms follow state: I3 offers deliver, progress and fail. I8 offers none.",
    "Send-once keeps the digest and says once: I7, I8.",
    "Held answer is GET-able with no-cache: I13.",
    "No caller internals in any body.",
  ];

  window.CORE = { RULES, STEPS, CHECKS };
})();
// RISE core, the RESTful minimum: the renderer. The data is in core.js.
(() => {
  const C = window.CORE;
  const host = document.getElementById("core");

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  };

  const rule = (id) => el("span", `rule rule-${id[0]}`, id);

  // ---- The rules, by id.
  const rules = () => {
    const sec = el("section", "block");
    sec.append(el("h2", null, "Rules"));
    const ul = el("ul", "legend");
    C.RULES.forEach(([id, text]) => {
      const li = el("li");
      li.append(rule(id), el("span", null, ` ${text}`));
      ul.append(li);
    });
    sec.append(ul);
    return sec;
  };

  // ---- Each interaction: the exchange, the JSON folded, the observations with their rules.
  const steps = () => {
    const sec = el("section", "block");
    sec.append(el("h2", null, "Interactions"));
    const nav = el("nav", "chips");
    nav.setAttribute("aria-label", "Interactions");
    C.STEPS.forEach((s) => {
      const a = el("a", "chip", s.id.toUpperCase());
      a.href = `#${s.id}`;
      nav.append(a);
    });
    const bar = el("div", "bar");
    const open = el("button", "btn", "Open every body");
    const close = el("button", "btn", "Close every body");
    open.type = close.type = "button";
    const setAll = (state) => document.querySelectorAll("details.jv").forEach((d) => { d.open = state; });
    open.addEventListener("click", () => setAll(true));
    close.addEventListener("click", () => setAll(false));
    bar.append(el("span", "sub", "Bodies:"), open, close);
    sec.append(nav, bar);

    C.STEPS.forEach((s) => {
      const block = el("article", "step");
      block.id = s.id;
      block.append(el("h3", null, `${s.id.toUpperCase()}. ${s.title}`));
      s.exchanges.forEach((x) => {
        const ex = el("div", "exchange");
        ex.append(el("pre", "line", [x.line, ...(x.headers || [])].join("\n")));
        if (x.body !== undefined) ex.append(window.JsonView.box({ a: x.body, summary: x.bodyLabel || "Request body" }));
        ex.append(el("pre", "line res", [x.res.line, ...(x.res.headers || [])].join("\n")));
        ex.append(window.JsonView.box({ a: x.res.body, summary: "Response body" }));
        block.append(ex);
      });
      const obs = el("ul", "obs");
      s.obs.forEach((o) => {
        const li = el("li");
        li.append(el("span", null, o.t), " ");
        o.r.forEach((id) => li.append(rule(id), " "));
        obs.append(li);
      });
      block.append(obs);
      sec.append(block);
    });
    return sec;
  };

  // ---- The checks a client suite would run against this flow.
  const checks = () => {
    const sec = el("section", "block");
    sec.append(el("h2", null, "Checks"));
    const ul = el("ul", "points");
    C.CHECKS.forEach((c) => ul.append(el("li", null, c)));
    sec.append(ul);
    return sec;
  };

  host.append(rules(), steps(), checks());
})();
</script>
