name: cast
part: "The release"
title: "The Cast"
kicker: Six systems that know nothing of each other
say: "Six systems, and none of them knows the others. The forge is GitHub or GitLab, behind a small gateway that serves scm: forms. The watcher waits until a pull request offers scm:merge, and then answers. CI is a HEART face on a real Jenkins. Preview is where Jenkins deploys the build. Dev is where a passing commit gets promoted. And the release desk is where a person asks for a release, and where ARTIE runs. Each one speaks HEART. ARTIE crosses between them by following links."
sources:
  - ["Merge Watch release exhibit", "https://github.com/JogoShugh/heart-rise-artie/tree/main/exhibits/merge-watch-release"]
html: |
  <h2>The Cast</h2>
  <div class="cast6">
    <div><b>Forge</b><code>scm:</code><span>GitHub or GitLab, behind a gateway that serves <code>scm:</code> forms</span></div>
    <div><b>Watcher</b><code>watcher:</code><span>Waits until the pull request offers <code>scm:merge</code>, then answers</span></div>
    <div><b>CI</b><code>ci:</code><span>A HEART face on a real Jenkins: builds, deploys, answers when done</span></div>
    <div><b>Preview</b><code>library:</code><span>Where Jenkins deploys the build: the library app</span></div>
    <div><b>Dev</b><code>env:</code><span>Where a commit that passed its smoke test is promoted</span></div>
    <div><b>Release desk</b><code>hr:</code><span>Where a person asks for a release. ARTIE runs here, and the replies live here</span></div>
  </div>
  <p class="lead">Each speaks HEART. ARTIE crosses between them by following links, and waits on two of them with RISE: an ask, and a reply resource the answer comes back to.</p>
  <p class="refs"><deck-ref name="heart"></deck-ref> <deck-ref name="rise"></deck-ref> <deck-ref name="gateway"></deck-ref> <deck-ref name="scm"></deck-ref></p>
