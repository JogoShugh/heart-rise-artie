name: close
part: "Zero-token replay"
tone: dark
title: "Walked Once. Replayed Free."
kicker: What's next
say: "So that's the whole trip: eight lines of plain words, walked once with Claude, kept as a script with its pins, and replayed with no model, on two forges that agree on almost nothing. It works because every answer carries its controls, the way every web page always has. Next time I'll open up the pieces we skipped: how the gateway turns an OpenAPI description into forms, how RISE signs and checks a reply, and what happens when a form really does change and the model comes back to repair the script."
sources:
  - ["artie (repository)", "https://github.com/JogoShugh/heart-rise-artie"]
html: |
  <h1>Walked Once. Replayed Free.</h1>
  <div class="trip">
    <span>Plain words</span><i aria-hidden="true">➜</i><span>Walk once, with Claude</span><i aria-hidden="true">➜</i><span>Kept script + pins</span><i aria-hidden="true">➜</i><span class="free">Replay, 0 tokens, any forge</span>
  </div>
  <p class="lead">It works because every answer carries its controls, the way every web page always has.</p>
  <div class="next">
    <span class="label">Next time</span>
    <ul>
      <li>How the gateway turns an OpenAPI description into forms</li>
      <li>How RISE signs a reply, and how the desk checks it</li>
      <li>When a form really changes: the model comes back, once, to repair</li>
    </ul>
  </div>
