# The OpenAPI twin heart-core writes from the same declaration: every operation, always listed.
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The request could not be read
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: No resource with that id
    NotOffered:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The act is not allowed in the resource's current state
    Stale:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: 'If-Match named a state the resource is no longer in: read it again, and decide again'
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: A Basic or Bearer credential the service admits is needed
    Unprocessable:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      description: The body breaks the act's schema, or a rule of the resource refuses it
  schemas:
    Account:
      properties:
        id:
          minimum: 1
          type: integer
      required:
      - id
      type: object
    Error:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    HistoryEvent:
      properties:
        event:
          type: object
        occurredAt:
          format: date-time
          type: string
        sequenceNo:
          minimum: 1
          type: integer
        type:
          type: string
      required:
      - sequenceNo
      - type
      - occurredAt
      - event
      type: object
    Loan:
      properties:
        id:
          minimum: 1
          type: integer
        standing:
          enum:
          - renewable
          - hold waiting
          - renewed the most allowed
          - returned
          type: string
      required:
      - id
      type: object
    Problem:
      properties:
        detail:
          type: string
        instance:
          type: string
        rel:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          format: uri
          type: string
        violations:
          items:
            properties:
              message:
                type: string
              pointer:
                type: string
            required:
            - pointer
            - message
            type: object
          type: array
      type: object
    Renew:
      properties: {}
      type: object
    Return:
      properties: {}
      type: object
    SearchPage:
      properties:
        count:
          minimum: 0
          type: integer
        items:
          items:
            properties:
              id:
                minimum: 1
                type: integer
              title:
                type: string
            required:
            - id
            - title
            type: object
          type: array
      required:
      - count
      - items
      type: object
  securitySchemes:
    basic:
      scheme: basic
      type: http
    bearer:
      scheme: bearer
      type: http
info:
  description: 'Every operation this service could ever be asked, generated from its HEART declarations. It describes
    the plain JSON rendering (Accept: application/json). Which acts a resource allows depends on its state at the
    time, which this document can only describe in prose.'
  title: Riverside Public Library
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
openapi: 3.1.1
paths:
  /accounts:
    get:
      description: Lists the accounts whose member's name has the text.
      operationId: searchAccounts
      parameters:
      - description: Part of the member's name; case is ignored
        in: query
        name: name
        required: false
        schema:
          minLength: 1
          type: string
      - description: The number on the back of the library card
        in: query
        name: id
        required: false
        schema:
          minimum: 1
          type: integer
      - description: The page of matches, from 1
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          description: The matches, a page at a time
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: Find accounts by name
      tags:
      - accounts
  /accounts/{id}:
    get:
      description: A safe lookup; the account links each book the member has out, titled with the book.
      operationId: getAccount
      parameters:
      - description: The account's id
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: The account
          headers:
            ETag:
              description: 'The state''s validator: send it back as If-None-Match to read again, or as If-Match
                to act'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Get an account by library card number
      tags:
      - accounts
  /loans:
    get:
      description: Lists the loans whose book's title has the text.
      operationId: searchLoans
      parameters:
      - description: Part of the book's title; case is ignored
        in: query
        name: name
        required: false
        schema:
          minLength: 1
          type: string
      - description: The loan's number, on the receipt
        in: query
        name: id
        required: false
        schema:
          minimum: 1
          type: integer
      - description: The page of matches, from 1
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          description: The matches, a page at a time
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: Find loans by title
      tags:
      - loans
  /loans/{id}:
    get:
      description: A safe lookup; the result is the loan, with what may be done now.
      operationId: getLoan
      parameters:
      - description: The loan's id
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
          description: The loan
          headers:
            ETag:
              description: 'The state''s validator: send it back as If-None-Match to read again, or as If-Match
                to act'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Get a loan by number
      tags:
      - loans
  /loans/{id}/actions/renew:
    post:
      description: 'Offered while the book is out, renewed fewer than three times, and no one''s hold is waiting.


        Only allowed when standing is renewable.'
      operationId: renew
      parameters:
      - description: The loan's id
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - description: 'The ETag of the state the act was decided on: if the state moved since, the act is refused'
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Renew'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
          description: The loan after the act
          headers:
            ETag:
              description: 'The state''s validator: send it back as If-None-Match to read again, or as If-Match
                to act'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotOffered'
        '412':
          $ref: '#/components/responses/Stale'
        '422':
          $ref: '#/components/responses/Unprocessable'
      summary: Renew
      tags:
      - loans
  /loans/{id}/actions/return:
    post:
      description: 'Offered while the book is out; nothing is offered after.


        Only allowed when standing is renewable, hold waiting or renewed the most allowed.'
      operationId: return
      parameters:
      - description: The loan's id
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - description: 'The ETag of the state the act was decided on: if the state moved since, the act is refused'
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Return'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
          description: The loan after the act
          headers:
            ETag:
              description: 'The state''s validator: send it back as If-None-Match to read again, or as If-Match
                to act'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotOffered'
        '412':
          $ref: '#/components/responses/Stale'
        '422':
          $ref: '#/components/responses/Unprocessable'
      summary: Return
      tags:
      - loans
security:
- basic: []
- bearer: []
servers:
- url: /
tags:
- description: 'A member''s loans at Riverside Public Library: renewing and returning books.'
  name: accounts
- description: 'A member''s loans at Riverside Public Library: renewing and returning books.'
  name: loans
