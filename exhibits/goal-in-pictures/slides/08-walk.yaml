name: walk
part: "HAL-FORMS"
title: "Walk Once with Claude, in HAL-FORMS"
kicker: The only run that costs tokens
say: "The walk: ARTIE took the goal line by line, every party answering in HAL-FORMS, and Claude chose among the templates on offer. Twenty-eight model calls, about thirty-one thousand input tokens, most read from cache, sixty-three steps in sixty-eight seconds. It merged, built, ran the smoke test, and promoted 501 to Dev."
sources:
