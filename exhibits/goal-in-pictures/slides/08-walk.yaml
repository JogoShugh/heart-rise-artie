html: |
  <h2>Walk Once with Claude, in HAL-FORMS</h2>
  <div class="stats" style="grid-template-columns: repeat(4, minmax(0, 1fr))">
    <div class="stat"><b>28</b><span>model calls, claude-sonnet-5-5</span></div>
    <div class="stat"><b>31,043</b><span>input tokens; 41,068 read from cache</span></div>
    <div class="stat"><b>4,901</b><span>output tokens</span></div>
    <div class="stat"><b>63</b><span>steps, in 68 s</span></div>
  </div>
  <p class="lead">Watch, merge by squashing, build, smoke test (three renewals, one refused 412 on purpose, a problem report), promote: pull request 501 to Dev.</p>
  <p><a href="../merge-watch-two-dialects/runs/hal-forms/capture.html" target="_blank" rel="noopener">The walk, step by step ↗</a></p>
