name: city
part: "The goal"
title: "The Release as a City"
kicker: Servers are districts, resources buildings, links streets
code:
  file: scenes.js
  title: Draws the city and walks ARTIE through it, walked and replayed
say: "Same map, as a city. Each server is a district. Each resource is a building. Each link is a street, named by its relation. ARTIE never gets a street map: it reads the signs at every corner. Three times it takes a cab, a bookmark from the goal's inputs. At the watcher and at Jenkins it sits and naps until the reply's answered. Press the walk: at every crossing Claude reads the signs and picks. Press the replay: same streets, faster, and at every crossing the sign is checked against the pin, and nobody's asked."
sources:
  - ["release.heart.yaml, the kept script", "https://github.com/JogoShugh/heart-rise-artie/blob/main/exhibits/merge-watch-release/release.heart.yaml"]
html: |
  <h2>The Release as a City</h2>
  <div class="city">
    <p class="note">Read as HEART, this slide links a script (<code>deck:code</code>) that draws the city and walks ARTIE through it. Without it, the route: forge index, <code>scm:pulls-get</code> to 501; by bookmark to the watcher, <code>watcher:watch</code>, rest; back to 501, <code>scm:merge</code>; by bookmark to the CI wrapper, <code>ci:build</code>, rest; <code>hr:in-reply-to</code> to the build; <code>ci:smoke-test</code> and <code>ci:deployment</code> to the library; by bookmark to Dev, <code>env:get-environment</code>, <code>env:promote</code>.</p>
  </div>
