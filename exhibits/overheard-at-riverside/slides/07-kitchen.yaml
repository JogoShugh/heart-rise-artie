html: |
  <h2>Ana's kitchen</h2>
  <p class="setting">Today. Same library, same card, and somehow the same three books. Ana calls Marcus out of habit.</p>
  <div class="pair">
    <div class="script">
      <div class="line"><span class="who ana">Ana</span><p>Marcus, it's Ana Torres. Remember the sticky notes?</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>I think I still have one.</p></div>
      <div class="line"><span class="who ana">Ana</span><p>I opened my account on my phone. Three books, with their titles. On <i>Matilda</i>: Renew and Return. I pressed Renew, and it's due December third.</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>Nobody types POST anymore.</p></div>
      <div class="line"><span class="who ana">Ana</span><p><i>The Hobbit</i>'s Renew is grey, and under it: a hold is waiting. <i>Charlotte's Web</i> says it's been renewed the most allowed. Return is still there.</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>Same rules as 1997. The page knows them before you try. Every page is its own forms.html now: for just that book, just now.</p></div>
    </div>
    <figure><img src="media/heart-html.gif" alt="Ana opens her account, renews Matilda, then finds The Hobbit's Renew greyed with the reason." loading="lazy"><figcaption>HEART's HTML: <i>Matilda</i> renews; <i>The Hobbit</i> says why not.</figcaption></figure>
  </div>
  <details class="more"><summary>Stills, and where the page comes from</summary>
    <div class="pair">
      <figure><img src="media/account.png" alt="Ana's account, linking her three books by title." loading="lazy"><figcaption>Her account links each book by title.</figcaption></figure>
      <figure><img src="media/matilda-offers.png" alt="Matilda, offering Renew and Return." loading="lazy"><figcaption><i>Matilda</i> offers Renew and Return.</figcaption></figure>
    </div>
    <p class="note">The library declares its acts once; heart-core serves this HTML from that declaration, beside the JSON faces agents read.</p>
  </details>
points:
  - "The human web answers that question: each page carries the controls its state allows."
  - "A grey button with its reason is information and controls together, for one resource, at one moment."
  - "The rules are the same as in 1997. What changed is where they arrive: in the answer, before the attempt."
