name: this-deck
part: Closing
title: "Surprise: this deck is HEART too"
fiction: false
html: |
  <h2>Surprise: this deck is HEART too</h2>
  <p class="dek">You've been using a HEART client the whole time.</p>
  <div class="map">
    <div><code>contents.json</code><span>The bookmark: the only address this page knows. It embeds every slide, and the outline is drawn from it.</span></div>
    <div><code>help-line.json</code><span>One slide. Its HTML is the information; its links are the controls: next, prev, contents, and a plain page.</span></div>
    <div><code>heart-ts</code><span>The second HEART client, built for the browser. → and ← follow next and prev; the outline follows the contents, then an item.</span></div>
    <div><code>deck:code</code><span>Code on demand: the Great Divorce links the script that animates it, with its digest. The page knew no animation; heart-ts ran what the slide linked.</span></div>
    <div><code>no headers, no acts</code><span>A static host can't send the profile header, so each file names its profile in its own links. It takes no POST, so the deck offers no acts; the library shows those.</span></div>
  </div>
  <ul>
    <li><b>The page knows no slides.</b> Add, cut or reorder them by changing the resources; this page's code doesn't change.</li>
    <li><b>See for yourself:</b> open “This slide's resource” below any slide: what heart-ts asked, and what it read.</li>
    <li><b>Without the client,</b> each slide links a plain HTML page of itself, as <code>alternate</code>, typed <code>text/html</code>.</li>
  </ul>
