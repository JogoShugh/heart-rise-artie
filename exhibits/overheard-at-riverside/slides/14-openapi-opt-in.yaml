name: openapi-opt-in
part: Scene four · an hour later
title: An OpenAPI client can opt in
topic: "OpenAPI clients can opt in"
fiction: true
html: |
  <h2>An OpenAPI client can opt in</h2>
  <div class="script">
    <div class="line"><span class="who priya">Priya</span><p>Your agent reads our OpenAPI. Does it have to switch to HEART to stop guessing?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>No. Each plain answer can carry one more header: a link to what this loan allows now. The description already says how to read it.</p></div>
    <div class="line"><span class="who priya">Priya</span><p>And a client that doesn't read it?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Never notices. Same body, one header it ignores.</p></div>
  </div>
  <pre><code>GET /loans/3310   Accept: application/json

  200 OK   Content-Type: application/json
  <span class="add">Link: &lt;/affordance-sets/76c46cea7232ed43&gt;; rel="https://w3id.org/heart-rise/rels/forms";
        type="application/hal+json"; integrity="sha256-dsRs6nIy7UNUPi6OIILLINPmCkhlW8yhxdwuxe7pDCI="</span>

  { "id": 3310, "title": "The Hobbit", …, "standing": "hold waiting" }</code></pre>
  <div class="pair">
    <div class="step human">
      <b>Reading the description alone</b>
      <ul>
        <li><i>The Hobbit</i>: renew and return both look possible.</li>
        <li>It renews, and learns only after the call: 409, “A hold is waiting for this book, so it can't be renewed.”</li>
      </ul>
    </div>
    <div class="step agent">
      <b>Opted in to the link</b>
      <ul>
        <li><i>The Hobbit</i>: return only. Nothing is sent that would be refused.</li>
        <li><i>Matilda</i>: renew and return.</li>
        <li>Each set is fetched once by its address, and checked against its integrity.</li>
      </ul>
    </div>
  </div>
  <details class="more"><summary>What opting in takes, in the client</summary>
  <pre><code>// The link the description documents (x-heart-affordances), the set it names,
  // and the operations a form in it matches, by method and path template.
  async function allowedNow(header, candidates) {
    const link = linked(header);
    if (!link) return { offered: candidates, from: "no link" };
    if (!sets.has(link.href)) {
      const set = await send("GET", link.href, { Accept: link.type });
      const [algorithm, digest] = link.integrity.split(/-(.*)/s);
      const intact = createHash(algorithm).update(set.bytes).digest("base64") === digest;
      if (!intact) throw new Error(`the set at ${link.href} does not match its integrity`);
      sets.set(link.href, Object.values(set.json._forms));
    }
    const forms = sets.get(link.href);
    return { offered: candidates.filter((op) =&gt; forms.some((f) =&gt;
      f.method === op.method &amp;&amp; matches(op.path, f._links.target.href))), from: link.href };
  }</code></pre>
    <p class="note">From <code>live/openapi-client.mjs</code>, an OpenAPI client of the running library service; every exchange is in <code>openapi-optin.capture.yaml</code>. The description's <code>x-heart-affordances</code> names the header, the relation, and how to match.</p>
  </details>
points:
  - "<b>One header:</b> a plain JSON answer can link the form set its state offers."
  - "<b>Opted in:</b> the client sends only what is allowed now, each set fetched once and checked by its digest."
  - "<b>Ignored:</b> a client that doesn't read the header sees no change."
