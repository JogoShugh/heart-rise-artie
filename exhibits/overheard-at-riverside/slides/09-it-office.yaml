html: |
  <h2>The IT office</h2>
  <figure><img src="media/openapi-list.png" alt="Swagger UI for Riverside Public Library: GET /accounts, GET /accounts/{id}, GET /loans, GET /loans/{id}, POST /loans/{id}/actions/renew, POST /loans/{id}/actions/return." loading="lazy"><figcaption>The library's API as HEART serves it in OpenAPI, shown in Swagger UI: every operation, for every loan alike.</figcaption></figure>
  <p class="setting">Today. Priya, who builds the library's API, has it on her screen. Sam builds the assistant that renews books for members.</p>
  <div class="script">
    <div class="line"><span class="who priya">Priya</span><p>There's the loans API. Every operation, every field, every status code.</p></div>
    <div class="line"><span class="who sam">Sam</span><p>And renew, for every loan. My agent sent one for <i>The Hobbit</i> and got a 409.</p></div>
    <div class="line"><span class="who priya">Priya</span><p>The rule's in the description: fewer than three renewals, no hold waiting.</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Remember forms.html? Every address, the same for every loan, and you found out by trying.</p></div>
    <div class="line"><span class="who priya">Priya</span><p>…This one has a Try it out button.</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Ana's page gives her a grey button with the reason. My agent gets a 409.</p></div>
  </div>
  <details class="more"><summary>Renew, opened, beside 1997's forms.html</summary>
    <div class="pair">
      <figure><img src="media/openapi-renew.png" alt="Swagger UI's renew operation: offered while the book is out, renewed fewer than three times, and no one's hold is waiting; an id, an If-Match, Try it out." loading="lazy"><figcaption>Today: renew, its rule in prose, and Try it out.</figcaption></figure>
      <figure><img src="media/forms-html.png" alt="forms.html at RENEW A LOAN: method POST, an address with {loanId}, a body with {card} and {pin}." loading="lazy"><figcaption>1997: RENEW A LOAN in forms.html, and what to type.</figcaption></figure>
    </div>
  </details>
  <details class="more"><summary>The two documents behind them</summary>
    <div class="pair">
      <div><span class="label">1997: the Perl site's forms.yaml</span>
  <pre><code>/loans/{loanId}/renew:
    post:
      summary: Renew a loan
      description: Only while it is renewed
        fewer than three times and no one's
        hold is waiting.
      responses:
        '200': renewed
        '409': it cannot be renewed</code></pre></div>
      <div><span class="label">Today: heart-core's OpenAPI twin</span>
  <pre><code>/loans/{id}/actions/renew:
    post:
      description: Offered while the book is out,
        renewed fewer than three times, and
        no one's hold is waiting.
      requestBody: { $ref: Renew }
      responses:
        '200': The loan after the act
        '409': NotOffered</code></pre></div>
    </div>
    <p class="note">Both list renew for every loan, always. forms.yaml is the OpenAPI of the web that wasn't, and forms.html its Swagger UI. Whether this loan can be renewed now, each says only after the call.</p>
  </details>
