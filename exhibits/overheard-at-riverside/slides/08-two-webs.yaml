title: The same moment, two webs
fiction: false
html: |
  <h2>The same moment, two webs</h2>
  <div class="pair">
    <figure><img src="media/renew-409.png" alt="1997: a renewal typed by hand and refused, 409." loading="lazy"><figcaption>1997, the web that wasn't: typed, sent, refused.</figcaption></figure>
    <figure><img src="media/hobbit-greyed.png" alt="Today: Renew greyed, with the reason, before anything is sent." loading="lazy"><figcaption>Today: Renew greyed, with the reason, before anything is sent.</figcaption></figure>
  </div>
  <ul>
    <li><b>Same library, same rules:</b> renew is refused while a hold is waiting, or after three renewals.</li>
    <li><b>The web that wasn't:</b> a document of every address, pages of numbers, a POST typed by hand.</li>
    <li><b>The web we got:</b> each page carries the controls its state allows.</li>
  </ul>
