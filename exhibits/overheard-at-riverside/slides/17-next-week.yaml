name: next-week
part: Scene five · the next week
title: "Find the way once, then keep it"
fiction: true
preamble:
  tone: heart
  label: "With an agent and a goal"
  text: "You give an assistant one sentence of purpose and a member's name. The first time, a model finds the way through the library's answers. After that, a kept script does the same with no model, and stops rather than guess if the library changes."
html: |
  <h2>Find the way once, then keep it</h2>
  <p class="setting">Ana comes in to return a book. Sam shows her the assistant; Priya is at the next desk.</p>
  <div class="script">
    <div class="line"><span class="who sam">Sam</span><p>We told it once, in plain words, what to do for a member: renew each book that can be renewed, and say why for any that can't. Then we gave it your name.</p></div>
    <div class="line"><span class="who ana">Ana</span><p>And?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>It renewed <i>Matilda</i>. It said <i>The Hobbit</i> has no renew form, because a hold is waiting, and that <i>Charlotte's Web</i> was renewed the most allowed.</p></div>
    <div class="line"><span class="who ana">Ana</span><p>That's what my phone says.</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Same answers, a different client. The first time, the model found the way: eleven calls to Claude. We kept what it did as a short script that takes a member's name. Every run since: no model.</p></div>
    <div class="line"><span class="who ana">Ana</span><p>When the hold on <i>The Hobbit</i> clears, will it renew it?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>If the library offers renew then, yes. It acts on what's offered.</p></div>
    <div class="line"><span class="who priya">Priya</span><p>We moved renew to a new address on Monday. Did it break?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>No. It remembers what the form does, not where it points. Change the form itself, and it stops instead of guessing.</p></div>
    <div class="line"><span class="who ana">Ana</span><p>And <i>Charlotte's Web</i>?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Done renewing. The library offers return.</p></div>
    <div class="line"><span class="who ana">Ana</span><p>Then I'll bring it back in person. Some things I still like to do by hand.</p></div>
  </div>
  <div class="stats">
    <div class="stat"><b>11</b><span>model calls, once, to find the way</span></div>
    <div class="stat"><b>0</b><span>model calls each run after</span></div>
  </div>
  <div class="pair">
    <div><span class="label">What they wrote: member.goal.md</span>
  <pre><code>Renew each book a member has out that can be
  renewed, and say why for any that can't.

  - Find the account of the member named {member}
    - For each book they have out: renew it if
      renewing is offered; otherwise say why it
      can't be renewed</code></pre></div>
    <div><span class="label">What ARTIE kept: member.heart.yaml</span>
  <pre><code>inputs:
    member:

  steps:
    - act: library:search-accounts
      fields:
        name: ${member}
      then:
        - follow: item
          title: ${member}
          then:
            - for-each: loan
              then:
                - when-offered:
                    - act: library:renew
                      inferred: renew this book (${loan.title})</code></pre></div>
  </div>
  <details class="more"><summary>The run, and what the script keeps of the goal</summary>
    <ul>
      <li><b>The goal's words</b> stay in the script, beside the step they asked for: each step's <code>intent</code>, and the model's own words for each act it chose, <code>inferred</code>. No member's name or book's title the run met is written in it.</li>
      <li><b>Kept</b> by <code>artie generate</code> from the run: the member found by the name it is given, then every book their account links, renewed when it offers renew.</li>
      <li><b>Pinned</b> by what the form does, its act, not its address: a moved form costs no model call; a changed one stops the run.</li>
      <li><b>The first run:</b> Claude Sonnet 5.5, ARTIE at L2, for Ana Torres; 11 calls; 28,359 input tokens (8,713 sent, 17,860 read from cache, 1,786 written to it); 2,108 output.</li>
    </ul>
  </details>
points:
  - "<b>Once, with a model:</b> 11 calls to find the way for a member."
  - "<b>Kept:</b> a script that takes the member's name. Every run after calls no model."
  - "<b>Pinned by meaning:</b> a moved form is followed; a changed form stops the run."
