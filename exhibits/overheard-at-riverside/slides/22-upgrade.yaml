name: upgrade
part: Closing
title: Upgrading is optional
fiction: false
html: |
  <h2>Upgrading is optional</h2>
  <p class="dek">Switch the deck to Plain JSON at the top, then back to HEART. Same slides, same client.</p>
  <div class="pair">
    <div class="step human">
      <b>Plain JSON</b>
      <ul>
        <li>Each slide is data only: no links, no profile.</li>
        <li>heart-ts reads it as data only, and offers nothing.</li>
        <li>So the page has to know the list, build every address from <code>deck/plain/{name}.json</code>, and count to the next one: a client of forms.yaml.</li>
      </ul>
    </div>
    <div class="step agent">
      <b>HEART</b>
      <ul>
        <li>The same data, with its links and its profile.</li>
        <li>The same client follows them.</li>
        <li>The page knows one address: the contents.</li>
      </ul>
    </div>
  </div>
  <p class="lead">Nothing in the client chose the upgrade. The resources did.</p>
  <details class="more"><summary>And a plain JSON client reading the HEART files?</summary>
    <ul>
      <li>It still works. HAL is JSON: the slide's data is all there, and <code>_links</code> is one more member it ignores.</li>
      <li>So a service can add its controls without breaking the clients it has, and each client takes them up when it is ready.</li>
    </ul>
  </details>
