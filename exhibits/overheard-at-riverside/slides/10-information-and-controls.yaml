title: Information and Controls
fiction: false
html: |
  <h2>Information and Controls</h2>
  <blockquote class="fielding">“When I say hypertext, I mean the simultaneous presentation of information and controls such that the information becomes the affordance through which the user (or automaton) obtains choices and selects actions.”<cite>Roy T. Fielding, 2008</cite></blockquote>
  <p class="lead">Hypermedia as the engine of application state, <b>HATEOAS</b>, is the most followed constraint of all time on the human web, and the least followed on the machine web.</p>
  <ul>
    <li><b>The human web:</b> every page you have ever loaded follows it. It carries what you can do, from where you are, now.</li>
    <li><b>The machine web, JSON over HTTP:</b> the data in one answer, the operations in a document beside it, the same for every state.</li>
  </ul>
  <details class="more"><summary>His complaint, 2008, in his words</summary>
    <blockquote class="fielding"><p>“I am getting frustrated by the number of people calling any HTTP-based interface a REST API. Today’s example is the SocialSite REST API. That is RPC. It screams RPC. There is so much coupling on display that it should be given an X rating.</p>
    <p>What needs to be done to make the REST architectural style clear on the notion that hypertext is a constraint? In other words, if the engine of application state (and hence the API) is not being driven by hypertext, then it cannot be RESTful and cannot be a REST API. Period. Is there some broken manual somewhere that needs to be fixed?”</p>
    <cite>The post’s opening</cite></blockquote>
    <blockquote class="fielding"><p>“A REST API should be entered with no prior knowledge beyond the initial URI (bookmark) and set of standardized media types that are appropriate for the intended audience (i.e., expected to be understood by any client that might use the API).”</p>
    <cite>From the same post</cite></blockquote>
    <p class="note">Roy T. Fielding, <a href="https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven">“REST APIs must be hypertext-driven”</a>, 20 October 2008; the rule itself, dissertation, 2000, §5.1.5.</p>
  </details>
