name: help-line
part: Scene one · 1997
title: The help line
topic: "Every act from a manual"
fiction: true
preamble:
  tone: then
  label: "In the web that wasn't"
  text: "You want to renew three library books. The site gives you a manual of addresses and a page of numbers. You copy, you type, you send, and only then do you learn whether it was allowed."
html: |
  <h2>The help line</h2>
  <p class="setting">Fall 1997, a Tuesday evening, in the web that wasn't. Ana Torres has three library books due. She calls Riverside Public Library, and Marcus answers.</p>
  <div class="pair">
    <div class="script">
      <div class="line"><span class="who ana">Ana</span><p>I'm trying to renew my books online, and I think I'm doing it wrong.</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>Do you have forms.html open?</p></div>
      <div class="line"><span class="who ana">Ana</span><p>It says, “To do something, type its address into your browser.” Number three, in capitals: RENEW A LOAN. Method, POST. Address, <code>/cgi-bin/library.cgi/loans/{loanId}/renew</code>.</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>That's the one. Put your loan number where it says loanId.</p></div>
      <div class="line"><span class="who ana">Ana</span><p>And where do I get my loan number?</p></div>
      <div class="line"><span class="who marcus">Marcus</span><p>From your loans page. Type its address, with your card number and your PIN on the end.</p></div>
    </div>
    <figure><img src="media/forms-html.png" alt="forms.html at RENEW A LOAN: method POST, an address with {loanId}, a body with {card} and {pin}." loading="lazy"><figcaption>forms.html: every operation, for every loan alike, and what to type.</figcaption></figure>
  </div>
  <details class="more"><summary>What's real behind the scene</summary>
    <ul>
      <li>A site as 1997 would run it: Apache, and CGI scripts in Perl with CGI.pm.</li>
      <li>Imagine YAML existed in 1997, and the equivalent of OpenAPI was made then, named <code>forms.yaml</code>. <code>forms.cgi</code> reads it with YAML::XS and writes <code>forms.html</code>, the page people browse it by.</li>
      <li>WebWalker, the browser of the web that wasn't, has a method menu and a body box, because pages have no forms.</li>
    </ul>
  </details>
points:
  - "<b>Information:</b> her loans, as a page of numbers. Nothing on it can be pressed."
  - "<b>Controls:</b> forms.html, a manual of every operation, the same for every loan."
  - "<b>Who joins them:</b> Ana. She finds the loan number and types it into the address by hand."
