name: bloat
part: Scene six · a month later
title: "Is hypermedia bloated? Measured"
fiction: true
html: |
  <h2>Is hypermedia bloated? Measured</h2>
  <div class="script">
    <div class="line"><span class="who priya">Priya</span><p>Fifteen people, every book, and the forms in every answer. Isn't that a lot of bytes? And a lot of round trips?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>At L0, yes: every loan carries its forms, almost two kilobytes each.</p></div>
    <div class="line"><span class="who sam">Sam</span><p>At L1, a loan carries a link to its forms instead. Every loan in the same state links the same set, at an address that never changes, so the client fetches it once and keeps it.</p></div>
    <div class="line"><span class="who priya">Priya</span><p>How many sets, for the whole company?</p></div>
    <div class="line"><span class="who sam">Sam</span><p>Four. At L2 the schemas move out of the sets too, shared the same way: two more requests, here.</p></div>
  </div>
  <div class="table-scroll"><table>
    <thead><tr><th>The same run, at</th><th>Requests</th><th>Bytes received</th><th>One loan's answer</th><th>Time on the wire</th></tr></thead>
    <tbody>
      <tr><td><b>L0</b>, forms in every answer</td><td>110</td><td>118,348</td><td>1,871 bytes</td><td>246 ms</td></tr>
      <tr><td><b>L1</b>, forms linked, one set per state</td><td>114: 110 + 4 sets, once each</td><td>52,404 (−56%)</td><td>462 bytes (−75%)</td><td>152 ms</td></tr>
      <tr><td><b>L2</b>, schemas linked too</td><td>116: + 2 schemas</td><td>51,972</td><td>462 bytes</td><td>154 ms</td></tr>
    </tbody>
  </table></div>
  <p class="note">The kept company script for Harbor Point, run with no model at each rung, measured from its own exchanges. The times are one machine's loopback: read them as proportions.</p>
  <div class="pair">
    <div><span class="label">A loan at L0: its forms inside it</span>
  <pre><code>{ "id": 3321, "title": "The Phantom Tollbooth",
    "standing": "renewable", …,
    "_links": { "self": …, "hr:unavailable": … },
    "_forms": {
      "library:renew": { "title": "Renew", "method": "POST", … },
      "library:report-problem": {
        "title": "Report a problem", "method": "POST",
        "_links": { "target": { "href": "/loans/3321/actions/report-problem" } },
        "schema": { "required": ["problem"], "properties": {
          "problem": { "type": "string", "hr:options": { "link": { "href": "/problem-kinds" }, … } },
          "comment": { "type": "string", "maxLength": 200 } } },
        "hr:integrity": "sha256-NNKB…" },
      "library:return": { … }
    } }</code></pre></div>
    <div><span class="label">The same loan at L2: a link to the set</span>
  <pre><code>{ "id": 3321, "title": "The Phantom Tollbooth",
    "standing": "renewable", …,
    "_links": {
      "self": { "href": "/loans/3321" },
      "hr:forms": {
        "href": "/affordance-sets/292caa98b3e91085",
        "integrity": "sha256-KSyq…" } } }</code></pre></div>
  </div>
  <details class="more"><summary>The set every renewable loan links, fetched once</summary>
  <pre><code>GET /affordance-sets/292caa98b3e91085

  { "_forms": {
      "library:renew": { … },
      "library:report-problem": {
        "title": "Report a problem", "method": "POST",
        "_links": { "target": { "href": "/loans/{id}/actions/report-problem", "templated": true } },
        "hr:templatePointers": { "id": "/id" },
        "schema": { "$ref": "/schemas/6770c985e2914e09", "hr:integrity": "sha256-Z3DJ…" } },
      "library:return": { … } } }</code></pre>
    <ul>
      <li><b>Shared:</b> the target is a template, filled from each loan's own id, so one set serves every loan in its state.</li>
      <li><b>Kept for good:</b> its address is its content's digest, so it never changes there; the client checks it against the integrity the loan's link carries.</li>
      <li><b>Measured by</b> <code>artie/rungs/measure.mjs</code> from <code>L0</code>, <code>L1</code> and <code>L2.trace.yaml</code>; the numbers and these answers in full are in <code>rungs.yaml</code>.</li>
    </ul>
  </details>
points:
  - "<b>L0:</b> every answer carries its forms, about 1.9 KB a loan."
  - "<b>L1:</b> one shared form set per state, fetched once: 56% fewer bytes in all, loan answers 75% smaller."
  - "<b>L2:</b> the schemas are shared too. Everything shared is content-addressed and cached."
