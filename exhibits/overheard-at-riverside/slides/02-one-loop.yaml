name: one-loop
part: Opening
title: One loop, two readers
fiction: false
html: |
  <h2>One loop, two readers</h2>
  <p class="dek">Where this is headed: the way a person uses the web is the way an agent can.</p>
  <div class="key"><span class="h">A person, in a browser</span><span class="a">ARTIE, an agent</span></div>
  <div class="loops">
    <div class="beat">
      <div class="step human"><b>Look</b><span>Read the page: what it says, and the buttons it shows.</span></div>
      <div class="same">the same step</div>
      <div class="step agent"><b>Sync</b><span>Read the state and the controls offered now, with its version tag.</span></div>
    </div>
    <div class="arrow" aria-hidden="true">→</div>
    <div class="beat">
      <div class="step human"><b>Think</b><span>Choose what to press.</span></div>
      <div class="same">the same step</div>
      <div class="step agent"><b>Reason</b><span>Choose among the offered controls: a model once, then a kept script with none.</span></div>
    </div>
    <div class="arrow" aria-hidden="true">→</div>
    <div class="beat">
      <div class="step human"><b>Act</b><span>Press it. The next page comes back.</span></div>
      <div class="same">the same step</div>
      <div class="step agent"><b>Act</b><span>Send the form, with If-Match. The answer is the next state.</span></div>
    </div>
  </div>
  <p class="round">↺ round again, from what came back</p>
  <p class="lead">Same server, same answer, same controls. An agent doesn't need a different web; it needs the one people already use.</p>
  <details class="more"><summary>Where the two differ</summary>
    <ul>
      <li><b>Seeing and reading:</b> a person sees a grey button; ARTIE reads the same absence as data, with its reason.</li>
      <li><b>Judgment:</b> a person judges every time; ARTIE asks a model only where judgment is needed, then keeps the way it found.</li>
      <li><b>Staleness:</b> a person reloads; ARTIE sends back the version it read, and a stale act is refused, 412.</li>
    </ul>
  </details>
