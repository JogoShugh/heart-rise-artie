  <h1>Overheard at Riverside</h1>
  <p class="dek">The web that wasn't, and the web we got, told as conversations overheard at one small library.</p>
  <div class="notice">
    <b>A fictional conversation</b>
    <p>The four people below are invented, and so is the 1997 web they live through: one where pages never got forms. The library, its rules, the code, every screen and every number come from running demos: a Perl site built for the web that wasn't, and HEART services today.</p>
  </div>
  <div class="cast" aria-label="The people in the story">
    <div><b>Ana Torres</b><span>A member of Riverside Public Library, with three books out: <i>The Hobbit</i>, <i>Matilda</i> and <i>Charlotte's Web</i>. We meet her in 1997, and again today.</span></div>
    <div><b>Marcus</b><span>On the library's help line in 1997, talking Ana through a site with no buttons. Still there today.</span></div>
    <div><b>Priya</b><span>Builds the library's API, today.</span></div>
    <div><b>Sam</b><span>Builds an assistant that renews library books for members, today.</span></div>
  </div>
  <div class="pair">
    <figure><img src="media/renew-409.png" alt="1997, the web that wasn't: a renewal typed by hand and refused, 409, a hold is waiting."><figcaption>1997, the web that wasn't</figcaption></figure>
    <figure><img src="media/hobbit-greyed.png" alt="Today: The Hobbit's Renew button greyed, with the reason, a hold is waiting."><figcaption>Today, the web we got</figcaption></figure>
  </div>
