  <h1>Overheard at Riverside</h1>
  <p class="dek">The web that wasn't, and the web we got, told as five conversations overheard at one small library.</p>
  <div class="notice">
    <b>A fictional conversation</b>
    <p>Ana, Marcus, Priya and Sam are invented, and so is the 1997 web they argue about: one where pages never got forms. The library, its rules, every screen and every number come from running demos: a Perl site built for the web that wasn't, and HEART services today.</p>
  </div>
  <div class="pair">
    <figure><img src="media/renew-409.png" alt="1997, the web that wasn't: a renewal typed by hand and refused, 409, a hold is waiting."><figcaption>1997, the web that wasn't</figcaption></figure>
    <figure><img src="media/hobbit-greyed.png" alt="Today: The Hobbit's Renew button greyed, with the reason, a hold is waiting."><figcaption>Today, the web we got</figcaption></figure>
  </div>
