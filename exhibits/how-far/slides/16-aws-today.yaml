name: aws-today
part: "A preview: AWS as HEART"
title: AWS already names the acts. Only the forms are missing
kicker: A preview of HEART · 1 of 5 · Today
say: "AWS's real sample response, written as YAML, all of it but the certificate's PEM body. The relations are typed and per item: delete and update sit on the certificate, generate on the list. What a client can't learn from it: the method, the fields, the limits. Those are on three other docs pages, linked by the curie. The next four slides are a mockup: the same resources as HEART would answer, at each rung."
sources:
  - ["AWS: GetClientCertificates", "https://docs.aws.amazon.com/apigateway/latest/api/API_GetClientCertificates.html"]
  - ["GenerateClientCertificate", "https://docs.aws.amazon.com/apigateway/latest/api/API_GenerateClientCertificate.html"]
  - ["UpdateClientCertificate", "https://docs.aws.amazon.com/apigateway/latest/api/API_UpdateClientCertificate.html"]
  - ["DeleteClientCertificate", "https://docs.aws.amazon.com/apigateway/latest/api/API_DeleteClientCertificate.html"]
html: |
  <h2>AWS already names the acts. Only the forms are missing</h2>
  <p class="refs"><small style="background: #B5562B; color: #fff; padding: 0.15rem 0.6rem; border-radius: 1rem; font-weight: 700">MOCKUP</small> <small><b>Today</b> · L0 · L1 · L2</small> <small><i>Green: the relations AWS already offers.</i></small></p>
  <div class="split" style="grid-template-columns: 1fr 1fr 1fr">
  <pre><code># GET /clientcertificates  (AWS's sample)
  <b>_links:</b>
    curies:
      name: clientcertificate
      href: https://docs.aws.amazon.com/
        apigateway/latest/developerguide/
        restapi-clientcertificate-{rel}.html
      templated: true
    self:
      href: /clientcertificates
    clientcertificate:by-id:
      href: /clientcertificates/
        {clientcertificate_id}
      templated: true
  <span class="add">  clientcertificate:generate:
      href: /clientcertificates</span>
    item:
      href: /clientcertificates/xmbiqp</code></pre>
  <pre><code><b>_embedded:</b>
    item:
      _links:
        self:
          href: /clientcertificates/xmbiqp
  <span class="add">      clientcertificate:delete:
          href: /clientcertificates/xmbiqp
        clientcertificate:update:
          href: /clientcertificates/xmbiqp</span>
      clientCertificateId: xmbiqp
      createdDate: 2015-12-08T18:02:16Z
      description: test-client-cert-2
      expirationDate: 2016-12-07T18:02:16Z
      pemEncodedCertificate: |
        -----BEGIN CERTIFICATE-----
        MIIC6DC...XuHVdZ5r27XRRXEjg==
        -----END CERTIFICATE-----</code></pre>
    <div class="rows">
      <h3>Still looked up elsewhere</h3>
      <table>
        <thead><tr><th>Relation</th><th>Method</th><th>Body</th></tr></thead>
        <tbody>
          <tr><td>generate</td><td>POST</td><td>description, tags</td></tr>
          <tr><td>update</td><td>PATCH</td><td>patchOperations</td></tr>
          <tr><td>delete</td><td>DELETE</td><td>none</td></tr>
        </tbody>
      </table>
      <p>Three more docs pages, read by a developer and coded into a client. That is the gap HEART closes, one rung at a time.</p>
    </div>
  </div>
