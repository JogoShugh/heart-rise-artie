name: hooks
part: How it was built
title: Instructions are advisory. Hooks are not.
kicker: How it was built · Determinism through hooks
say: "The bdd-gates skill. A model can be told to write the test first; it can't be trusted to always do it. Hooks make it a property of the environment. They cost zero tokens."
sources:
  - ["bdd-gates skill", "https://github.com/JogoShugh/bdd-gates-skill"]
  - ["Claude Code hooks", "https://code.claude.com/docs/en/hooks"]
  - ["Git hooks", "https://git-scm.com/docs/githooks"]
fragments:
  - name: hooks
    label: The hooks that gate every change (core/hooks.json)
    source: bdd-gates:core/hooks.json
    lang: json
html: |
  <h2>Instructions are advisory. Hooks are not.</h2>
  <div class="split" style="grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);">
    <div class="rows">
      <div class="table-scroll"><table>
        <thead><tr><th>Gate</th><th>Where</th><th>What it holds</th></tr></thead>
        <tbody>
          <tr><td>Gherkin first</td><td>PreToolUse</td><td>No production code until a scenario says what it must do</td></tr>
          <tr><td>Red, logged</td><td>PostToolUse</td><td>A failing test run is recorded before the first src/main write</td></tr>
          <tr><td>Green to stop</td><td>Stop</td><td>The session can’t end with the suite red</td></tr>
          <tr><td>Ordering at commit</td><td>git pre-commit</td><td>The log must show feature, red, code, green, in that order</td></tr>
          <tr><td>Gate protection</td><td>PreToolUse</td><td>The gates and their log can’t be edited by the model</td></tr>
        </tbody>
      </table></div>
      <p class="punch">Claude Code hooks guard the edits; git hooks guard the history.</p>
      <p class="refs"><deck-fragment name="hooks">hooks.json</deck-fragment></p>
    </div>
    <div class="card dark" style="box-shadow: inset 0 0 0 1.5px rgba(227, 179, 65, 0.45); align-content: center; padding: 1.6rem;">
      <p style="font: 700 3.6rem/1 var(--display); color: #e3b341; margin: 0;">0</p>
      <p>model calls to enforce them. The gates are scripts the harness runs, not instructions the model may forget.</p>
    </div>
  </div>
