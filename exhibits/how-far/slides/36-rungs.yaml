name: rungs
part: What it costs
title: "L0, L1, L2: one page, three ways to deliver it"
kicker: “But isn’t hypermedia bloated?”
say: "The analogy: a web page with all its CSS and JavaScript inlined, versus the same page with linked, cached files. Same page, different delivery. L0 inlines everything; L1 links the form set; L2 links the schemas too, content-addressed and immutable for a year. The numbers are from five real releases per forge, with no model calls. From the second release on, about 50 form-set and schema reads per release never reach the network: ARTIE's cache answers them. Resources themselves still revalidate by ETag and answer 304."
sources:
  - ["RFC 9111 HTTP Caching", "https://www.rfc-editor.org/rfc/rfc9111"]
  - ["Report: the cache, release by release", "https://jogoshugh.github.io/heart-rise-artie/reports/merge-watch-real-github/"]
html: |
  <h2>L0, L1, L2: one page, three ways to deliver it</h2>
  <div class="split">
    <div class="rows">
      <p class="lead"><i>Like a page with its CSS and JavaScript inlined, or linked and cached.</i></p>
      <div class="step"><h3>L0 · State, forms and schemas in one answer</h3><p>Simple and correct: like a page with everything inlined.</p></div>
      <div class="step"><h3>L1 · Prefer: forms=link</h3><p>The form set is its own content-addressed link, cached.</p></div>
      <div class="step"><h3>L2 · Prefer: forms=link, schema=link</h3><p>Schemas linked too: immutable, shared across forms, states and resources.</p></div>
      <p class="punch">“L0 buys correctness, L2 buys economy.” HTTP caching does the scaling, as it always has on the Web.</p>
      <p class="refs"><deck-ref name="cache"></deck-ref></p>
    </div>
    <div class="rows">
      <table>
        <thead><tr><th>Requests on the network, per release</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th><th>5th</th></tr></thead>
        <tbody>
          <tr><td>L0</td><td>59</td><td>59</td><td>59</td><td>56</td><td>59</td></tr>
          <tr><td>L2, a fresh cache each release</td><td>112</td><td>112</td><td>111</td><td>106</td><td>112</td></tr>
          <tr><td style="color: var(--leaf); font-weight: bold">L2, one cache kept</td><td>112</td><td style="color: var(--leaf); font-weight: bold">61</td><td style="color: var(--leaf); font-weight: bold">59</td><td style="color: var(--leaf); font-weight: bold">58</td><td style="color: var(--leaf); font-weight: bold">59</td></tr>
        </tbody>
      </table>
      <p class="cite"><i>Real GitHub, five releases, no model calls. A warm release sends about 53 fewer requests: the form sets and schemas never leave ARTIE’s memory.</i></p>
      <div class="split">
        <div><h3>5,069</h3><p>requests never sent over 100 releases on GitHub (3,985 on GitLab)</p></div>
        <div><h3>3.4 MB</h3><p>not received over those 100 on GitHub, 23% (GitLab: 3.8 MB, 59%)</p></div>
      </div>
      <p class="cite">Bytes: JSON bodies before compression, headers excluded. Extrapolated from the measured warm release.</p>
    </div>
  </div>
