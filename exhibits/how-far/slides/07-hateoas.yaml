name: hateoas
part: Why it matters
title: "HATEOAS: Fielding’s explanation, not his invention"
kicker: Why the Web scaled
say: "Hypermedia as the engine of application state is the name the 2000 dissertation gave to what the Web already did. It explains why one generic program, the browser, could use every site. At the application layer, it is arguably the most depended-upon and consequential network constraint of all time, for the human web."
sources:
  - ["Fielding, dissertation, ch. 5: REST", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
html: |
  <h2>HATEOAS: Fielding’s explanation, not his invention</h2>
  <div class="split" style="grid-template-columns: 1fr 1fr; align-items: stretch">
    <div class="panel" style="padding: 1.4rem 1.6rem">
      <h3 style="font: 650 1.6rem/1.15 var(--display); color: var(--leaf); margin: 0; text-transform: none; letter-spacing: 0">A description, not a proposal</h3>
      <ul>
        <li>Hypermedia as the engine of application state: the name his dissertation (2000) gave to why the Web scaled so fast.</li>
        <li>Every page carries its own next steps, its links and forms.</li>
        <li>So a browser needs no prior knowledge of any site, and never ships an update when a site changes.</li>
      </ul>
      <p class="refs"><deck-ref name="uniform-interface"></deck-ref></p>
    </div>
    <div class="box" style="padding: 1.6rem 1.8rem; gap: 1.4rem">
      <p style="font: 650 1.75rem/1.3 var(--display); color: #fff">At the application layer, perhaps the most depended-upon and consequential network constraint of all time</p>
      <p style="font: 650 1.75rem/1.3 var(--display); color: #e3b341">for the human web.</p>
      <p style="font-size: 1.1rem; opacity: 0.85">Every link followed and every form sent, by billions of people, every day.</p>
    </div>
  </div>
