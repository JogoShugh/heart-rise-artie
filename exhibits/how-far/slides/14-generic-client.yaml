name: generic-client
part: Putting them back together
title: ARTIE is to APIs what a browser is to web pages
kicker: Putting them back together · The generic client
say: "The browser is coupled to HTML and HTTP, and to nothing about any site: not account numbers, not URL layouts, not which buttons exist today. That's why a bank can change its forms tonight and nobody updates their browser. ARTIE is coupled the same way, to one media type, HAL with HEART's schema forms, and HTTP. Zero domain code: no client certificates, no pull requests, no merge rules. Each answer carries its controls. The next slides preview what that looks like on an API you know, AWS API Gateway."
sources:
  - ["Fielding, dissertation, ch. 5", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
  - ["HAL Schema Forms", "https://github.com/jbadeau/hal-schema-forms"]
  - ["artie (repository)", "https://github.com/JogoShugh/heart-rise-artie"]
html: |
  <h2>ARTIE is to APIs what a browser is to web pages</h2>
  <table>
    <thead><tr><th>The client</th><th>Speaks, and is coupled to</th><th>Works with</th></tr></thead>
    <tbody>
      <tr>
        <td><b>Web browser</b><br>one generic client, for every site</td>
        <td><code>text/html</code> + HTTP<br><small><code>image/jpeg</code> <code>image/png</code> <code>text/css</code> <code>text/javascript</code> <code>image/svg+xml</code> <code>font/woff2</code></small></td>
        <td>An online bank · A wiki · A shop · <i>Any site not yet built</i></td>
      </tr>
      <tr>
        <td><b>ARTIE</b><br>one generic client, for every API</td>
        <td><code>application/hal+json</code> + HEART profile + HTTP<br><small><code>application/schema+json</code> <code>application/problem+json</code> <code>application/yaml</code></small></td>
        <td>AWS API Gateway (preview next) · GitHub · GitLab · <i>Any API not yet built</i></td>
      </tr>
    </tbody>
  </table>
  <p class="lead"><b>Coupled to:</b> the media type and the protocol. <b>Not coupled to:</b> certificates, pull requests, merge rules, URL layouts, or which acts exist today. Zero domain code.</p>
  <p class="refs"><deck-ref name="think-of-the-web"></deck-ref> <deck-ref name="uniform-interface"></deck-ref></p>
