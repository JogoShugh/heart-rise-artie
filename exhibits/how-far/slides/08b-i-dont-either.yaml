name: i-dont-either
part: Why it matters
title: "I don’t either. Forms arrived, and the page took the controls in"
kicker: What actually happened
code:
  file: morph.js
  title: Animates the slide's stills, as its HTML says
say: "I don't either. Because it never happened. Mosaic added fill-out forms in 1993, and HTML 2.0, RFC 1866, made them standard in 1995. Within a couple of years every page that let you do something carried its own form: the fields, the method, the address, all in the page. Watch the two WebWalker windows, the list and the manual, become one Netscape page. Each loan carries its own acts, and the reason for the one it can't do. No method menu, no body box, no sticky note. That's what the browser's whole design rests on, and it has a name."
sources:
  - ["HTML 2.0, RFC 1866 (1995): forms", "https://datatracker.ietf.org/doc/html/rfc1866#section-8"]
  - ["Overheard at Riverside: the marriage", "https://jogoshugh.github.io/heart-rise-artie/reports/overheard-at-riverside/#marriage"]
html: |
  <h2>I don’t either. Forms arrived, and the page took the controls in</h2>
  <p class="lead">Because it never happened. Mosaic added fill-out forms in 1993; HTML 2.0 (RFC 1866) made them standard in 1995. Within a couple of years every page that let you do something carried its own form.</p>
  <div class="morph" data-start="apart" data-cycles='[{"to": "married", "label": "The marriage", "head": "I don’t either. Forms arrived, and the page took the controls in"}]'>
    <div class="mo-stage">
      <section class="mo-scene" data-scene="apart">
        <h3 class="mo-title">The web that wasn't: two windows, joined by hand</h3>
        <div class="desk97">
          <div class="ww-pair">
            <div class="win">
              <div class="tk tk-wtitle" data-token="titlebar">WebWalker 1.0 — the browser of the web that wasn't</div>
              <div class="win-bar"><span>Method:</span><span class="win-box">GET ▾</span><span>Location:</span><span class="tk tk-wbox tk-wloc" data-token="location">/cgi-bin/library.cgi/loans?card=21000451&amp;pin=1234</span></div>
              <div class="win-bar"><span>Body:</span><span class="win-box win-body">name=value&amp;name=value</span></div>
              <div class="win-page">
                <h4>Your loans</h4>
                <div class="row97 row97-head"><span>Loan</span><span>Title</span><span>Due</span></div>
                <div class="tk tk-row97" data-token="row-3310"><span>3310</span><span>The Hobbit</span><span>1997-11-12</span></div>
                <div class="tk tk-row97" data-token="row-3311"><span>3311</span><span>Matilda</span><span>1997-11-12</span></div>
                <div class="tk tk-row97" data-token="row-3312"><span>3312</span><span>Charlotte's Web</span><span>1997-11-12</span></div>
              </div>
              <div class="win-status">Document: Done. 200 OK</div>
            </div>
            <p class="ww-gap"><span>You join them, with a sticky note and your own typing</span></p>
            <div class="win">
              <div class="tk-wtitle tk-wtitle-off">WebWalker 1.0 — the browser of the web that wasn't</div>
              <div class="win-bar"><span>Method:</span><span class="win-box">POST ▾</span><span>Location:</span><span class="win-box tk-wloc">/cgi-bin/library.cgi/loans/{loanId}/renew</span></div>
              <div class="win-bar"><span>Body:</span><span class="win-box win-body">card=21000451&amp;pin=1234</span></div>
              <div class="win-page">
                <div class="tk tk-ww-h" data-token="renew">3. RENEW A LOAN</div>
                <div class="tk tk-ww-rule" data-token="rule">Only while it is renewed fewer than three times and no one's hold is waiting.</div>
                <div class="ww-def"><b>Method</b> POST<br><b>Address</b> /cgi-bin/library.cgi/loans/{loanId}/renew<br><b>Body</b> card={card}&amp;pin={pin}</div>
                <div class="tk tk-ww-h" data-token="return">4. RETURN A LOAN</div>
                <div class="ww-def"><b>Method</b> POST<br><b>Address</b> /cgi-bin/library.cgi/loans/{loanId}/return</div>
              </div>
              <div class="win-status">Document: Done. 200 OK</div>
            </div>
          </div>
        </div>
        <p class="mo-cap">The web that wasn't, in WebWalker: your loans on one page, every act on another, the same for every loan. The browser carries a method menu and a body box, because pages can't. You join the two, by hand.</p>
      </section>
      <section class="mo-scene" data-scene="married">
        <h3 class="mo-title">What actually happened: one page, its information and its controls together</h3>
        <div class="desk97">
          <div class="win ns-win">
            <div class="tk tk-wtitle" data-token="titlebar">Netscape - [Riverside Public Library -- Your loans]</div>
            <div class="ns-menu">File&nbsp; Edit&nbsp; View&nbsp; Go&nbsp; Bookmarks&nbsp; Options&nbsp; Directory&nbsp; Window&nbsp; Help</div>
            <div class="ns-tools"><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10 9 3v4h9v6H9v4z" fill="#24418f"/></svg><span>Back</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M18 10 11 3v4H2v6h9v4z" fill="#24418f"/></svg><span>Forward</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 1 10h3v8h5v-5h2v5h5v-8h3z" fill="#24418f"/></svg><span>Home</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.5A7 7 0 1 0 17 11" fill="none" stroke="#24418f" stroke-width="2.4"/><path d="M12 2h6v6z" fill="#24418f"/></svg><span>Reload</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="3.5" width="17" height="13" fill="#fff" stroke="#3b3b3b"/><circle cx="6" cy="7.5" r="1.8" fill="#d8a000"/><path d="M3 15l5-5 3 3 2-2 4 4z" fill="#2f7d32"/></svg><span>Images</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 5.5h6l1.5 2h9.5v9h-17z" fill="#e6c25a" stroke="#3b3b3b"/></svg><span>Open</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2.5" width="10" height="5" fill="#fff" stroke="#3b3b3b"/><rect x="1.5" y="7.5" width="17" height="7" fill="#9a9a9a" stroke="#3b3b3b"/><rect x="5" y="12" width="10" height="5.5" fill="#fff" stroke="#3b3b3b"/></svg><span>Print</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5.5" cy="12" r="3.8" fill="#bcd" stroke="#3b3b3b" stroke-width="1.6"/><circle cx="14.5" cy="12" r="3.8" fill="#bcd" stroke="#3b3b3b" stroke-width="1.6"/><rect x="8" y="9" width="4" height="3" fill="#3b3b3b"/><rect x="3" y="4" width="4" height="5" fill="#3b3b3b"/><rect x="13" y="4" width="4" height="5" fill="#3b3b3b"/></svg><span>Find</span></span><span class="ns-tool"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 1.5h7l5 5v7l-5 5h-7l-5-5v-7z" fill="#c8102e" stroke="#7a0a1c"/><rect x="5" y="8.7" width="10" height="2.6" fill="#fff"/></svg><span>Stop</span></span><span class="ns-logo" aria-hidden="true">N</span></div>
            <div class="win-bar"><span>Location:</span><span class="tk tk-wbox tk-wloc" data-token="location">http://www.riverside.lib/cgi-bin/library.cgi/loans</span></div>
            <div class="ns-dir"><span class="ns-btn">What's New?</span><span class="ns-btn">What's Cool?</span><span class="ns-btn">Destinations</span><span class="ns-btn">Net Search</span><span class="ns-btn">People</span><span class="ns-btn">Software</span></div>
            <div class="win-page ns-page">
              <h4>Your loans</h4>
              <div class="ns-row ns-row-head"><div class="row97 row97-head"><span>Loan</span><span>Title</span><span>Due</span></div><span></span></div>
              <div class="ns-row">
                <div class="tk tk-row97" data-token="row-3310"><span>3310</span><span>The Hobbit</span><span>1997-11-12</span></div>
                <div class="ns-acts"><span class="tk tk-ns-why" data-token="rule">A hold is waiting for this book, so it can't be renewed.</span><span class="tk-nsbtn">Return</span></div>
              </div>
              <div class="ns-row">
                <div class="tk tk-row97" data-token="row-3311"><span>3311</span><span>Matilda</span><span>1997-11-12</span></div>
                <div class="ns-acts"><span class="tk tk-nsbtn" data-token="renew">Renew</span><span class="tk tk-nsbtn" data-token="return">Return</span></div>
              </div>
              <div class="ns-row">
                <div class="tk tk-row97" data-token="row-3312"><span>3312</span><span>Charlotte's Web</span><span>1997-11-12</span></div>
                <div class="ns-acts"><span class="tk-ns-why">It has been renewed 3 times, the most allowed.</span><span class="tk-nsbtn">Return</span></div>
              </div>
            </div>
            <div class="win-status">Document: Done</div>
          </div>
        </div>
        <p class="mo-cap">What actually happened, right from the beginning: Netscape Navigator, and a page with forms, written by the same CGI. Each loan carries its own acts, and the reason for the one it can't do. Nothing to copy, nothing to type, and no PIN in the address.</p>
      </section>
    </div>
  </div>
  <p class="refs"><deck-ref name="hypertext"></deck-ref> <deck-ref name="think-of-the-web"></deck-ref></p>
