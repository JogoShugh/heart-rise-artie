name: look-think-act
part: Why it matters
title: Look, Think, Act = Sync, Reason, Act
kicker: One loop, two readers
say: "A person in a browser and ARTIE run the same loop. Sync and Act are plain code. Reason is the only place a model sits, and a kept script can stand in for it on every later run. Think is the only step that costs tokens: Hightower's budget, spent once. Look and Act are Fielding's controls, read for free."
sources:
  - ["Fielding, 2008 post and its comments", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
html: |
  <h2>Look, Think, Act = Sync, Reason, Act</h2>
  <table>
    <thead><tr><th>A person</th><th>ARTIE</th><th></th></tr></thead>
    <tbody>
      <tr><td><b>Look</b></td><td><b>Sync</b></td><td>Read the representation: the state and the controls offered now.</td></tr>
      <tr><td><b>Think</b></td><td><b>Reason</b></td><td>Choose among what’s offered. The only place a model sits, and a kept script can stand in for it.</td></tr>
      <tr><td><b>Act</b></td><td><b>Act</b></td><td>Send the form: method, target, fields, If-Match, signed.</td></tr>
    </tbody>
  </table>
  <p class="punch">Think is the only step that costs tokens. Look and Act read and send controls the server handed over: free on every replay.</p>
  <blockquote class="big">“Typed relations, specific media types, and action-specific elements provide the guidance needed for automated agents.”</blockquote>
  <p class="cite"><a href="https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven" target="_blank" rel="noopener"><b>Roy T. Fielding</b></a>, comment, 2008 · <deck-ref name="think-of-the-web"></deck-ref></p>
