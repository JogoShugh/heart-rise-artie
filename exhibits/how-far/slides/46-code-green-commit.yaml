html: |
  <h2>The fix, the green run, the gated commit</h2>
  <div class="split" style="grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);">
    <div class="rows">
      <pre><code>// Detours.kt: keep a read another step names
  private fun named(capture: Capture): Set&lt;Int&gt; {
    val marks = capture.steps.associateWith {
      capture.marks(it) }
    return marks.filter { (step, own) -&gt;
      val name = own["as"]?.toString()
        ?: return@filter false
      val mention = Regex("""\{$name[.}]""")
      marks.any { (other, its) -&gt; other.line !=
        step.line &amp;&amp; its.values.any {
          mention.containsMatchIn("$it") } }
    }.keys.map { it.number }.toSet()</code></pre>
      <p class="refs"><deck-fragment name="detours">Detours.kt</deck-fragment></p>
      <pre><code>pre-commit: TDD ordering check passed.
  # then the capture again, and the open-PR step stays</code></pre>
    </div>
    <div class="rows">
      <figure><img src="media/testreport-crop.png" alt="The artie-cli test report: 198 tests, 0 failures"><figcaption>artie-cli test report: 198 tests, 0 failures.</figcaption></figure>
      <p class="punch">Then the replay, on real GitHub and local GitLab, with the regenerated script.</p>
    </div>
  </div>
