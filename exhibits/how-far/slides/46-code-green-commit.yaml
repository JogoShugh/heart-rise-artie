title: The fix, the green run, the gated commit
kicker: How it was built · Code, green, commit
say: "The fix in Detours.kt: keep a step whose `as` name another step mentions. Then green, then the commit, which the git pre-commit hook checks for ordering. The report beside it is the module's real test report."
