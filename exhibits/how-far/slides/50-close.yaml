name: close
part: Close
tone: dark
title: The Web gave us the model. Hypertext and hooks let us stop paying it for the same path twice.
kicker: Close
say: "Building is gated by hooks. Running is driven by hypertext and replayed from kept scripts. Both move work from tokens to processes."
html: |
  <h2>The Web gave us the model. Hypertext and hooks let us stop paying it for the same path twice.</h2>
  <div class="split" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div class="step"><h3>Running</h3><p>Driven by hypertext: only what’s offered now. Found once with a model, replayed with none.</p></div>
    <div class="step"><h3>Building</h3><p>Gated by hooks: Gherkin, red, code, green, commit. No model call to enforce.</p></div>
    <div class="step"><h3>Both</h3><p>Move work from tokens to processes, where it costs nothing to repeat.</p></div>
  </div>
  <p class="punch">Zero tokens to replay. Zero domain code to read. One media type.</p>
