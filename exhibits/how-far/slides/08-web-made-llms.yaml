name: web-made-llms
part: Why it matters
title: The Web made LLMs possible, and only half of it
kicker: Why this team cares
say: "Brief. The same architecture made a crawlable corpus. Filtered Common Crawl was the largest share of GPT-3's training mix. But crawlers only read: they follow links, they never submit forms. The transactional half of the Web was never in the corpus."
sources:
  - ["Brown et al., Language Models are Few-Shot Learners (GPT-3), Table 2.2", "https://arxiv.org/abs/2005.14165"]
  - ["Common Crawl", "https://commoncrawl.org/"]
html: |
  <h2>The Web made LLMs possible, and only half of it</h2>
  <div class="flow" style="grid-template-columns: 1fr auto 1fr auto 1fr">
    <div class="panel" style="padding: 1.4rem 1.5rem; gap: 0.8rem"><h3 style="font: 650 1.6rem/1.15 var(--display); color: var(--leaf); margin: 0; text-transform: none; letter-spacing: 0">Links everywhere</h3><p style="font-size: 1.1rem">The Web’s architecture made every page reachable from another. A crawler needs no map.</p></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="panel" style="padding: 1.4rem 1.5rem; gap: 0.8rem"><h3 style="font: 650 1.6rem/1.15 var(--display); color: var(--leaf); margin: 0; text-transform: none; letter-spacing: 0">A corpus</h3><p style="font-size: 1.1rem">Filtered Common Crawl was the largest share of GPT-3’s training mix.</p></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="box" style="padding: 1.4rem 1.5rem; gap: 0.8rem; align-content: start"><h3>The missing half</h3><p style="font-size: 1.1rem">Crawlers read. They never send a form, so the Web’s transactions were never learned from.</p></div>
  </div>
  <p class="punch">The transactional half of the Web is where agents now have to work.</p>
