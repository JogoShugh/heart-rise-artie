name: information-and-controls
part: Why it matters
tone: dark
title: Information and controls, presented together
kicker: Fielding, in the comments on his 2008 post
say: "This is the marriage. On the human web, the page and its forms arrive together; the information itself is how you find out what you can do. And this is what lets Hightower's infer-once replay survive change: the controls come with every answer, so the replay can check them for free."
sources:
  - ["Fielding, 2008 post and its comments", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
html: |
  <h2>Information and controls, presented together</h2>
  <blockquote class="big">“When I say hypertext, I mean the simultaneous presentation of information and controls such that the information becomes the affordance through which the user (or automaton) obtains choices and selects actions.”</blockquote>
  <p class="cite"><a href="https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven" target="_blank" rel="noopener"><b>Roy T. Fielding</b></a>, comment, 20 October 2008</p>
  <p class="lead"><b>information</b> + <b>controls</b> = <b>affordance</b></p>
  <p>On the human web they were married: the page and its forms arrive together. This is what lets an infer-once replay survive change.</p>
  <p class="refs"><deck-ref name="hypertext"></deck-ref></p>
