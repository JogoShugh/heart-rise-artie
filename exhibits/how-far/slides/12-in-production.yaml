name: in-production
part: Putting them back together
title: Hypermedia is already in production
kicker: Not new, not niche
say: "Okta's Authentication API answers with HAL: _embedded for the user and policy, _links for what can be done next, here changePassword or cancel, because the password expired. Amazon API Gateway documents HAL with typed relations today; it gets previewed as HEART a few slides on. Spring HATEOAS is being pitched for agents now: Adib Saikali, Spring I/O 2026. What HEART adds: forms with JSON Schema, guards, and typed relations."
sources:
  - ["Okta Authentication API", "https://developer.okta.com/docs/api/resources/authn"]
  - ["AWS: GetClientCertificates", "https://docs.aws.amazon.com/apigateway/latest/api/API_GetClientCertificates.html"]
  - ["Spring I/O 2026: REST is for Agents", "https://2026.springio.net/sessions/rest-is-for-agents-rediscovering-spring-hateoas/"]
html: |
  <h2>Hypermedia is already in production</h2>
  <div class="split" style="grid-template-columns: 1fr 1fr 1fr">
    <figure><img src="media/okta-crop.png" alt="Okta Authentication API response for an expired password, with _links for changePassword and cancel"><figcaption>Okta Authentication API: expired password.</figcaption></figure>
    <div class="rows">
      <div><h3>Okta</h3><p>The password expired, so the answer’s _links offer next: changePassword, and cancel. Nothing else. State, then controls, in one answer.</p></div>
      <div><h3>Amazon API Gateway</h3><p>HAL with typed relations, in its current API reference. We’ll preview it as HEART shortly.</p></div>
    </div>
    <div class="card dark">
      <h3>Spring HATEOAS, for agents</h3>
      <p>Adib Saikali (Broadcom), “REST is for Agents: Rediscovering Spring HATEOAS”, Spring I/O 2026.</p>
      <p>What HEART adds: forms with JSON Schema, If-Match guards, typed relations, and only the forms that apply now.</p>
    </div>
  </div>
