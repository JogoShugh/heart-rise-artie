name: interchangeable
part: Two forges, one vocabulary
title: Can we make them interchangeable?
kicker: The question
say: "The callback. AWS already names its acts as typed relations: clientcertificate:update. The preview turned them into forms. Can we do the same for two forges that never agreed: one name per act, the same on both, so one client and one script work on either? The answer the next slides show: yes, with the scm: prefix, one YAML connector per forge, and HEART on top."
sources:
  - ["GitHub REST: pulls", "https://docs.github.com/en/rest/pulls/pulls"]
  - ["GitLab REST: merge requests", "https://docs.gitlab.com/api/merge_requests/"]
  - ["GitLab REST: notes", "https://docs.gitlab.com/api/notes/"]
html: |
  <h2>Can we make them interchangeable?</h2>
  <div class="table-scroll"><table>
    <thead><tr><th>The act</th><th>GitHub says</th><th>GitLab says</th><th>One typed relation?</th></tr></thead>
    <tbody>
      <tr><td>Read one</td><td><code>GET /repos/{o}/{r}/pulls/{n}</code></td><td><code>GET /projects/{id}/merge_requests/{iid}</code></td><td><code><b>scm:pulls-get</b></code></td></tr>
      <tr><td>Merge, squashed</td><td><code>PUT …/merge {merge_method: squash}</code></td><td><code>PUT …/merge {squash: true}</code></td><td><code><b>scm:merge</b></code></td></tr>
      <tr><td>Comment</td><td><code>POST /issues/{n}/comments</code></td><td><code>POST …/merge_requests/{iid}/notes</code></td><td><code><b>scm:comment</b></code></td></tr>
      <tr><td>Can it merge?</td><td><code>mergeable_state: clean</code></td><td><code>detailed_merge_status: mergeable</code></td><td><code><b>mergeable_state</b></code></td></tr>
    </tbody>
  </table></div>
  <div class="card dark"><p><b>Callback:</b> AWS already names its acts, <code>clientcertificate:update</code>, and our preview turned them into forms. Here, one name per act, the same on both forges: <code><b>scm:</b></code> typed relations. One client, one script, either forge.</p></div>
