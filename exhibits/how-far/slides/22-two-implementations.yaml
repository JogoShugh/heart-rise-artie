name: two-implementations
part: Two forges, one vocabulary
title: Two implementations of mostly the same thing
kicker: Two forges
say: "Each forge's own page, as a visitor sees it, for the same release: a change proposed, merged by squashing, then commented on. The same job, done by both. Different names for nearly everything: pull request or merge request, # or !, the base or the target branch, a comment or a note."
sources:
  - ["Pull request #2337", "https://github.com/JogoShugh/heart-github-test/pull/2337"]
  - ["GitHub REST: pulls", "https://docs.github.com/en/rest/pulls/pulls"]
  - ["GitLab REST: merge requests", "https://docs.gitlab.com/api/merge_requests/"]
html: |
  <h2>Two implementations of mostly the same thing</h2>
  <div class="split" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)">
    <figure><img src="media/ngh504.png" alt="GitHub's page for pull request #2337, merged"><figcaption>GitHub: pull request #2337, merged.</figcaption></figure>
    <figure><img src="media/ngl504.png" alt="GitLab's page for merge request !504, merged"><figcaption>GitLab: merge request !504, merged.</figcaption></figure>
  </div>
  <p class="lead">Same job: a change is proposed, merged by squashing, then commented on. Different words, numbers, fields and calls for nearly all of it.</p>
