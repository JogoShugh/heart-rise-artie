spike: 'Phase 0 of spec/PLAN-LOCAL-MODEL.md, 2026-10-30: three local models asked the reasoner and planner prompts, in their exact shape, through Ollama 0.40.13 at http://localhost:11434/v1/messages on an Apple M3 Max with 36 GB.'
turns:
  repo: 'the reasoner, first step of runs/first.yaml: intent "get repository JogoShugh/heart-github-test" at the bookmark'
  merge: 'the reasoner at pull request 1781: intent "merge it by squashing"'
  comment: the reasoner at the draft 1782, the reasoned line with the gateway reason
  plan: the planner at the merge step, built by hand in the planner turn shape from the goal file and the pull request held at that step; max_tokens 1024
  plan-4k: the same with max_tokens 4096
  plan-nothink: the same with thinking disabled, as the Messages API says it
  plan-budget: the same with a thinking budget of 300 tokens
