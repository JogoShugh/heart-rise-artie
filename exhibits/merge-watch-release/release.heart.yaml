heart: 1
kind: kept
start: ${scm}

inputs:
  scm:
    default: http://192.168.1.18:8098/
  pull:
    question: Which pull request?
    type: integer
  owner:
    default: acme
  repo:
    default: web
  watcher:
    default: http://192.168.1.18:8099/
  jenkins:
    default: http://192.168.1.18:8170/
  dev:
    default: http://192.168.1.18:8190/
  environment:
    default: "1"
    type: integer
  book:
    default: The Hobbit
  author:
    default: J. R. R. Tolkien
  renewable:
    default: Matilda
  problem:
    default: missing-pages
  comment:
    default: Pages 12 to 14.

steps:
  - act: scm:pulls-get
    fields:
      owner: ${owner}
      repo: ${repo}
      pull_number: ${pull}
    intent: Open pull request ${pull} of ${owner}/${repo}
    then:
      - keep-as: pr
  - enter: ${watcher}
    steps:
      - ask: watcher:watch
        fields:
          resource: ${pr.@self}
          offers: scm:merge
        reply: watch
  - once-answered:
      reply: watch
      steps:
        - enter: ${pr.@self}
          steps:
            - act: scm:merge
              fields:
                method: squash
              intent: merge it by squashing
              then:
                - check:
                    - field: mergeable_state
                      is: unknown
                    - field: merged
                      is: true
                    - field: state
                      is: closed
                - keep-as: merged
  - enter: ${jenkins}
    steps:
      - ask: ci:build
        fields:
          commit: ${merged.merge_commit_sha}
        reply: build
  - once-answered:
      reply: build
      steps:
        - follow: hr:in-reply-to
          intent: follow its in-reply-to link to the build
          then:
            - run-script: ci:smoke-test
              on-link: ci:deployment
              inputs:
                book: ${book}
                author: ${author}
                renewable: ${renewable}
                problem: ${problem}
                comment: ${comment}
              as: smoke
  - given:
      - at: smoke
        field: passed
        is: true
    then:
      - enter: ${dev}
        steps:
          - act: env:get-environment
            fields:
              id: ${environment}
            inferred: get environment ${environment}
            from-intent: open environment ${environment} and promote commit {merged.merge_commit_sha}, citing {smoke.passing} of {smoke.of} scenarios passed
            then:
              - act: env:promote
                fields:
                  commit: ${merged.merge_commit_sha}
                  smoke:
                    passed: ${smoke.passing}
                    of: ${smoke.of}
                intent: open environment ${environment} and promote commit {merged.merge_commit_sha}, citing {smoke.passing} of {smoke.of} scenarios passed
                then:
                  - check:
                      - field: commit
                        is: ${merged.merge_commit_sha}
    otherwise:
      - at: ${pr.@self}
        steps:
          - act: scm:comment
            fields:
              body: "Not promoted to Dev: smoke scenarios ${smoke.failed} failed."
