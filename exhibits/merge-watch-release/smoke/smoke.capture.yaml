---
run:
  inputs:
    deployed:
      value: http://localhost:8185/
      given: given
      question: Which deployment of the library?
    book:
      value: The Hobbit
      given: default
      default: The Hobbit
    author:
      value: J. R. R. Tolkien
      given: default
      default: J. R. R. Tolkien
    renewable:
      value: Matilda
      given: default
      default: Matilda
    problem:
      value: missing-pages
      given: default
      default: missing-pages
    comment:
      value: Pages 12 to 14.
      given: default
      default: Pages 12 to 14.
  source: |-
    act(intent = """search the loans for "$book"""")
    act(intent = """open the item "The Hobbit"""")
    act(intent = """search the loans for "$book"""")
    act(intent = """open the item "The Hobbit"""")
    check(author is {author})
    act(intent = """search the loans for "$renewable"""")
    act(intent = """open the item "Matilda"""")
    act(intent = "renew the loan")
    check(due is not {before.due})
    act(intent = """search the loans for "$renewable"""")
    act(intent = """open the item "Matilda"""")
    act(intent = "renew the loan")
    act(intent = "renew the loan")
    act(intent = """search the loans for "$book"""")
    act(intent = """open the item "The Hobbit"""")
    act(intent = "report problem $problem on it, saying: $comment")
    check(reported.problem is {problem})
  marks:
    '1':
      scenario: S1
      fromIntent: Search the loans for "${book}", and open ${book}
    '2':
      scenario: S1
      as: found
      intent: Search the loans for "${book}", and open ${book}
    '3':
      scenario: S2
      fromIntent: Search the loans for "${book}", and open ${book}
    '4':
      scenario: S2
      as: loan
      intent: Search the loans for "${book}", and open ${book}
    '5':
      facts:
        - field: author
          is: ${author}
    '6':
      scenario: S3
      fromIntent: Search the loans for "${renewable}", and open ${renewable}
    '7':
      scenario: S3
      as: before
      intent: Search the loans for "${renewable}", and open ${renewable}
    '8':
      scenario: S3
      intent: Renew it
    '9':
      facts:
        - field: due
          is-not: ${before.due}
    '10':
      scenario: S4
      fromIntent: Search the loans for "${renewable}", and open ${renewable}
    '11':
      scenario: S4
      as: read
      intent: Search the loans for "${renewable}", and open ${renewable}
    '12':
      scenario: S4
      intent: Renew it
    '13':
      as-of: read
      refused-as: stale
      scenario: S4
    '14':
      scenario: S5
      fromIntent: Search the loans for "${book}", and open ${book}
    '15':
      scenario: S5
      as: reported
      intent: Search the loans for "${book}", and open ${book}
    '16':
      scenario: S5
      intent: Report ${problem} on it, saying "${comment}"
    '17':
      facts:
        - field: /reported/problem
          is: ${problem}
