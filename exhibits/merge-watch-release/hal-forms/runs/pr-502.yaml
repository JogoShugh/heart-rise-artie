                            is: ${author}
          - scenario: S3
            steps:
              - act: library:search-loans
                fields:
                  name: ${renewable}
                inferred: search the loans for "${renewable}"
                from-intent: Search the loans for "${renewable}", and open ${renewable}
                then:
                  - follow: item
                    title: ${renewable}
                    intent: Search the loans for "${renewable}", and open ${renewable}
                    then:
                      - keep-as: before
                      - act: library:renew
                        intent: Renew it
                        then: []
                      - check:
                          - field: due
                            is-not: ${before.due}
          - scenario: S4
            steps:
              - act: library:search-loans
                fields:
                  name: ${renewable}
                inferred: search the loans for "${renewable}"
                from-intent: Search the loans for "${renewable}", and open ${renewable}
                then:
                  - follow: item
                    title: ${renewable}
                    intent: Search the loans for "${renewable}", and open ${renewable}
                    then:
                      - keep-as: read
                      - act: library:renew
                        intent: Renew it
