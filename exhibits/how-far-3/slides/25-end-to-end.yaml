name: end-to-end
part: "The release, in the order it runs"
title: "One Script, End to End"
kicker: The whole release, on one slide
say: "Here's the release we just walked, on one slide. The desk. The pull request. The watcher. The merge. The build. The smoke scenarios. Then Dev, or a comment saying why. Seven steps, across five services, driven by one script written as data, and one generic client. And every step was a control the last answer offered. Which raises the question: how does one client talk to five different services?"
sources:
  - ["The kept release script (release.heart.yaml)", "https://github.com/JogoShugh/heart-rise-artie/blob/claude/auth-branch-4bnmhc/exhibits/merge-watch-release/release.heart.yaml"]
  - ["Report: Merge Watch release", "https://jogoshugh.github.io/heart-rise-artie/reports/merge-watch-release/"]
html: |
  <h2>One Script, End to End</h2>
  <div class="table-scroll"><table>
    <thead><tr><th></th><th>Service</th><th>Relation</th><th>What happens</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Release desk</td><td><code>desk:release</code></td><td>A person asks; the desk starts ARTIE on the kept script</td></tr>
      <tr><td>2</td><td>Gateway</td><td><code>scm:pulls-get</code></td><td>Open the pull request</td></tr>
      <tr><td>3</td><td>Offer watch</td><td><code>watcher:watch</code></td><td>Tell me when it offers <code>scm:merge</code>; wait for the reply</td></tr>
      <tr><td>4</td><td>Gateway</td><td><code>scm:merge</code></td><td>Merge by squashing; check it’s merged</td></tr>
      <tr><td>5</td><td>CI · Jenkins</td><td><code>ci:build</code></td><td>Build the merge commit; wait for the reply</td></tr>
      <tr><td>6</td><td>CI · Jenkins</td><td><code>ci:smoke-test</code></td><td>Run the build’s own smoke scenarios against its deployment</td></tr>
      <tr><td>7</td><td>Dev, or the gateway</td><td><code>env:promote</code> or <code>scm:comment</code></td><td>All passed: promote. One failed: say why on the pull request</td></tr>
    </tbody>
  </table></div>
  <p class="punch">Five services, one script written as data, one generic client.</p>
  <p class="refs"><deck-ref name="right-behavior"></deck-ref> <deck-ref name="repeatability"></deck-ref> <deck-ref name="resilience"></deck-ref> <deck-ref name="rise"></deck-ref></p>
