name: three-rs-one-behavior
part: "The shape of the thing"
title: "The Three R’s, One Behavior at a Time"
kicker: The shape of the thing · walked from the inside out
say: "Here's the shape of the thing, and the rest of the talk walks it from the inside out. Three rings. In the middle, one behavior: a Gherkin scenario, a red run, the code, a green run, a commit. Around it, the generic components built that way: ARTIE, the gateway, heart-mcp, and Buster. Around those, the system: a real release across GitHub or GitLab, Jenkins and a Dev environment. I want the same three things to hold at every ring. Right behavior first: only what's allowed, and the right thing when it is. Then repeatability: that right behavior, the same way, every time. Then resilience: when something breaks or changes, the right failure path, and on we go. At the smallest scale, a Gherkin scenario says what right means, in words a person can read. It runs the same way on every change, forever. And when the next change breaks it, the suite goes red and the gate refuses the commit, even when the model wrote the change. Do that a thousand times and you get components with the same three properties. Put those together and you get a system with them too. Let's start in the middle."
sources:
  - ["bdd-gates skill", "https://github.com/JogoShugh/bdd-gates-skill"]
  - ["Buster (repository)", "https://github.com/JogoShugh/buster"]
html: |
  <h2>The Three R’s, One Behavior at a Time</h2>
  <div class="split" style="grid-template-columns: minmax(0, 4fr) minmax(0, 8fr);">
    <figure>
      <svg viewBox="0 0 400 400" role="img" aria-label="Three nested circles. Innermost: one behavior, Gherkin, red, code, green, commit. Middle: generic components, ARTIE, the gateway, heart-mcp, Buster. Outer: the system, a real merge on two forges, Jenkins and Dev. The same three R's hold at every ring.">
        <circle cx="200" cy="200" r="190" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="200" cy="230" r="140" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="200" cy="250" r="58" fill="#2f9e5b" fill-opacity="0.25" stroke="#2f9e5b" stroke-width="2.5"/>
        <text x="200" y="46" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">The system</text>
        <text x="200" y="66" text-anchor="middle" fill="currentColor" font-size="12">a real merge, two forges, Jenkins, Dev</text>
        <text x="200" y="134" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">Generic components</text>
        <text x="200" y="153" text-anchor="middle" fill="currentColor" font-size="12">ARTIE · gateway</text>
        <text x="200" y="169" text-anchor="middle" fill="currentColor" font-size="12">heart-mcp · Buster</text>
        <text x="200" y="244" text-anchor="middle" fill="currentColor" font-size="15" font-weight="700">One behavior</text>
        <text x="200" y="264" text-anchor="middle" fill="currentColor" font-size="11">Gherkin · red · code</text>
        <text x="200" y="279" text-anchor="middle" fill="currentColor" font-size="11">green · commit</text>
      </svg>
      <figcaption>The same three R’s at every ring.</figcaption>
    </figure>
    <div class="table-scroll"><table>
      <thead><tr><th></th><th>One behavior</th><th>Components and the system</th></tr></thead>
      <tbody>
        <tr><td><deck-ref name="right-behavior"></deck-ref></td><td>Gherkin says what right means before the code exists</td><td>Only the acts the state allows; a reason when not</td></tr>
        <tr><td><deck-ref name="repeatability"></deck-ref></td><td>The scenario runs the same way on every change</td><td>A kept script replays the same way, with no model</td></tr>
        <tr><td><deck-ref name="resilience"></deck-ref></td><td>A break goes red, and the gate refuses the commit, even the model’s</td><td>Buster tampers on purpose; ARTIE takes the right failure path</td></tr>
      </tbody>
    </table></div>
  </div>
  <p class="punch">One test at a time, for components and systems that are themselves right, repeatable and resilient.</p>
