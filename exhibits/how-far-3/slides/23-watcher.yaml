name: watcher
part: "The system: everything speaks HEART"
title: "The Watcher: Tell Me When It Offers Merge"
kicker: RISE · ask now, be told later
say: "Here's a question every release script asks: is this pull request ready to merge yet? The usual answer is a polling loop, written for one service, checking one field. We asked a different question: tell me when this resource offers the merge act. The offer watcher is a small RISE service, and it speaks HEART like everything else. ARTIE asks it, watcher:watch, with the pull request's own address and the relation scm:merge, and a reply form of its own to be answered on. Then ARTIE stops waiting. The watcher looks at the pull request every three seconds, as plain HEART: does its answer offer scm:merge now? The moment it does, the watcher answers ARTIE's reply, completed, signed with its own key, and the release wakes up and merges. If it never comes, the reply says so: failed, not offered in time. Notice that the watcher doesn't know what a pull request is. It knows what an offer is. That's the media type doing the work."
sources:
  - ["The kept release script (release.heart.yaml)", "https://github.com/JogoShugh/heart-rise-artie/blob/claude/auth-branch-4bnmhc/exhibits/merge-watch-release/release.heart.yaml"]
html: |
  <h2>The Watcher: Tell Me When It Offers Merge</h2>
  <div class="split">
    <div class="rows">
      <div><h3>Ask Once</h3><p><code>watcher:watch</code>: this resource, the relation <code>scm:merge</code>, and a reply form to answer on.</p></div>
      <div><h3>It Looks, as HEART</h3><p>Every 3 seconds: does the pull request’s answer offer <code>scm:merge</code> now?</p></div>
      <div><h3>Be Told Later</h3><p><code>completed</code>, signed, when it does. <code>failed</code>, not offered in time, when it never does.</p></div>
      <p class="punch">It doesn’t know what a pull request is. It knows what an offer is.</p>
      <p class="refs"><deck-ref name="rise"></deck-ref> <deck-ref name="hypertext"></deck-ref></p>
    </div>
    <div class="card dark" style="align-self: center">
      <span class="label">From the kept script</span>
      <pre style="margin: .4rem 0 0; white-space: pre-wrap; font-size: .9rem">- enter: ${watcher}
    steps:
      - ask: watcher:watch
        fields:
          resource: ${pr.@self}
          offers: scm:merge
        reply: watch
  - once-answered:
      reply: watch
      steps:
        - enter: ${pr.@self}
          steps:
            - act: scm:merge
              fields:
                method: squash</pre>
    </div>
  </div>
