name: what-it-produced
part: "The bdd-gates skill, in depth"
title: "What It Produced"
kicker: The artie repository, counted on 14 November 2026
say: "So what did seven months of that produce? I counted, today, in the repository. 201 feature files. 1,273 scenarios, each one a behavior written down before its code. 1,117 commits since the 19th of April. 365 Kotlin production files, across the HEART library, the client, the domains, the MCP server and the Spring server. I didn't type most of it. Under the gates, no production change lands without a scenario first. As we'll see next, that's what makes the components trustworthy enough to build a release on."
sources:
  - ["heart-rise-artie (repository)", "https://github.com/JogoShugh/heart-rise-artie"]
html: |
  <h2>What It Produced</h2>
  <div class="split" style="grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch">
    <div class="stat"><b style="font: 700 3.2rem var(--display); color: var(--leaf)">201</b><p>feature files</p></div>
    <div class="stat"><b style="font: 700 3.2rem var(--display); color: var(--leaf)">1,273</b><p>scenarios</p></div>
    <div class="stat"><b style="font: 700 3.2rem var(--display); color: var(--leaf)">1,117</b><p>commits since 19 April 2026</p></div>
    <div class="stat"><b style="font: 700 3.2rem var(--display); color: var(--leaf)">365</b><p>Kotlin production files</p></div>
  </div>
  <p class="lead">Across the HEART library, the client, the domains, the MCP server and the Spring server.</p>
  <p class="punch">Under the gates, no production change lands without a scenario first.</p>
  <p class="refs"><deck-ref name="right-behavior"></deck-ref> <deck-ref name="repeatability"></deck-ref> <deck-ref name="resilience"></deck-ref></p>
