name: two-ideas
part: "What I wanted the agent to be"
title: "Two Ideas I Borrowed"
kicker: Fielding, 2008 · Hightower, 2026
say: "I borrowed two ideas. Roy Fielding, in 2008, wrote down what makes an API RESTful, and the rule I lean on most is this: a client should enter with nothing but a bookmark and the media types it understands, and from then on take every next step from what the server offers in its answers. No manual, no list of URLs. Kelsey Hightower, this year, gave a talk called Zero Token Architecture: stop paying a model to work out the same thing on every call; infer once, then run the result as plain code. Put them together: find the way once from the answers, then replay it for free, checking at each step that it's still offered. Which sounds a lot like something you already use."
sources:
  - ["Fielding: REST APIs must be hypertext-driven (2008)", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
  - ["Hightower: ZTA, Zero Token Architecture (talk)", "https://www.wearedevelopers.com/videos/100533-zta-zero-token-architecture"]
html: |
  <h2>Two Ideas I Borrowed</h2>
  <div class="split" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch">
    <div class="panel">
      <span class="label">Roy Fielding · 2008</span>
      <p class="lead" style="margin: .3rem 0">Enter with a bookmark. Follow what’s offered.</p>
      <p>No manual and no list of URLs: every next step comes from the server’s own answer.</p>
      <p class="refs"><deck-ref name="rule-6"></deck-ref> <deck-ref name="hypertext"></deck-ref> <deck-ref name="frustrated"></deck-ref></p>
    </div>
    <div class="panel">
      <span class="label">Kelsey Hightower · 2026</span>
      <p class="lead" style="margin: .3rem 0">Infer once. Then run it without a model.</p>
      <p>Stop paying a model to work out the same thing on every call.</p>
      <p class="refs"><deck-ref name="zta"></deck-ref></p>
    </div>
  </div>
  <p class="punch">Together: find the way once from the answers, then replay it for free, checking each step is still offered.</p>
