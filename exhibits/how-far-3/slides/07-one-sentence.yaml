name: one-sentence
part: "One behavior, start to finish"
title: "It Starts With One Sentence"
kicker: Dictated, through /remote-control
say: "Now, how it was built. Let's follow one real change, from start to finish. The library renews three weeks at a time, and that was written into the code. I wanted it in a policy file instead, kept with the library's code, so a pull request could change it. So I said one sentence, more or less this one, into my phone. That's the whole specification I gave. Everything that follows, Claude did, and the hooks made sure it did it in the right order."
sources:
  - ["Claude Code docs: /remote-control", "https://code.claude.com/docs/en/remote-control"]
html: |
  <h2>It Starts With One Sentence</h2>
  <div class="split">
    <div class="rows">
      <p class="lead">The library renews three weeks at a time, and that was written into the code.</p>
      <div><h3>What I Wanted</h3><p>The renewal period in a policy file, kept with the library’s code, so a pull request can change it.</p></div>
      <div><h3>What I Gave</h3><p>One sentence, dictated. That’s the whole specification.</p></div>
      <p class="refs"><deck-ref name="no-time"></deck-ref></p>
    </div>
    <div class="phone">
      <p class="phone-head">/remote-control</p>
      <p class="me">Let the library's renewal period come from its policy file, so a commit can change it. If the file doesn't say, keep three weeks.</p>
      <p class="it">Writing the scenario first.</p>
      <p class="note">Illustrative: the kind of sentence I dictate. The change itself is real, commit e3dbaca4, 11 November 2026.</p>
    </div>
  </div>
