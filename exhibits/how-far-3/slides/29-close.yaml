name: close
part: "What it cost, and where to go"
tone: dark
title: "Where to Go From Here"
kicker: Close
say: "Recall the question I started with: have you ever asked an agent to do the same job twice and gotten two different answers? Here's what I did about it. One sentence about a library's renewal policy became four rows anyone can read, a red run that failed for the right reason, a few lines of code, a green run, and a commit that had to prove its order, held by hooks while I was out walking the dog and dictating into my phone. Do that a thousand times and you get generic components you can trust. Put them together and a release runs across five services that share nothing but a media type, and catches a zero-week policy before it reaches Dev. The bdd-gates skill is public, and so is everything you saw. Try the skill on your own repository; it supports Kotlin with Gradle, TypeScript with Node, and C# with .NET today. And if your agents keep giving you two different answers, come and find me."
html: |
  <h2>Where to Go From Here</h2>
  <div class="split" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div class="step"><h3>One Behavior</h3><p>Scenario, the right red, code, green, gated commit. Held by hooks while nobody watches.</p></div>
    <div class="step"><h3>Generic Components</h3><p>ARTIE, the gateway, heart-mcp, Buster: built the same way.</p></div>
    <div class="step"><h3>One Media Type</h3><p>Five services, one kept script, one generic client.</p></div>
  </div>
  <p class="lead">Try the bdd-gates skill on your own repository: Kotlin with Gradle, TypeScript with Node, C# with .NET.</p>
  <p class="refs"><a href="https://github.com/JogoShugh/bdd-gates-skill" target="_blank" rel="noopener">bdd-gates skill</a> · <a href="https://github.com/JogoShugh/heart-rise-artie" target="_blank" rel="noopener">heart-rise-artie</a> · <a href="https://jogoshugh.github.io/heart-rise-artie/reports/" target="_blank" rel="noopener">reports</a></p>
