name: watcher
part: "The release, in the order it runs"
title: "The Watcher: Tell Me When It Offers Merge"
kicker: Steps 3 and 4 · watcher:watch, then scm:merge
say: "Is it ready to merge yet? The usual answer is a polling loop, written for one service, checking one field. We asked a different question: tell me when this pull request offers the merge act. The offer watcher is a small RISE service, and it speaks HEART like everything else. ARTIE asks it, with the pull request's address, the relation scm:merge, and a reply form of its own to be answered on. Then ARTIE stops waiting. Every three seconds the watcher reads the pull request: does its answer offer merge now? The moment it does, the watcher answers ARTIE's reply, signed, and ARTIE merges, by squashing, and checks it really is merged. Notice that the watcher doesn't know what a pull request is. It knows what an offer is. Next: build it."
sources:
  - ["The kept release script (release.heart.yaml)", "https://github.com/JogoShugh/heart-rise-artie/blob/claude/auth-branch-4bnmhc/exhibits/merge-watch-release/release.heart.yaml"]
html: |
  <h2>The Watcher: Tell Me When It Offers Merge</h2>
  <div class="split">
    <div class="rows">
      <div><h3>Ask Once</h3><p><code>watcher:watch</code>: this resource, the relation <code>scm:merge</code>, and a reply form to answer on.</p></div>
      <div><h3>It Looks, as HEART</h3><p>Every 3 seconds: does the pull request’s answer offer <code>scm:merge</code> now?</p></div>
      <div><h3>Be Told Later</h3><p><code>completed</code>, signed, when it does. <code>failed</code>, not offered in time, when it never does.</p></div>
      <p class="punch">It doesn’t know what a pull request is. It knows what an offer is.</p>
      <p class="refs"><deck-ref name="rise"></deck-ref> <deck-ref name="hypertext"></deck-ref></p>
    </div>
    <div class="card dark" style="align-self: center">
      <span class="label">From the kept script</span>
      <pre style="margin: .4rem 0 0; white-space: pre-wrap; font-size: .9rem">- enter: ${watcher}
    steps:
      - ask: watcher:watch
        fields:
          resource: ${pr.@self}
          offers: scm:merge
        reply: watch
  - once-answered:
      reply: watch
      steps:
        - enter: ${pr.@self}
          steps:
            - act: scm:merge
              fields:
                method: squash</pre>
    </div>
  </div>
