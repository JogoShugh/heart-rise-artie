# What the business needs from an agent, besides fewer tokens. Reason is the hype; these three are the work.
- name: right-behavior
  kind: measure
  label: "RIGHT-BEHAVIOR"
  title: "Right behavior: only what the state allows, and a reason when not"
  summary: "The agent is offered only the acts the current state allows, sends each one with the validator from the state it read, and gets a reason when an act is absent. At the small scale it is a Gherkin scenario that says what right means before any code is written."
  cite: "The first of the three R's"
  href: "#three-rs-one-behavior"
- name: repeatability
  kind: measure
  label: "REPEATABILITY"
  title: "Repeatability: the same goal, the same result, every time"
  summary: "Given the same inputs, the same outputs, call after call. Found once with a model, then replayed with none: the same steps, the same checks, the same result, until the controls really change. At the small scale it is one scenario that runs the same way every time."
  cite: "The second of the three R's"
  href: "#three-rs-one-behavior"
- name: resilience
  kind: measure
  label: "RESILIENCE"
  title: "Resilience: the server changes, the client doesn't break"
  summary: "When the server changes, or misbehaves on purpose, the client takes the failure path the spec names, re-syncs, and goes on; a model comes back only when the controls really changed, to repair. At the small scale it is the regression suite and the gates that hold, even against the model."
  cite: "The third of the three R's"
  href: "#three-rs-one-behavior"
- name: reason
  kind: hype
  label: "REASON"
  title: "Reason: the part everyone's excited about"
  summary: "Reasoning models can stand in for a person in two places: finding the way the first time, and repairing when the controls change. Everywhere else, paying a model to reason through the same path again is the token maxing Hightower warned about. Useful at the edges; wasted in the middle."
  cite: "The hype, kept at the edges"
  href: "#three-rs-one-behavior"
- name: reliability
  kind: umbrella
  label: "RELIABILITY"
  title: "Reliability: what the three R's add up to"
  summary: "Not a fourth R beside the others: the one over them. A system is reliable only when it behaves right, repeats that behavior given the same inputs, and stays right when things change or break. Miss any one and it isn't."
  cite: "Over the three R's"
  href: "#three-rs-one-behavior"
- name: risk
  kind: umbrella
  label: "RISK"
  title: "Risk, mitigated: what reliability buys"
  summary: "Wrong acts on the wrong state, drift between runs, surprises when a service changes, unbounded spend, decisions nobody can reconstruct. Each is a risk; each is held down by one of the R's, or by the record they leave. Lose an R and the risk comes back."
  cite: "What the R's are for"
  href: "#three-rs-one-behavior"
