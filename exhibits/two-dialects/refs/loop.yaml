# Who owns the loop: AI in the loop, not a human rubber stamp.
- name: ai-in-the-loop
  kind: loop
  label: "AI-IN-THE-LOOP"
  title: "AI in the loop: the person in control, the AI in support"
  summary: "Natarajan, Mathur, Sidheekh, Stammer and Kersting contrast human-in-the-loop systems with AI-in-the-loop (AI²L) systems, where the human is in control of the system and the AI is there to support the human, and argue that evaluations should not judge the machine component alone."
  quote: "<p>“We argue that existing evaluation methods often overemphasize the machine (learning) component's performance, neglecting the human expert's critical role.”</p>"
  cite: "Natarajan, Mathur, Sidheekh, Stammer and Kersting, “Human-in-the-loop or AI-in-the-loop? Automate or Collaborate?”, arXiv"
  date: 18 December 2024
  href: https://arxiv.org/abs/2412.14232
- name: hcai
  kind: loop
  label: "HIGH-AND-HIGH"
  title: "High automation and high human control, together"
  summary: "Shneiderman's human-centered AI framework: more automation does not have to mean less human control. Well-designed systems offer both."
  quote: "<p>“Well-designed technologies that offer high levels of human control and high levels of computer automation can increase human performance, leading to wider adoption.”</p>"
  cite: "Ben Shneiderman, “Human-Centered Artificial Intelligence: Reliable, Safe & Trustworthy”, arXiv"
  date: 10 February 2020
  href: https://arxiv.org/abs/2002.04087
- name: humans-in-charge
  kind: loop
  label: "IN-CHARGE"
  title: "AI in the loop: humans must remain in charge"
  summary: "Stanford HAI, announcing its 2022 fall conference: put AI in the loop, with control in human hands."
  quote: "<p>“Artificial intelligence should augment humans, be a useful tool in our work, but control should remain in human hands.”</p>"
  cite: "Shana Lynch, “AI in the Loop: Humans Must Remain in Charge”, Stanford HAI"
  date: 17 October 2022
  href: https://hai.stanford.edu/news/ai-loop-humans-must-remain-charge
