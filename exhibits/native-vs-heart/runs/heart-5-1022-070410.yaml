    act(intent = "get issue 217 of $owner/$repo")
    act(intent = "comment on it: Same crash as #215.")
    act(intent = "close it as a duplicate of the issue with id 5978074393 (#215)")
    check("state" to "closed", "state_reason" to "duplicate")
