    act(intent = "Change its description to: This fixes #207 and is tested by #208.")
    until(tries = 20) { offers("github:merge") }
    act(intent = """Merge it by squashing its commits, with the commit title "Refuse a bed with no name (#210)"""")
    check("merged" to true)
    act(intent = "get issue 207 of $owner/$repo")
    act(intent = "Make issue with id 5977995761 a sub-issue of this issue")
    act(intent = "comment on it: Fixed in #210, tested in #208.")
    act(intent = "lock the conversation as resolved")
    check("state" to "closed", "state_reason" to "completed", "locked" to true)
    act(intent = "get issue 208 of $owner/$repo")
    act(intent = "comment on it: The test went in with #210.")
    act(intent = "close it as completed")
    check("state" to "closed")
    act(intent = "get issue 209 of $owner/$repo")
    act(intent = "comment on it: Same crash as #207.")
    act(intent = "Close it as a duplicate of the issue with id 5977988480.")
    check("state" to "closed", "state_reason" to "duplicate")
