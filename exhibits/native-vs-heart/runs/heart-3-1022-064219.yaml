    act(intent = "comment on it: The test went in with #199.")
    act(intent = "Close it as completed")
    check("state" to "closed")
    act(intent = "get issue $owner/$repo number 198")
    act(intent = "comment on it: Same crash as #196.")
    act(intent = "Close it as a duplicate of the issue whose id is 5977769323")
