# The employees service with its OpenAPI description withheld: code mode on HEART told nothing, finding its way by
# the hypermedia alone (bench.py, code-heart-noapi). Everything else passes through unchanged.
server {
    listen 8099;
    location = /openapi.json { return 404; }
    location / {
        proxy_pass http://heart-sims-tt:8099;
        proxy_set_header Host $http_host;
    }
}
