    <div class="table-scroll"><table>
      <thead><tr><th></th><th>One behavior</th><th>Components and the system</th></tr></thead>
      <tbody>
        <tr><td><deck-ref name="right-behavior"></deck-ref></td><td>Gherkin says what right means before the code exists</td><td>Only the acts the state allows; a reason when not</td></tr>
        <tr><td><deck-ref name="repeatability"></deck-ref></td><td>The scenario runs the same way on every change</td><td>A kept script replays the same way, with no model</td></tr>
        <tr><td><deck-ref name="resilience"></deck-ref></td><td>A break goes red, and the gate refuses the commit, even the model’s</td><td>Buster tampers on purpose; ARTIE takes the right failure path</td></tr>
      </tbody>
    </table></div>
  </div>
  <p class="punch">One test at a time, for components and systems that are themselves right, repeatable and resilient.</p>
