name: title
part: "Why now"
tone: dark
title: How far can one Web architect’s vision go?
kicker: Hypertext, inference and hooks
say: "The question for the next half hour: if we take one Web architect's 2008 vision at its word, with today's tools, how far does it go? Two halves: running (hypertext lets a model find a path once, then a script replays it), and building (hooks put determinism around the model that wrote the code)."
html: |
  <h1>How far can one Web architect’s vision go?</h1>
  <p class="lead">Hypertext, inference, and hooks: determinism around a model.</p>
  <p class="refs"><small>One loop, for a person and for an agent</small> <span class="ref kind-comment" aria-hidden="true">Look</span> <span class="ref" aria-hidden="true">Think</span> <span class="ref kind-comment" aria-hidden="true">Act</span></p>
  <p class="refs"><small>Built on</small> <deck-ref name="zta"></deck-ref> <deck-ref name="rule-6"></deck-ref> <deck-ref name="hypertext"></deck-ref> <deck-ref name="uniform-interface"></deck-ref></p>
