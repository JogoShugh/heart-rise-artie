        <line x1="60" y1="290" x2="60" y2="20" stroke="currentColor" stroke-width="2"/>
        <text x="240" y="325" text-anchor="middle" fill="currentColor" font-size="14">automation →</text>
        <text x="22" y="155" text-anchor="middle" fill="currentColor" font-size="14" transform="rotate(-90 22 155)">human control →</text>
        <circle cx="340" cy="250" r="9" fill="#c0392b"/>
        <text x="340" y="232" text-anchor="middle" fill="currentColor" font-size="13">a person approving 500 a day</text>
        <circle cx="120" cy="70" r="9" fill="#888"/>
        <text x="120" y="52" text-anchor="middle" fill="currentColor" font-size="13">typing it all yourself</text>
        <circle cx="300" cy="70" r="11" fill="#2f9e5b"/>
        <text x="300" y="52" text-anchor="middle" fill="currentColor" font-size="13" font-weight="700">this talk</text>
        <text x="300" y="98" text-anchor="middle" fill="currentColor" font-size="12">goal owned · script read · gates hold</text>
      </svg>
      <figcaption>After Shneiderman: high automation and high control, together.</figcaption>
    </figure>
    <div class="rows">
      <div><h3>The Person Owns the Goal</h3><p>Said in a sentence. Read back as a kept script.</p></div>
      <div><h3>The Model Supports</h3><p>Finds the way once. Repairs when the controls change.</p></div>
      <div><h3>The Controls Hold the Line</h3><p>Hooks for the builder, the server’s forms for the agent. I read the record, not every step.</p></div>
