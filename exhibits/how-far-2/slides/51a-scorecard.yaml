name: scorecard
part: "Close"
title: "How Far Did We Get?"
kicker: The measuring stick, applied · marks for discussion
say: "So, how far did we get? Here's the measuring stick from the start, applied honestly. Fielding's 2000 constraints: client-server, stateless, cache, the uniform interface with hypermedia driving the state, and layering, with our gateway in front of GitHub, all met. Code on demand we didn't use; it's optional, and he says so. His 2008 rules: we enter by a bookmark, we don't fix URIs, the media type and the relation types carry the meaning, and HTTP is used as HTTP defines it, validators and all. Any protocol? Partly. We've only run over HTTP. Then the three R's. Repeatability: met; the kept script replays with no model. Right behavior: met; the second merge was refused before it left the machine, with the service's reason. Resilience: partly. Buster's pack is written and judging ARTIE, but I haven't run the whole pack against every client yet. That's the honest answer: further than most people expect, and not all the way yet."
sources:
  - ["Fielding: dissertation, chapter 5 (2000)", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
  - ["Fielding: REST APIs must be hypertext-driven (2008)", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
  - ["Buster (repository)", "https://github.com/JogoShugh/buster"]
html: |
  <h2>How Far Did We Get?</h2>
  <div class="split" style="grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch">
    <div class="panel">
      <span class="label">2000 · constraints</span>
      <p><b>Met:</b> <deck-ref name="client-server"></deck-ref> <deck-ref name="stateless"></deck-ref> <deck-ref name="cache"></deck-ref> <deck-ref name="uniform-interface"></deck-ref> <deck-ref name="layered-system"></deck-ref></p>
      <p><b>Not used:</b> <deck-ref name="code-on-demand"></deck-ref> optional, and he says so.</p>
    </div>
    <div class="panel">
      <span class="label">2008 · rules</span>
      <p><b>Met:</b> <deck-ref name="rule-2"></deck-ref> <deck-ref name="rule-3"></deck-ref> <deck-ref name="rule-4"></deck-ref> <deck-ref name="rule-5"></deck-ref> <deck-ref name="rule-6"></deck-ref></p>
      <p><b>Partly:</b> <deck-ref name="rule-1"></deck-ref> only HTTP so far.</p>
    </div>
    <div class="panel">
      <span class="label">The three R’s</span>
      <p><b>Met:</b> <deck-ref name="repeatability"></deck-ref> replay with no model. <deck-ref name="right-behavior"></deck-ref> refused before sending, with a reason.</p>
      <p><b>Partly:</b> <deck-ref name="resilience"></deck-ref> Buster’s pack written; not yet run against every client.</p>
    </div>
  </div>
  <p class="punch">Further than most people expect, and not all the way yet.</p>
