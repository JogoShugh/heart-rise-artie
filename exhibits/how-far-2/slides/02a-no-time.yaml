name: no-time
part: "Why now"
title: No time to type
kicker: Why this talk · the second ground has four legs
say: "The second ground is personal, and it has four legs. Family, and a new dog. Typing time is gone: one hand holds a leash, the other a phone. So most of my work is steered by thumb, through Claude Code's /remote-control: the session runs on my machine at home, and I answer it from the sidewalk. My prompts got very short. Most evenings it's two: 'Please give me an update', and 'How's it going?' The dog sets the pace. That changes what an agent has to be. Safe while nobody watches every step: offered only what the state allows, and a refusal that says why. Cheap when it does the same thing again: think once, replay with no model, which is Hightower's point. And short to say: a goal in words, not a manual. So the agent finds its way from the answers, not from me. Hold on to that; it's why the controls have to be in the answers."
sources:
  - ["Claude Code docs: /remote-control", "https://code.claude.com/docs/en/remote-control"]
  - ["Hightower: ZTA, Zero Token Architecture (talk)", "https://www.wearedevelopers.com/videos/100533-zta-zero-token-architecture"]
html: |
  <h2>No time to type</h2>
  <div class="split">
    <div class="rows">
      <p class="lead">Family, a new dog, a phone in one hand and a leash in the other. The dog sets the pace.</p>
      <div><h3>Safe while nobody watches</h3><p>Offered only what the state allows. A refusal says why.</p></div>
      <div><h3>Cheap when repeated</h3><p>Think once, then replay with no model. <deck-ref name="zta"></deck-ref></p></div>
      <div><h3>Short to say</h3><p>A goal in words, not a manual. One thumb’s worth.</p></div>
      <p class="punch">So the agent finds its way from the answers, not from me. <deck-ref name="no-time"></deck-ref></p>
    </div>
    <div class="phone">
      <p class="phone-head">/remote-control</p>
      <p class="me">Please give me an update</p>
      <p class="it">Red run logged. Writing the fix.</p>
      <p class="me">How’s it going?</p>
      <p class="it">Green. Committed through the gate.</p>
      <p class="me">🐕 pulling. back in 20</p>
      <p class="note">Illustrative, not a transcript. The two questions are the real ones, every evening. So is the dog.</p>
    </div>
  </div>
