name: no-time
part: "Why now"
title: No time to type
kicker: Why this talk · the second ground has four legs
say: "The second ground is personal, and it has four legs. Family, and a new dog. Typing time is gone: one hand holds a leash, the other a phone. Half the fix was Claude Code's /remote-control: the session runs on my machine at home, and I steer it by thumb from the sidewalk. Most evenings that's two prompts: 'Please give me an update', and 'How's it going?' But that's only half. An agent I can't watch has to behave the same way every time, and it has to follow BDD rigorously: Gherkin first, a red run, the code, a green run, then a commit. Asking it nicely isn't enough; instructions are advisory. So hooks enforce it: a write out of order is refused, every run is logged, and the commit gate checks the order. I don't monitor the agent; I read the record when I get home. Hold on to that: controls that hold while nobody watches. It's exactly what this talk asks of agents calling APIs."
sources:
  - ["Claude Code docs: /remote-control", "https://code.claude.com/docs/en/remote-control"]
  - ["bdd-gates skill", "https://github.com/JogoShugh/bdd-gates-skill"]
fragments:
  - name: hooks
    label: The hooks that gate every change (core/hooks.json)
    source: bdd-gates:core/hooks.json
    lang: json
html: |
  <h2>No time to type</h2>
  <div class="split">
    <div class="rows">
      <p class="lead">Family, a new dog, a phone in one hand and a leash in the other.</p>
      <div><h3>Half the fix: <code>/remote-control</code></h3><p>The session runs at home; I steer it by thumb from the sidewalk.</p></div>
      <div><h3>The other half: rigour without watching</h3><p>Same behaviour every time, BDD followed strictly: Gherkin, red, code, green, commit.</p></div>
      <div><h3>Hooks, not hopes</h3><p>A write out of order is refused. Every run is logged. The commit gate checks the order. I read the record, not the agent.</p></div>
      <p class="punch">Controls that hold while nobody watches. That’s this talk. <deck-ref name="no-time"></deck-ref> <deck-fragment name="hooks">hooks.json</deck-fragment></p>
    </div>
    <div class="phone">
      <p class="phone-head">/remote-control</p>
      <p class="me">Please give me an update</p>
      <p class="it">Red run logged. Writing the fix.</p>
      <p class="me">How’s it going?</p>
      <p class="it">Green. Commit gate: TDD order checked.</p>
      <p class="me">🐕 pulling. back in 20</p>
      <p class="note">Illustrative, not a transcript. The two questions are the real ones, every evening. So is the dog.</p>
    </div>
  </div>
