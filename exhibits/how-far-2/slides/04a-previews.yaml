name: previews
part: "Why now"
title: What you'll see, promised now
kicker: Five previews · each kept later
say: "Five promises, so you know what's coming. P1: a real merge on GitHub, through our gateway, step by step. P2: the same kept script on a local GitLab, unchanged. P3: zero tokens to replay. P4: AWS's docs moving into the answer as forms. P5: an agent, Claude Code, given state instead of a catalogue, through heart-mcp. When a later slide keeps one of these, it carries the same pill, so you can see which promise it keeps. First, though, how the Web solved this for people, long before agents."
sources:
  - ["Report: Real GitHub, Local GitLab", "https://jogoshugh.github.io/heart-rise-artie/reports/merge-watch-real-github/"]
  - ["Report: heart-mcp on real GitHub", "https://jogoshugh.github.io/heart-rise-artie/reports/how-far-2/heart-mcp-run/"]
html: |
  <h2>What you'll see, promised now</h2>
  <div class="rows">
    <div><h3><deck-ref name="p1"></deck-ref></h3><p>A real pull request on GitHub, through our gateway: data, links, forms, guards, merged.</p></div>
    <div><h3><deck-ref name="p2"></deck-ref></h3><p>The same kept script on a local GitLab, unchanged.</p></div>
    <div><h3><deck-ref name="p3"></deck-ref></h3><p>Think once with a model; every replay after, no model at all.</p></div>
    <div><h3><deck-ref name="p4"></deck-ref></h3><p>An API you know: AWS’s docs move into the answer as forms.</p></div>
    <div><h3><deck-ref name="p5"></deck-ref></h3><p>Claude Code through heart-mcp: one merge sent, the second refused before sending.</p></div>
  </div>
  <p class="punch">A later slide that keeps a promise carries its pill.</p>
