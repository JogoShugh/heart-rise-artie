name: rules
part: "Why now"
title: "The rules we hold to: Fielding, 2000 and 2008"
kicker: The third ground · short forms you can click any time
say: "The third ground is Roy Fielding. Three sets, each with a short form you'll see again. First, his 2000 dissertation: the six constraints of REST, with the uniform interface, and hypermedia as the engine of application state inside it; code on demand is the optional one. Second, his 2008 post, REST APIs must be hypertext-driven: six rules, and the frustration that made him write them. Rule six is the bookmark: enter with nothing but a bookmark and media types, then follow what's offered. Third, his own comments under that post: what hypertext means, the browser test, designing for decades, comment 742 on prior knowledge, follow your nose, instructions in band, and instructions just before acting. Each pill opens his words, whole. Whenever a later slide shows one, that's the claim it stands on. And the Pills button, or the K key, lists every one at any time."
sources:
  - ["Fielding: dissertation, chapter 5 (2000)", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
  - ["Fielding: REST APIs must be hypertext-driven (2008), and its comments", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
html: |
  <h2>The rules we hold to: Fielding, 2000 and 2008</h2>
  <div class="split" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); align-items: stretch">
    <div class="panel">
      <span class="label">2000 · the REST constraints</span>
      <p>What the Web is built on. Hypermedia drives the state, inside the uniform interface.</p>
      <p class="refs"><deck-ref name="client-server"></deck-ref> <deck-ref name="stateless"></deck-ref> <deck-ref name="cache"></deck-ref> <deck-ref name="uniform-interface"></deck-ref> <deck-ref name="layered-system"></deck-ref> <deck-ref name="code-on-demand"></deck-ref></p>
    </div>
    <div class="panel">
      <span class="label">2008 · six rules</span>
      <p>“REST APIs must be hypertext-driven”, and why he wrote it.</p>
      <p class="refs"><deck-ref name="frustrated"></deck-ref> <deck-ref name="rule-1"></deck-ref> <deck-ref name="rule-2"></deck-ref> <deck-ref name="rule-3"></deck-ref> <deck-ref name="rule-4"></deck-ref> <deck-ref name="rule-5"></deck-ref> <deck-ref name="rule-6"></deck-ref></p>
    </div>
    <div class="panel">
      <span class="label">2008 · his comments</span>
      <p>His answers to readers, under the same post.</p>
      <p class="refs"><deck-ref name="hypertext"></deck-ref> <deck-ref name="think-of-the-web"></deck-ref> <deck-ref name="decades"></deck-ref> <deck-ref name="prior-knowledge"></deck-ref> <deck-ref name="follow-your-nose"></deck-ref> <deck-ref name="in-band"></deck-ref> <deck-ref name="ai-driven"></deck-ref></p>
    </div>
  </div>
  <p class="punch">Each pill opens his words, whole. A later slide that shows one stands on it. <b>Pills</b> (or K) lists every one, any time.</p>
