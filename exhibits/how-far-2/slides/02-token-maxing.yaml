name: token-maxing
part: "Why now"
title: From token maxing to tokenomics
kicker: Why this talk
say: "Start with Kelsey Hightower. He opened his talk ZTA, Zero Token Architecture, at the WeAreDevelopers World Congress North America in September 2026 by telling the room they were having way too much fun burning way too many tokens. His point: agents that run inference on every call burn tokens and work against zero trust. Infer once, then run the result as reliable, deterministic code. That lands at a moment when the industry is turning. Companies ranked engineers by tokens burned; Meta's internal leaderboard covered more than 85,000 employees. Per-token prices for GPT-4-class models fell about 98% since late 2022, yet enterprise AI bills went up, because volume went up. J.R. Storment of the FinOps Foundation says the conversation moved from tokenmaxxing and go fast to guardrails and control. Ashish Bhatia puts it in two phases: the first was enablement, the next is governance. Token maxing re-learns the API on every call. Tokenomics learns it once and keeps something that stays true. So the question for the rest of the talk: what keeps it true?"
sources:
  - ["Hightower: ZTA, Zero Token Architecture (talk)", "https://www.wearedevelopers.com/videos/100533-zta-zero-token-architecture"]
  - ["Cranney: Infer Once, Run Everywhere", "https://www.wearedevelopers.com/magazine/783-infer-once-run-everywhere-zero-token-architecture"]
  - ["Bhatia: From Tokenmaxing to Tokenomics", "https://ashbhatia.substack.com/p/from-tokenmaxing-to-tokenomics"]
  - ["The Next Web: Token prices fell 98%", "https://thenextweb.com/news/token-prices-fell-98-enterprise-ai-bills-tripled-now-the-industry-wants-a-standards-body-to-explain-why"]
html: |
  <h2>From token maxing to tokenomics</h2>
  <div class="split">
    <div class="card dark" style="box-shadow: inset 0 0 0 1.5px rgba(227, 179, 65, 0.45);">
      <blockquote class="big">“You are all having way too much fun burning way too many tokens”</blockquote>
      <p class="cite"><a href="https://www.wearedevelopers.com/videos/100533-zta-zero-token-architecture" target="_blank" rel="noopener"><b>Kelsey Hightower</b>, opening <b>ZTA: Zero Token Architecture</b></a>, WeAreDevelopers World Congress North America, 26 Sep 2026</p>
      <p>Agents that run inference on every call burn tokens and work against zero trust. Infer once, then run the result as reliable, deterministic code.</p>
      <p class="refs"><deck-ref name="zta">The talk</deck-ref></p>
    </div>
    <div class="rows">
      <div><h3>Token maxing</h3><p>Companies ranked engineers by tokens burned. Meta’s internal leaderboard covered 85,000+ employees.</p></div>
      <div><h3>The bill</h3><p>Per-token prices for GPT-4-class models fell about 98% since late 2022. Enterprise AI bills rose anyway: volume.</p></div>
      <div><h3>The turn</h3><p>The FinOps Foundation’s J.R. Storment: from tokenmaxxing and “go fast” to guardrails and control. Ashish Bhatia: enablement first, governance next.</p></div>
      <p class="punch">Token maxing re-learns the API on every call. Tokenomics learns it once and keeps something that stays true. What keeps it true?</p>
    </div>
  </div>
