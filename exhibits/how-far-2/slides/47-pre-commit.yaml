name: pre-commit
part: "What it costs, and how it was built"
title: git pre-commit reads the log in order
kicker: For the engineers · The commit
say: "The git pre-commit hook works for any committer, not just Claude Code. Since the last commit, the event log must show a feature write before the first production write, a failing BDD run before the first production write, and a passing final run. Order comes from line order in the append-only log, so events in the same second compare correctly."
sources:
  - ["bdd-gates: core/pre-commit", "https://github.com/JogoShugh/bdd-gates-skill"]
  - ["Git hooks", "https://git-scm.com/docs/githooks"]
fragments:
  - name: pre-commit
    label: core/pre-commit, the ordering check
    source: bdd-gates:core/pre-commit
    from: "feature=$(first_line ' FEATURE_WRITE ')"
    to: 'echo "pre-commit: TDD ordering check passed."'
    lang: bash
html: |
  <h2>git pre-commit reads the log in order</h2>
  <div class="split" style="grid-template-columns: minmax(0, 7fr) minmax(0, 4fr);">
    <div class="rows">
      <pre><code># .githooks/pre-commit (abridged)
  feature=$(first_line ' FEATURE_WRITE ')
  fail=$(first_line "${run_re}FAIL")
  main=$(first_line ' MAIN_WRITE ')
  [ -n "$feature" ] || reasons+=("no FEATURE_WRITE
    since the last commit")
  [ -n "$fail" ] || reasons+=("no failing BDD run
    since the last commit (the scenario was never
    seen red)")
  [ "$fail" -gt "$main" ] &amp;&amp; reasons+=("production
    code was written before the BDD suite was
    seen failing")
  case "$last_run" in *" PASS"*) ;; *) reasons+=(
    "the latest BDD run … is not PASS") ;; esac
  echo "pre-commit: TDD ordering check passed."</code></pre>
      <p class="refs"><deck-fragment name="pre-commit">pre-commit</deck-fragment></p>
    </div>
    <div class="rows">
      <h3>Three facts, in order</h3>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 1.5rem; gap: 0.7rem 0.6rem; align-items: center;">
        <span style="display: block; text-align: center; font: 700 1rem/1.2 var(--body); padding: 0.7rem 1rem; border-radius: 999px; background: #c9d8ce; color: #17201b;">FEATURE_WRITE</span> <span aria-hidden="true">↓</span>
        <span style="display: block; text-align: center; font: 700 1rem/1.2 var(--body); padding: 0.7rem 1rem; border-radius: 999px; background: #b4562c; color: #fff;">BDD_RUN FAIL</span> <span aria-hidden="true">↓</span>
        <span style="display: block; text-align: center; font: 700 1rem/1.2 var(--body); padding: 0.7rem 1rem; border-radius: 999px; background: #c9d8ce; color: #17201b;">MAIN_WRITE …</span> <span aria-hidden="true">↓</span>
        <span style="display: block; text-align: center; font: 700 1rem/1.2 var(--body); padding: 0.7rem 1rem; border-radius: 999px; background: #2f7d55; color: #fff;">BDD_RUN PASS</span>
      </div>
      <p>Works for a plain terminal git commit too. <span style="white-space: nowrap;">--no-verify</span> and git commit -n are blocked for the model by protect-gate.sh.</p>
    </div>
  </div>
