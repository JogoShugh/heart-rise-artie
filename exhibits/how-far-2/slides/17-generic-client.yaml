name: generic-client
part: "Putting them back together"
title: ARTIE is to APIs what a browser is to web pages
kicker: Putting them back together · The generic client
say: "The browser is coupled to HTML and HTTP, and to nothing about any site: not account numbers, not URL layouts, not which buttons exist today. That's why a bank can change its forms tonight and nobody updates their browser. ARTIE is coupled the same way, to one media type, HAL with HEART's schema forms, and HTTP. Zero domain code: no client certificates, no pull requests, no merge rules. Each answer carries its controls. The next slides preview what that looks like on an API you know, AWS API Gateway. Take one of those, AWS, and finish the job."
sources:
  - ["Fielding, dissertation, ch. 5", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
  - ["HAL Schema Forms", "https://github.com/jbadeau/hal-schema-forms"]
  - ["artie (repository)", "https://github.com/JogoShugh/heart-rise-artie"]
html: |
  <h2>ARTIE is to APIs what a browser is to web pages</h2>
  <div class="flow">
    <div class="box"><h3>Web browser</h3><p>one generic client, for every site</p></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="panel"><span class="label">Speaks, and is coupled to</span><span class="big">text/html<br>+ HTTP</span><span class="faint">image/jpeg · image/png · text/css · text/javascript · image/svg+xml · font/woff2</span></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="tiles"><div>An online bank</div><div>A wiki</div><div>A shop</div><div class="ghost">Any site not yet built</div></div>

    <div class="box green"><h3>ARTIE</h3><p>one generic client, for every API</p></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="panel"><span class="label">Speaks, and is coupled to</span><span class="big">application/hal+json<br>+ HEART profile + HTTP</span><span class="faint">application/schema+json · application/problem+json · application/yaml</span></div>
    <span class="arrow" aria-hidden="true"></span>
    <div class="tiles"><div>AWS API Gateway (preview next)</div><div>GitHub</div><div>GitLab</div><div class="ghost">Any API not yet built</div></div>
  </div>
  <p class="verdict"><span class="yes">Coupled to:</span> the media type and the protocol. <span class="no">Not coupled to:</span> certificates, pull requests, merge rules, URL layouts, or which acts exist today. Zero domain code.</p>
  <p class="refs"><deck-ref name="think-of-the-web"></deck-ref> <deck-ref name="uniform-interface"></deck-ref></p>
