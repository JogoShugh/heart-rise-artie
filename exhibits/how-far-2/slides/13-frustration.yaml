name: frustration
part: "What the machine web did"
tone: dark
title: "Measured Against His Frustration"
kicker: 20 October 2008 · Fielding’s frustration
say: "Here's the complaint, in his words. I'm not using it to ask who got REST wrong; plenty of people have done that, and it didn't help anybody. I'm using it as a measuring stick. Hold what we build to the six rules in that post, and to the constraints underneath them from 2000, and see how far it gets. The pills along the bottom are the same short forms from the start. Notice that he wasn't asking for anything new. As we'll see next, it already runs in production."
sources:
  - ["Fielding: REST APIs must be hypertext-driven (2008)", "https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven"]
  - ["Fielding: dissertation, chapter 5 (2000)", "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"]
html: |
  <h2>Measured Against His Frustration</h2>
  <div class="split">
    <div class="rows">
      <blockquote class="big">“I am getting frustrated by the number of people calling any HTTP-based interface a REST API.”</blockquote>
      <p class="cite">Roy T. Fielding, “REST APIs must be hypertext-driven”, 20 Oct 2008 · <deck-ref name="frustrated"></deck-ref></p>
      <p class="lead">Not “who got it wrong”. His complaint is a measuring stick: how far can Web architecture go today, held to what he wrote?</p>
    </div>
    <figure><img src="media/fielding-crop.png" alt="Fielding's 2008 post, 'REST APIs must be hypertext-driven', as it appears on his blog"></figure>
  </div>
  <p class="refs"><small>His six rules</small> <deck-ref name="rule-1"></deck-ref> <deck-ref name="rule-2"></deck-ref> <deck-ref name="rule-3"></deck-ref> <deck-ref name="rule-4"></deck-ref> <deck-ref name="rule-5"></deck-ref> <deck-ref name="rule-6"></deck-ref></p>
  <p class="refs"><small>REST, 2000</small> <deck-ref name="client-server"></deck-ref> <deck-ref name="stateless"></deck-ref> <deck-ref name="cache"></deck-ref> <deck-ref name="uniform-interface"></deck-ref> <deck-ref name="layered-system"></deck-ref> <deck-ref name="code-on-demand"></deck-ref></p>
