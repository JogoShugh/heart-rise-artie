name: heart-rise-artie
part: "Putting them back together"
title: HEART, RISE and ARTIE
kicker: Putting them back together
say: "Three names, briefly. HEART is the media type and its rules; RISE is how asynchronous work answers back; ARTIE is the one generic client. All built test-first under the bdd-gates skill."
sources:
  - ["artie: HEART, RISE, ARTIE", "https://github.com/JogoShugh/heart-rise-artie"]
  - ["HAL Schema Forms", "https://github.com/jbadeau/hal-schema-forms"]
  - ["JSON Schema 2020-12", "https://json-schema.org/draft/2020-12"]
  - ["RFC 9421 HTTP Message Signatures", "https://www.rfc-editor.org/rfc/rfc9421"]
html: |
  <h2>HEART, RISE and ARTIE</h2>
  <div class="split" style="grid-template-columns: 1fr 1fr 1fr; align-items: stretch">
    <div class="panel" style="padding: 1.5rem 1.6rem; gap: 1rem"><h3 style="font: 650 2.4rem/1.1 var(--display); color: var(--leaf); margin: 0; text-transform: none; letter-spacing: 0">HEART</h3><p style="color: var(--muted)"><i>Hypermedia Enforced Agentic Reliable Transactions</i></p><p style="font-size: 1.1rem">Each answer carries the state plus the forms valid now (HAL Schema Forms), with typed relations, If-Match guards and signed acts.</p></div>
    <div class="panel" style="padding: 1.5rem 1.6rem; gap: 1rem"><h3 style="font: 650 2.4rem/1.1 var(--display); color: var(--leaf); margin: 0; text-transform: none; letter-spacing: 0">RISE</h3><p style="color: var(--muted)"><i>Reciprocal Interface for State Exchange</i></p><p style="font-size: 1.1rem">Replies for asynchronous work: a watcher or a build answers back when it’s ready.</p></div>
    <div class="box" style="padding: 1.5rem 1.6rem; gap: 1rem; align-content: start"><h3 style="font-size: 2.4rem">ARTIE</h3><p style="opacity: 0.8"><i>Autonomous Restful Traversal and Interactive Engine</i></p><p style="font-size: 1.1rem">One generic client for all of it, coupled to the media type, never to a domain.</p></div>
  </div>
  <p class="punch">Built test-first under the bdd-gates skill: Claude Code hooks plus git hooks.</p>
