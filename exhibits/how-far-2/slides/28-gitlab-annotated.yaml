name: gitlab-annotated
part: "For real: two forges, one vocabulary"
title: The same relations, on GitLab’s page
kicker: Typed relations · On GitLab
say: "Merge request !504 on the GitLab running on this machine, the same variant, the same script. Same five things, different words on the page: GitLab says merge request, Merged, pr-504 into main, commits were squashed. ARTIE read and sent the same scm: relations on both."
sources:
  - ["GitLab: merge requests API", "https://docs.gitlab.com/api/merge_requests/"]
  - ["GitLab: notes API", "https://docs.gitlab.com/api/notes/"]
html: |
  <h2>The same relations, on GitLab’s page</h2>
  <div class="split" style="grid-template-columns: minmax(0, 5fr) minmax(0, 7fr)">
    <figure><img src="media/gl504.png" alt="GitLab's page for merge request !504, with five numbered boxes: the title, the merged state, the head sha, the squash merge and the note"></figure>
    <div class="rows">
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">1</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:pulls-get</b></code><br>Read merge request 504, kept as pr.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">2</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>state, merged</b></code><br>GitLab’s merged becomes state: closed, merged: true.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">3</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>head.sha</b></code><br>GitLab’s sha: it merges only if the source head is still there.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">4</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:merge {method: squash}</b></code><br>“Changes merged into main with 8ef9444b (commits were squashed).”</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">5</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:comment {body}</b></code><br>The same comment, as a GitLab note.</div></div>
    </div>
  </div>
