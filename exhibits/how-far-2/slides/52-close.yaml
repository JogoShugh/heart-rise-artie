name: close
part: "Close"
tone: dark
title: "Where to Go From Here"
kicker: Close
say: "Recall where we started: have you ever paid a model to find the same path twice? You don't have to. The Web already had the answer for people: put the controls in the answer, next to the information. Do that for agents, and a model finds the way once, a script replays it for free, and a reasoning model only comes back when the controls really change. Build it the same way, one behavior at a time, with gates that hold while you're out walking the dog, and the three R's go all the way up. Everything you saw is in the repositories and the reports, linked on the next slide, including the real merge on GitHub. Run it yourself. And if you find a place where it falls short of Fielding's words, tell me. That's the next measurement."
html: |
  <h2>Where to Go From Here</h2>
  <div class="split" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div class="step"><h3>Running</h3><p>Controls in the answer. Found once with a model, replayed with none. The model comes back only to repair.</p></div>
    <div class="step"><h3>Building</h3><p>One behavior at a time: Gherkin, red, code, green, commit, held by hooks while nobody’s watching.</p></div>
    <div class="step"><h3>Owning the Loop</h3><p>You own the goal and read the record. The AI supports; the controls hold the line.</p></div>
  </div>
  <p class="lead">Everything you saw is in the repositories and the reports. Run it yourself, and tell me where it falls short of Fielding’s words.</p>
  <p class="refs"><deck-ref name="repeatability"></deck-ref> <deck-ref name="right-behavior"></deck-ref> <deck-ref name="resilience"></deck-ref> <deck-ref name="ai-in-the-loop"></deck-ref> <deck-ref name="zta"></deck-ref></p>
