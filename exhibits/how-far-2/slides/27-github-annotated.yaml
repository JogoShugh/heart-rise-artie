name: github-annotated
part: "For real: two forges, one vocabulary"
title: "What each scm: relation did, on GitHub’s own page"
kicker: Typed relations · On GitHub
say: "Pull request #2337 on real GitHub, variant 504: merged, then the smoke test failed scenario S3, so it wasn't promoted and the script commented. Each box is something one scm: relation read or did. The page is GitHub's; ARTIE never saw it, only the gateway's HAL Schema Forms."
sources:
  - ["Pull request #2337", "https://github.com/JogoShugh/heart-github-test/pull/2337"]
  - ["GitHub: merge a pull request", "https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request"]
  - ["GitHub: create an issue comment", "https://docs.github.com/en/rest/issues/comments#create-an-issue-comment"]
html: |
  <h2>What each scm: relation did, on GitHub’s own page</h2>
  <div class="split" style="grid-template-columns: minmax(0, 7fr) minmax(0, 5fr)">
    <figure><img src="media/gh504.png" alt="GitHub's page for pull request #2337, with five numbered boxes: the title, the merged state, the head sha, the squash merge and the comment"></figure>
    <div class="rows">
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">1</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:pulls-get</b></code><br>Read pull request 2337, kept as pr.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">2</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>state, merged</b></code><br>state: closed, merged: true, read after the act.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">3</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>head.sha</b></code><br>The head the view had: GitHub merges only if it’s still there.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">4</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:merge {method: squash}</b></code><br>Squashed into library/main as 1361304.</div></div>
      <div style="display:flex;gap:0.9rem;align-items:flex-start"><span style="flex:none;display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:#e3b341;color:#17201b;font-weight:700">5</span><div><code style="background:none;padding:0;font-size:1.15rem;color:var(--leaf)"><b>scm:comment {body}</b></code><br>“Not promoted to Dev: smoke scenarios S3 failed.”</div></div>
    </div>
  </div>
