      acts:
        - name: scm:issues-get
          title: Get an issue
          description: >-
            The API returns a [`301 Moved Permanently`
            status](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api#follow-redirects) if the
            issue was

            [transferred](https://docs.github.com/articles/transferring-an-issue-to-another-repository/) to another
            repository. If

            the issue was transferred to or deleted from a repository where the authenticated user lacks read access,
            the API

            returns a `404 Not Found` status. If the issue was deleted from a repository where the authenticated user
            has read

            access, the API returns a `410 Gone` status. To receive webhook events for transferred and deleted issues,
            subscribe

            to the [`issues`](https://docs.github.com/webhooks/event-payloads/#issues) webhook.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              issue_number:
                description: The number that identifies the issue.
                title: Issue_number
                type: integer
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
              - issue_number
            type: object
        - name: scm:issues-get-comment
          title: Get an issue comment
          description: You can use the REST API to get comments on issues and pull requests. Every pull request is an issue, but
            not every issue is a pull request.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              comment_id:
                description: The unique identifier of the comment.
                format: int64
                title: Comment_id
                type: integer
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
              - comment_id
            type: object
        - name: scm:issues-list-comments
          title: List issue comments
          description: You can use the REST API to list comments on issues and pull requests. Every pull request is an issue, but
            not every issue is a pull request.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              issue_number:
                description: The number that identifies the issue.
                title: Issue_number
                type: integer
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
              since:
                description: "Only show results that were last updated after the given time. This is a timestamp in [ISO
                  8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`."
                format: date-time
                title: Since
                type: string
            required:
              - owner
              - repo
              - issue_number
            type: object
        - name: scm:issues-list-for-repo
          title: List repository issues
          description: "List issues in a repository. Only open issues will be listed. Pull requests are left out: list them with
            github:pulls-list, which filters by labels too."
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              assignee:
                description: Can be the name of a user. Pass in `none` for issues with no assigned user, and `*` for issues assigned to
                  any user.
                title: Assignee
                type: string
              creator:
                description: The user that created the issue.
                title: Creator
                type: string
              direction:
                default: desc
                description: The direction to sort the results by.
                enum:
                  - asc
                  - desc
                title: Direction
                type: string
              labels:
                description: "A list of comma separated label names. Example: `bug,ui,@high`"
                title: Labels
                type: string
              mentioned:
                description: A user that's mentioned in the issue.
                title: Mentioned
                type: string
              milestone:
                description: If an `integer` is passed, it should refer to a milestone by its `number` field. If the string `*` is
                  passed, issues with any milestone are accepted. If the string `none` is passed, issues without
                  milestones are returned.
                title: Milestone
                type: string
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
              since:
                description: "Only show results that were last updated after the given time. This is a timestamp in [ISO
                  8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`."
                format: date-time
                title: Since
                type: string
              sort:
                default: created
                description: What to sort results by.
                enum:
                  - created
                  - updated
                  - comments
                title: Sort
                type: string
              state:
                default: open
                description: Indicates the state of the issues to return.
                enum:
                  - open
                  - closed
                  - all
                title: State
                type: string
            required:
              - owner
              - repo
            type: object
        - name: scm:pulls-get
          title: Get a pull request
          description: Draft pull requests are available in public repositories with GitHub Free and GitHub Free for
            organizations, GitHub Pro, and legacy per-repository billing plans, and in public and private repositories
            with GitHub Team and GitHub Enterprise Cloud. For more information, see [GitHub's
            products](https://docs.github.com/github/getting-started-with-github/githubs-products) in the GitHub Help
            documentation.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              pull_number:
                description: The number that identifies the pull request.
                title: Pull_number
                type: integer
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
              - pull_number
            type: object
        - name: scm:pulls-list
          title: List pull requests
          description: Lists pull requests in a specified repository.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              direction:
                description: "The direction of the sort. Default: `desc` when sort is `created` or sort is not specified, otherwise
                  `asc`."
                enum:
                  - asc
                  - desc
                title: Direction
                type: string
              labels:
                description: "A list of comma separated label names. Example: `bug,ui,@high`"
                title: Labels
                type: string
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
              sort:
                default: created
                description: What to sort results by. `popularity` will sort by the number of comments. `long-running` will sort by date
                  created and will limit the results to pull requests that have been open for more than a month and have
                  had activity within the past month.
                enum:
                  - created
                  - updated
                  - popularity
                  - long-running
                title: Sort
                type: string
              state:
                default: open
                description: Either `open`, `closed`, or `all` to filter by state.
                enum:
                  - open
                  - closed
                  - all
                title: State
                type: string
            required:
              - owner
              - repo
            type: object
        - name: scm:repos-get
          title: Get a repository
          description: The `parent` and `source` objects are present when the repository is a fork. `parent` is the repository
            this repository was forked from, `source` is the ultimate source for the network.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
            type: object
        - name: scm:repos-get-branch
          title: Get a branch
          description: Get a branch
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              branch:
                description: The name of the branch. Cannot contain wildcard characters. To use wildcard characters in branch names, use
                  [the GraphQL API](https://docs.github.com/graphql).
                title: Branch
                type: string
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
              - branch
            type: object
        - name: scm:repos-list-branches
          title: List branches
          description: List branches
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              owner:
                description: The account owner of the repository. The name is not case sensitive.
                title: Owner
                type: string
              protected:
                description: Setting to `true` returns only branches protected by branch protections or rulesets. When set to `false`,
                  only unprotected branches are returned. Omitting this parameter returns all branches.
                title: Protected
                type: boolean
              repo:
                description: The name of the repository without the `.git` extension. The name is not case sensitive.
                title: Repo
                type: string
            required:
              - owner
              - repo
            type: object
        - name: scm:repos-list-for-user
          title: List repositories for a user
          description: Lists public repositories for the specified user.
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            properties:
              direction:
                description: "The order to sort by. Default: `asc` when using `full_name`, otherwise `desc`."
                enum:
                  - asc
                  - desc
                title: Direction
                type: string
              sort:
                default: full_name
                description: The property to sort the results by.
                enum:
                  - created
                  - updated
                  - pushed
                  - full_name
                title: Sort
                type: string
              type:
                default: owner
                description: Limit results to repositories of the specified type.
                enum:
                  - all
                  - owner
                  - member
                title: Type
                type: string
              username:
                description: The handle for the GitHub user account.
                title: Username
                type: string
            required:
              - username
            type: object
