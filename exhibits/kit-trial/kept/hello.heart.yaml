# Generated by artie generate from runs/hello.trace.yaml, the run of hello.goal.md.
# Every selection as that run made it, nested as it nested, with no model.
# What it was offered is pinned in hello.pins.yaml, held to before every act.
# After an act, what it changed is checked: the run stops where that no longer holds.
#   artie run hello.heart.yaml owner=JogoShugh repo=heart-github-test
heart: 1
kind: kept
start: http://localhost:8392/

inputs:
  owner:
    question: Whose repository?
  repo:
    question: Which repository?
  stamp:
    default:
      now: MMdd-HHmm

steps:
  - act: github:repos-get
    fields:
      owner: ${owner}
      repo: ${repo}
    inferred: get repository ${owner}/${repo}
    from-intent: In ${owner}/${repo}
    then:
      - act: github:open-issue
        fields:
          title: Hello from ARTIE (${stamp})
          body: Opened by ARTIE, a generic client that reads what GitHub offers through a HEART gateway.
        intent: Open an issue titled "Hello from ARTIE (${stamp})", saying "Opened by ARTIE, a generic client that reads what GitHub offers through a HEART gateway."
        then:
          - keep-as: issue
  - act: github:issues-get
    fields:
      owner: ${owner}
      repo: ${repo}
      issue_number: ${issue.number}
    inferred: get issue ${issue.number} of ${owner}/${repo}
    from-intent: On {issue}
    then:
      - act: github:comment
        fields:
          body: Each act here was one this issue offered at that moment.
        intent: Comment "Each act here was one this issue offered at that moment."
        then: []
      - act: github:close
        intent: Close it as completed
        then:
          - check:
              - field: state
                is: closed
              - field: state_reason
                is: completed
      - check:
          - field: state
            is: closed
          - field: state_reason
            is: completed
