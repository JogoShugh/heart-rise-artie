heart: 1
kind: kept
start: http://localhost:8400/workspace.json

inputs:
  owner:
    question: Whose repository?
  repo:
    question: Which repository?
  version:
    default: "1.1"
    question: Which release ships?

steps:
  - follow: item
    title: The release job, on the build service
    intent: Follow the link to the release job, on the build service
    then:
      - act: ci:build
        intent: Queue a build of it
        then: []
  - follow: item
    title: The web app, on the deploy service
    intent: Follow the link to the web app, on the deploy service
    then:
      - decide:
          steps:
            - keep-as: app
            - act: cd:deploy
              fields:
                environment: staging
                region: ${app.regions.staging.0.name} # review: step 6 holds it at /regions/staging/0/name, and at /regions/production/0/name too
                release: ${version}
              intent: Deploy release ${version} to an available region of staging
              then:
                - check:
                    - field: status
                      is: deploying
                    - field: environment
                      is: staging
                    - field: region
                      is: ${app.regions.staging.0.name}
                    - field: release
                      is: ${version}
  - follow: item
    title: GitHub
    intent: Follow the link to GitHub
    then:
      - act: github:repos-get
        fields:
          owner: ${owner}
          repo: ${repo}
        inferred: get repository ${owner}/${repo}
        from-intent: In ${owner}/${repo}
        then:
          - act: github:open-issue
            fields:
              title: Release ${version}
              body: Built on the build service and deployed to staging on the deploy service, by one goal across three systems.
            intent: Open an issue titled "Release ${version}", saying "Built on the build service and deployed to staging on the deploy service, by one goal across three systems."
            then: []
