# Generated by artie generate from merge-sim.trace.yaml, the run of merge.goal.md.
# Every selection as that run made it, nested as it nested, with no model.
# What it was offered is pinned in merge.pins.yaml, held to before every act.
# 2 acts in the watch call the model each time one is reached: artie run needs --reasoner.
#   artie run merge.heart.yaml owner=acme repo=web --reasoner claude
heart: 1
kind: kept
start: http://localhost:8098/

inputs:
  owner:
    question: Whose repository?
  repo:
    default: heart-github-test
    question: Which repository?
  label:
    default: dependencies
    question: Which label marks a dependency bump?
  hold:
    default: hold
    question: Which label means a person objects?
  told:
    default: watch-told
    question: Which label marks a pull request the watch has told why?

steps:
  - act: github:repos-get
    fields:
      owner: ${owner}
      repo: ${repo}
    inferred: get repository ${owner}/${repo}
    from-intent: In ${owner}/${repo}
    then:
      - act: github:open-issue
        fields:
          title: Merge watch
          body: Close this issue to stop the watch.
        intent: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."
        then:
          - keep-as: watch
  - watch:
      until:
        - at: watch
          field: state
          is: closed
      steps:
        - act: github:pulls-list
          fields:
            owner: ${owner}
            repo: ${repo}
            labels: ${label}
          inferred: List pull requests in ${owner}/${repo} filtered by label ${label}
          from-intent: a pull request labelled ${label} changes
          then:
            - whenever:
                - has:
                    - field: github:labels
                      has: ${label}
                - leave-where:
                    say: leave it, and say so once.
                    facts:
                      - field: github:labels
                        has: ${hold}
                - leave-where:
                    say: leave it.
                    facts:
                      - field: github:labels
                        has: ${told}
                - once:
                    offered: github:merge
                    give-up: 3m
                    steps:
                      - act: github:merge
                        fields:
                          merge_method: squash
                        intent: merge it by squashing.
                        then: []
                    otherwise:
                      - intent: label it ${told}
                        reasoned: true
                      - intent: "tell its author in one friendly sentence why it wasn't merged and what to do next. The wait gave up, and the server says why: ${why}"
                        reasoned: true
