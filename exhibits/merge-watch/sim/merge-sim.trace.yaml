---
run:
  inputs:
    owner:
      value: acme
      given: given
      question: Whose repository?
    repo:
      value: web
      given: given
      default: heart-github-test
      question: Which repository?
    label:
      value: dependencies
      given: default
      default: dependencies
      question: Which label marks a dependency bump?
    hold:
      value: hold
      given: default
      default: hold
      question: Which label means a person objects?
    told:
      value: watch-told
      given: default
      default: watch-told
      question: Which label marks a pull request the watch has told why?
  source: |-
    act(intent = "get repository $owner/$repo")
    act(intent = """Open an issue titled "Merge watch" with body: Close this issue to stop the watch.""")
  marks:
    '1':
      fromIntent: In ${owner}/${repo}
    '2':
      as: watch
      intent: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."
  moves:
    - 'why: Open the repository acme/web as the step says.'
    - 'get repository acme/web: acted github:repos-get, done, at http://localhost:8098/repos/acme/web'
    - 'why: The repository acme/web is open, which is all this step asks for.'
    - 'done: In acme/web'
    - 'why: The repository is held and offers github:open-issue, so I''ll open the watch issue.'
    - 'Open an issue titled "Merge watch" with body: Close this issue to stop the watch.: acted github:open-issue, new resource, at http://localhost:8098/repos/acme/web/issues/483'
    - 'why: The issue "Merge watch" was created (#483) with the requested body, so the step''s work is done.'
    - 'done: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."'
    - 'why: The repository offers no link to pull requests, so I''ll go back to the start, which may have a form that lists them.'
    - back to the start, at http://localhost:8098/
    - 'why: github:pulls-list filters by labels, so use it to list open pull requests in acme/web labelled dependencies.'
    - 'List pull requests in acme/web filtered by label dependencies: decided github:pulls-list, at http://localhost:8098/'
    - 'why: The held pull request must be labelled dependencies, which its embedded labels show.'
    - 'whenever: a pull request labelled dependencies changes: decided the check {"github:labels":["dependencies"]}, at http://localhost:8098/repos/acme/web/pulls/482'
    - 'why: The condition is that the pull request carries the hold label, so check that its labels include $hold.'
    - 'if: it''s labelled hold: decided the check {"github:labels":["hold"]}, at http://localhost:8098/repos/acme/web/pulls/482'
    - 'why: The condition is that the pull request carries the watch-told label, so check that its labels include $told.'
    - 'if: it''s labelled watch-told: decided the check {"github:labels":["watch-told"]}, at http://localhost:8098/repos/acme/web/pulls/482'
    - 'stop: refused once, this step waits: name the form its act needs, even when it isn''t offered now; stop again to end the run'
    - 'why: The step waits until the pull request can be merged, which means the github:merge form is offered.'
    - 'once: waits for github:merge'
    - 'why: github:merge is now offered and the pull request is mergeable, so merge it by squashing.'
    - 'Merge the pull request by squashing.: decided github:merge, at http://localhost:8098/repos/acme/web/pulls/482'
    - 'why: The squash merge was answered by the server and the pull request now shows merged and closed, so this step is done.'
    - 'why: The watch ends once issue 483 is closed, so check that its state is closed.'
    - 'until: someone closes http://localhost:8098/repos/acme/web/issues/483: decided the check {"state":"closed"}, at http://localhost:8098/repos/acme/web/issues/483'
    - 'watched: Whenever a pull request labelled dependencies changes, until someone closes http://localhost:8098/repos/acme/web/issues/483'
  model:
    name: claude-sonnet-5-5
    url: https://api.anthropic.com
  usage:
    calls: 14
    input: 26276
    output: 2564
    cache_read: 16018
    cache_write: 8896
  watch:
    from: 5
    script: |-
      watch(until = { at("watch") { "state" eq "closed" } }) {
          act("github:pulls-list", "owner" to owner, "repo" to repo, "labels" to label, inferred = "List pull requests in ${owner}/${repo} filtered by label ${label}", fromIntent = "a pull request labelled ${label} changes") {
              whenever {
                  has { "github:labels" has label }
                  leaveWhere("leave it, and say so once.") { "github:labels" has hold }
                  leaveWhere("leave it.") { "github:labels" has told }
                  once("github:merge", giveUp = 3.minutes, otherwise = { why ->
                      act(intent = "label it ${told}")
                      act(intent = "tell its author in one friendly sentence why it wasn't merged and what to do next. The wait gave up, and the server says why: ${why ?: "no reason given"}")
                  }) {
                      act("github:merge", "merge_method" to "squash", intent = "merge it by squashing.") {}
                  }
              }
          }
      }
    steps:
      - watch:
          until:
            - at: watch
              field: state
              is: closed
          steps:
            - act: github:pulls-list
              fields:
                owner: ${owner}
                repo: ${repo}
                labels: ${label}
              inferred: List pull requests in ${owner}/${repo} filtered by label ${label}
              from-intent: a pull request labelled ${label} changes
              then:
                - whenever:
                    - has:
                        - field: github:labels
                          has: ${label}
                    - leave-where:
                        say: leave it, and say so once.
                        facts:
                          - field: github:labels
                            has: ${hold}
                    - leave-where:
                        say: leave it.
                        facts:
                          - field: github:labels
                            has: ${told}
                    - once:
                        offered: github:merge
                        give-up: 3m
                        steps:
                          - act: github:merge
                            fields:
                              merge_method: squash
                            intent: merge it by squashing.
                            then: []
                        otherwise:
                          - intent: label it ${told}
                            reasoned: true
                          - intent: 'tell its author in one friendly sentence why it wasn''t merged and what to do next. The wait gave up, and the server says why: ${why}'
                            reasoned: true
