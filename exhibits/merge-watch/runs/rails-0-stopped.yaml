            - id: repos-get
              type: safe
              title: Get a repository
              doc:
                format: text
                value: The `parent` and `source` objects are present when the repository is a fork. `parent` is the repository this repository was forked from, `source` is the ultimate source for the network.
            - id: repos-list-branches
              type: safe
              title: List branches
