              type: safe
              title: List repository issues
              doc:
                format: text
                value: 'List issues in a repository. Only open issues will be listed. Pull requests are left out: list them with github:pulls-list, which filters by labels too.'
            - id: issues-get-comment
              type: safe
              title: Get an issue comment
              doc:
                format: text
                value: You can use the REST API to get comments on issues and pull requests. Every pull request is an issue, but not every issue is a pull request.
            - id: issues-get
              type: safe
              title: Get an issue
              doc:
                format: text
                value: |-
                  The API returns a [`301 Moved Permanently` status](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api#follow-redirects) if the issue was
                  [transferred](https://docs.github.com/articles/transferring-an-issue-to-another-repository/) to another repository. If
                  the issue was transferred to or deleted from a repository where the authenticated user lacks read access, the API
                  returns a `404 Not Found` status. If the issue was deleted from a repository where the authenticated user has read
                  access, the API returns a `410 Gone` status. To receive webhook events for transferred and deleted issues, subscribe
                  to the [`issues`](https://docs.github.com/webhooks/event-payloads/#issues) webhook.
            - id: issues-list-comments
              type: safe
              title: List issue comments
              doc:
                format: text
                value: You can use the REST API to list comments on issues and pull requests. Every pull request is an issue, but not every issue is a pull request.
            - id: issues-list-sub-issues
              type: safe
              title: List sub-issues
              doc:
                format: text
                value: You can use the REST API to list the sub-issues on an issue.
            - id: pulls-list
              type: safe
              title: List pull requests
              doc:
                format: text
                value: Lists pull requests in a specified repository.
            - id: pulls-get
              type: safe
              title: Get a pull request
              doc:
                format: text
                value: Draft pull requests are available in public repositories with GitHub Free and GitHub Free for organizations, GitHub Pro, and legacy per-repository billing plans, and in public and private repositories with GitHub Team and GitHub Enterprise Cloud. For more information, see [GitHub's products](https://docs.github.com/github/getting-started-with-github/githubs-products) in the GitHub Help documentation.
            - id: users-get-authenticated
              type: safe
              title: Get the authenticated user
              doc:
                format: text
                value: OAuth app tokens and personal access tokens (classic) need the `read:user` scope, or the broader `user` scope, for this endpoint to return the private user response. The private user response includes additional fields such as `private_gists`, `total_private_repos`, `owned_private_repos`, `disk_usage`, `collaborators`, and `two_factor_authentication`. Tokens without these scopes receive the public user response.
            - id: repos-list-for-user
              type: safe
              title: List repositories for a user
              doc:
                format: text
                value: Lists public repositories for the specified user.
