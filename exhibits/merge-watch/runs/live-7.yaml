run:
  inputs:
    owner:
      value: JogoShugh
      given: given
      question: Whose repository?
    repo:
      value: heart-github-test
      given: default
      default: heart-github-test
      question: Which repository?
    label:
      value: dependencies
      given: default
      default: dependencies
      question: Which label marks a dependency bump?
    hold:
      value: hold
      given: default
      default: hold
      question: Which label means a person objects?
    told:
      value: watch-told
      given: default
      default: watch-told
      question: Which label marks a pull request the watch has told why?
  source: |-
    act(intent = "get the repository $owner/$repo")
    act(intent = """open an issue titled "Merge watch" with body "Close this issue to stop the watch."""")
  marks:
    '1':
      fromIntent: In ${owner}/${repo}
    '2':
      as: watch
      intent: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."
  moves:
    - 'why: Reach the repository resource so the sub-steps can start from it.'
    - 'get the repository JogoShugh/heart-github-test: acted github:repos-get, done, at https://localhost:8392/repos/JogoShugh/heart-github-test'
    - 'why: The repository resource is held, so the step that reaches it is complete.'
    - 'done: In JogoShugh/heart-github-test'
    - 'why: The repository is held and offers github:open-issue, so I''ll open the watch issue.'
    - 'open an issue titled "Merge watch" with body "Close this issue to stop the watch.": acted github:open-issue, new resource, at https://localhost:8392/repos/JogoShugh/heart-github-test/issues/882'
    - 'why: The watch issue "Merge watch" was created (#882) with the required body, so the step is complete.'
    - 'done: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."'
    - 'why: The repository offers no pull request list link or form, so I''m going back to the start, which may offer a form for the filtered list.'
    - back to the start, at https://localhost:8392/
    - 'why: The start offers github:pulls-list, which can filter by label, so I''ll list pull requests labelled $label in $owner/$repo.'
    - 'list the pull requests of JogoShugh/heart-github-test filtered by label dependencies: decided github:pulls-list, at https://localhost:8392/'
    - 'why: The held pull request is labelled dependencies, so check that the labels relation includes it.'
    - 'whenever: a pull request labelled dependencies changes: decided the check {"github:labels":["dependencies"]}, at https://localhost:8392/repos/JogoShugh/heart-github-test/pulls/881'
    - 'why: The condition is whether the held pull request is labelled hold, so check that the labels relation includes it.'
    - 'if: it''s labelled hold: decided the check {"github:labels":["hold"]}, at https://localhost:8392/repos/JogoShugh/heart-github-test/pulls/881'
    - 'why: The condition is whether the held pull request is labelled watch-told, so check that the labels relation includes it.'
    - 'if: it''s labelled watch-told: decided the check {"github:labels":["watch-told"]}, at https://localhost:8392/repos/JogoShugh/heart-github-test/pulls/881'
  usage:
    calls: 10
    input: 20043
    output: 1885
    cache_read: 10182
    cache_write: 6779
  watch:
    from: 5
    script: |-
      watch(until = { that(false) }) {
          act("github:pulls-list", "owner" to owner, "repo" to repo, "labels" to label, inferred = "list the pull requests of ${owner}/${repo} filtered by label ${label}", fromIntent = "a pull request labelled ${label} changes") {
              whenever {
                  has { "github:labels" has label }
                  leaveWhere("leave it, and say so once.") { "github:labels" has hold }
                  leaveWhere("leave it.") { "github:labels" has told }
                  // once it can be merged: not decided
              }
          }
      }
