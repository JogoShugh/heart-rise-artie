# Generated by artie generate from runs/yaml/goal-claude.trace.yaml, the run of merge.goal.md.
# The run in words: its shape as it nested, each act said in words for the reasoner to choose on every run.
# What it was offered is pinned in yaml/merge.intent.pins.yaml, held to before every act.
# 2 steps call the model on every run, and 4 acts in the watch each time one is reached: artie run needs --reasoner.
#   artie run yaml/merge.intent.heart.yaml owner=JogoShugh --reasoner claude
heart: 1
kind: intent
start: https://localhost:8393/

inputs:
  owner:
    question: Whose repository?
  repo:
    default: heart-github-test
    question: Which repository?
  label:
    default: dependencies
    question: Which label marks a dependency bump?
  hold:
    default: hold
    question: Which label means a person objects?
  told:
    default: watch-told
    question: Which label marks a pull request the watch has told why?

steps:
  - inferred: get repository ${owner}/${repo}
    from-intent: In ${owner}/${repo}
    then:
      - intent: Open an issue titled "Merge watch", saying "Close this issue to stop the watch."
        then:
          - keep-as: watch
  - at: https://localhost:8393/
    steps:
      - watch:
          until:
            - at: watch
              field: state
              is: closed
          steps:
            - inferred: list pull requests of ${owner}/${repo} filtered by label ${label}
              from-intent: a pull request labelled ${label} changes
              then:
                - whenever:
                    - has:
                        - field: github:labels
                          has: ${label}
                    - leave-where:
                        say: leave it, and say so once.
                        facts:
                          - field: github:labels
                            has: ${hold}
                    - leave-where:
                        say: leave it.
                        facts:
                          - field: github:labels
                            has: ${told}
                    - once:
                        offered: github:merge
                        give-up: 3m
                        steps:
                          - intent: merge it by squashing.
                            then: []
                        otherwise:
                          - intent: label it ${told}
                            reasoned: true
                          - intent: "tell its author in one friendly sentence why it wasn't merged and what to do next. The wait gave up, and the server says why: ${why}"
                            reasoned: true
