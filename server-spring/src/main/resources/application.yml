# application.yml
#
# Two separate connection URLs to the SAME database, on purpose:
#   spring.r2dbc.url  -- what the app actually uses at runtime,
#                        reactive/non-blocking, what CoroutineCrudRepository
#                        talks to.
#   spring.flyway.url -- Flyway itself doesn't speak R2DBC; it needs a
#                        plain blocking JDBC URL to run migrations at
#                        startup. This is a normal, common pattern for
#                        R2DBC + Flyway together, not a mistake.

spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gardenbed}
    username: ${DB_USER:artie}
    password: ${DB_PASSWORD:artie}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gardenbed}
    user: ${DB_USER:artie}
    password: ${DB_PASSWORD:artie}
    locations: classpath:db/migration

server:
  port: 8080

# SPEC §6.11.1: the highest rung served (L0, L1 or L2). Set HEART_MAX_RUNG
# to stand up a server that is earlier on the ladder.
heart:
  max-rung: ${HEART_MAX_RUNG:L2}
  # SPEC §6.11: the most items in one page of a collection.
  page-size: ${HEART_PAGE_SIZE:20}

# From OpenAPI to HEART: GARDEN_FROST=true is Tuesday. A hard frost (the
# operator's POST /actuator/frost) can freeze a planted bed, which then offers
# only thaw; the OpenAPI description at /openapi.json becomes version 1.1.0.
garden:
  frost:
    enabled: ${GARDEN_FROST:false}

# Actuator exposes only the operator's frost, and only where it exists.
management:
  endpoints:
    web:
      exposure:
        include: frost

logging:
  level:
    org.springframework.r2dbc: INFO
    com.artie.gardenbed: DEBUG
