cucumber.publish.quiet=true
cucumber.glue=steps
cucumber.features=classpath:features
# Outline rows are named by their scenario with the row's values filled in.
cucumber.junit-platform.naming-strategy=short
cucumber.junit-platform.naming-strategy.short.example-name=pickle
# @live scenarios need a running server (liveTest task); @llm ones need ANTHROPIC_API_KEY (llmTest task);
# @auth-live ones need the services and Vault that scripts/auth-check.sh starts (authLiveTest task).
cucumber.filter.tags=not @live and not @llm and not @explore and not @auth-live
