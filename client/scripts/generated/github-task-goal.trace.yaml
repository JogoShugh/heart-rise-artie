---
run:
  inputs:
    owner:
      value: JogoShugh
      given: given
      question: Whose repository?
    repo:
      value: heart-github-test
      given: default
      default: heart-github-test
      question: Which repository?
    stamp:
      value: 1020-225446
      given: default
      default: 1020-225446
      now: MMdd-HHmmss
  source: |-
    act(intent = "get repository $owner/$repo")
    act(intent = """open an issue titled "Crash when a bed has no name (reasoned)" with body "Opened by a HEART script."""")
    act(intent = "get repository $owner/$repo")
    act(intent = "create a branch named fix-blank-names-reasoned-1020-225446 from the main branch")
    act(intent = "create a git ref named refs/heads/fix-blank-names-reasoned-1020-225446 from the tip of the main branch")
    act(intent = "follow the git-refs link to look for a form to create a branch ref")
    act(intent = "follow the github:git-refs link of this repository")
    act(intent = "follow the github:branches link")
    act(intent = """follow the github:git-refs link (the "git-refs" relation in the links list)""")
    act(intent = "follow the github:git-refs link to reach the git references")
    act(intent = "follow the git-refs link")
    act(intent = "follow the github:git link")
    act(intent = "follow the github:git-refs link")
    act(intent = "follow the github:git-refs link")
    act(intent = "get the branch main of repository $owner/$repo")
    act(intent = "start a new branch named fix-blank-names-reasoned-$stamp")
    act(intent = """commit a file named fix-reasoned-$stamp.md with content "Bed names may not be blank." and commit message "Refuse a bed with no name"""")
    act(intent = """open a pull request into main titled "Refuse a bed with no name (reasoned)" with body "Relates to #144."""")
    until(tries = 20) { offers("github:merge") }
    act(intent = "merge the pull request by squashing its commits")
    check("merged" to true)
    act(intent = "get issue number 144 of repository $owner/$repo")
    act(intent = "comment on it: Fixed in 1.2 by #145.")
    act(intent = "close the issue as completed")
    check("state" to "closed", "state_reason" to "completed")
