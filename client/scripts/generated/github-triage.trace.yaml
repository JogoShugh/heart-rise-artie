run:
  inputs:
    owner:
      value: JogoShugh
      given: given
      question: Whose repository?
    repo:
      value: heart-github-test
      given: default
      default: heart-github-test
      question: Which repository?
    label:
      value: bug
      given: default
      default: bug
      question: Which label marks a bug?
    stamp:
      value: 1021-220221
      given: default
      default: 1021-220221
      now: MMdd-HHmmss
  source: |-
    act(intent = "get the repository $owner/$repo")
    act(intent = """Open an issue titled "Crash when a bed has no name ($stamp)" with body: A bed with a blank name crashes the garden.""")
    act(intent = "label it $label")
    act(intent = "assign it to $owner")
    check("state" to "open")
    act(intent = """open an issue titled "Test blank bed names ($stamp)" with body: This is part of #165.""")
    act(intent = """open an issue titled "Garden crashes on an empty bed name ($stamp)" with body: It was seen on the demo garden.""")
    act(intent = "list the branches of the repository")
    act(intent = "list the branches of the repository")
    act(intent = "open the branch main")
    act(intent = "start a new branch from here named fix-blank-names-$stamp")
    act(intent = """commit a file named fix-1021-220221.md with content "Bed names may not be blank." and the commit message "Refuse a bed with no name"""")
    act(intent = """commit a file named test-1021-220221.md with content "A bed with a blank name is refused." and the commit message "Test that a blank bed name is refused"""")
    act(intent = """open a pull request into main titled "Refuse a bed with no name ($stamp)" with body: This fixes #165.""")
    act(intent = "change its description to: This fixes #165 and is tested by #166.")
    until(tries = 20) { offers("github:merge") }
    act(intent = """merge it by squashing its commits, with the commit title "Refuse a bed with no name (#168)"""")
    check("merged" to true)
    act(intent = "get issue 165 of $owner/$repo")
    act(intent = "add the test issue as a sub-issue of this one, by its id 5971693115")
    act(intent = "comment on it: Fixed in #168, tested in #166.")
    act(intent = "lock the conversation as resolved")
    check("state" to "closed", "state_reason" to "completed", "locked" to true)
    act(intent = "get issue 166 of $owner/$repo")
    act(intent = "comment on it: The test went in with #168.")
    act(intent = "close it as completed")
    check("state" to "closed")
    act(intent = "get issue 167 of $owner/$repo")
    act(intent = "comment on it: Same crash as #165.")
    act(intent = "close it as a duplicate of the issue whose id is 5971687040")
    check("state" to "closed", "state_reason" to "duplicate")
  marks:
    '2':
      as: issue
    '6':
      as: test
    '7':
      as: dupe
    '14':
      as: pr
