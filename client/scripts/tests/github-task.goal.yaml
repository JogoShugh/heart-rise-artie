# A plain-text task (spec/PLAN-PLAIN-TEXT-RUN.md): where to start, what varies per run, and the goal in words.
#   artie run github-task.goal.yaml owner=JogoShugh --reasoner claude --rung L2 --trace github-task.trace.yaml
#   artie generate github-task.trace.yaml --out github-task-from-goal.kts --script github-task.goal.yaml
#
# Inputs, as a script's input() declares them. A value given when running (owner=JogoShugh) wins; then the
# default; with neither, the run asks the question, or stops before its first request when no one can answer.
#   name: value                 short for a default
#   name:                       no default: must be given, or asked
#   name: { default, question } either or both
#   default: { now: PATTERN }   a fresh value each run: the time now, as a java.time pattern
start: http://localhost:8392/
inputs:
  owner:
    question: Whose repository?
  repo:
    default: heart-github-test
    question: Which repository?
  stamp:
    default: { now: MMdd-HHmmss }
goal: |
  In $owner/$repo, open an issue titled "Crash when a bed has no name (reasoned)", saying it was opened by a
  HEART script.
  From the main branch, start a new branch named fix-blank-names-reasoned-$stamp, commit a file named
  fix-reasoned-$stamp.md to it saying "Bed names may not be blank." with the message "Refuse a bed with no name",
  and open a pull request into main titled "Refuse a bed with no name (reasoned)", saying it relates to the issue.
  Wait until the pull request can be merged, merge it by squashing its commits, and make sure it merged.
  Then go back to the issue, comment "Fixed in 1.2 by #<the pull request's number>.", and close it as completed.
  Make sure it is closed as completed.
