cucumber.publish.quiet=true
cucumber.glue=steps
cucumber.features=classpath:features
# Outline rows are named by their scenario with the row's values filled in.
cucumber.junit-platform.naming-strategy=short
cucumber.junit-platform.naming-strategy.short.example-name=pickle
# @live scenarios need a running server; only the liveTest task runs them.
cucumber.filter.tags=not @live
