# Youth baseball scoring, 8U coach pitch. Its own Postgres database, `baseball`, in the shared
# container (server-spring/docker-compose.yml; reset-db.sh creates it); its own HTTP and CoAP ports.
spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:baseball}
    username: ${DB_USER:artie}
    password: ${DB_PASSWORD:artie}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:baseball}
    user: ${DB_USER:artie}
    password: ${DB_PASSWORD:artie}

server:
  port: ${PORT:8383}

heart:
  title: Youth baseball scoring
  max-rung: ${HEART_MAX_RUNG:L2}
  page-size: ${HEART_PAGE_SIZE:20}
  coap:
    port: ${COAP_PORT:5686}
